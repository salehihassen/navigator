<script>
  /* Resolve the theme before first paint so there is no flash of the wrong palette. */
  (function () {
    var pref = "system";
    try { pref = localStorage.getItem("ta-d-theme") || "system"; } catch (e) {}
    var light = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
    var theme = pref === "light" || pref === "dark" ? pref : (light ? "light" : "dark");
    var el = document.documentElement;
    el.setAttribute("data-theme", theme);
    el.setAttribute("data-theme-pref", pref);
    var meta = document.createElement("meta");
    meta.name = "theme-color"; meta.content = theme === "light" ? "#e6eef8" : "#04060d";
    document.head.appendChild(meta);
  })();
</script>

<style>
  /* =====================================================================

    --menu-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    --scrim: rgba(2, 4, 10, 0.55);
    --media-bg: #151b2e;
    --on-accent: #0b0f1c;
    --on-primary: #ffffff;
    --primary-a: #6d8bff;
    --primary-b: #8b5cf6;
    --primary-glow: rgba(109, 139, 255, 0.35);
    --danger: #f87171;
    --danger-soft: rgba(239, 68, 68, 0.15);
    --danger-a: #ef4444;
    --danger-b: #be123c;
    --danger-text: #fca5a5;
    --success: #4ade80;
    --live: #6ee7b7;
    --warn: #fbbf24;
    --hero-fade: linear-gradient(180deg, rgba(8,10,20,.2) 0%, rgba(8,10,20,0) 35%, rgba(12,15,27,.94) 100%);
    --hero-text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
    --chip-base: rgba(0, 0, 0, 0.4);
    --chip-text: #ffffff;
    --vignette: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(2,3,8,.75) 100%);
    --stars-op: 1;
    --nebula-op: 1;
    --daysky-op: 0;

    --cover-shade: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);
    --planned-img: saturate(.6) brightness(.85);
    --tag-hash: var(--accent);
    --polaroid: #f8f6f1;
    --polaroid-ink: #1f2937;
    /* overlays that sit on top of photos: identical in both themes */

    --on-img-bg-strong: rgba(0, 0, 0, 0.7);
    --on-img-line: rgba(255, 255, 255, 0.18);
    --on-img-text: #ffffff;
    --on-img-muted: #e2e8f0;
    --lb-bg: rgba(2, 3, 8, 0.94);
    /* source brand colours */
    --src-immich: #8fb0ff;
    --src-local: #cbd5e1;
    --src-web: #93c5fd;
    --src-yt: rgba(230, 0, 35, 0.9);
    --src-tt: rgba(10, 10, 10, 0.88);
    --src-tt-a: #25f4ee;
    --src-tt-b: #fe2c55;
    --src-ig: linear-gradient(135deg, rgba(131,58,180,.88), rgba(253,29,29,.88) 60%, rgba(252,176,69,.88));
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #e6eef8;
    --glass: rgba(255, 255, 255, 0.74);
    --glass-strong: rgba(255, 255, 255, 0.9);
    --glass-modal: rgba(255, 255, 255, 0.96);
    --glass-solid: #ffffff;
    --glass-filter: blur(22px) saturate(180%);
    --line: rgba(15, 23, 42, 0.09);
    --line-strong: rgba(15, 23, 42, 0.18);
    --text: #0f172a;
    --text-2: #334155;
    --muted: #4f5d75;
    --dim: #64718a;
    --strong: #0b1220;
    --accent: #4f6bed;
    --accent-2: #7c3aed;
    --fill-1: rgba(15, 23, 42, 0.035);
    --fill-2: rgba(15, 23, 42, 0.06);
    --fill-3: rgba(15, 23, 42, 0.09);
    --seg-on: #ffffff;
    --seg-on-shadow: 0 1px 2px rgba(15,23,42,.12), 0 4px 12px rgba(15,23,42,.08);
    --shadow: 0 18px 50px rgba(30, 41, 59, 0.16), 0 2px 6px rgba(30, 41, 59, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    --shadow-sm: 0 4px 14px rgba(30, 41, 59, 0.14);
    --menu-shadow: 0 20px 50px rgba(30, 41, 59, 0.22);
    --scrim: rgba(15, 23, 42, 0.32);
    --media-bg: #dfe6f0;
    --on-accent: #0b0f1c;
    --primary-a: #5a78f5;
    --primary-b: #7c3aed;
    --primary-glow: rgba(79, 107, 237, 0.3);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.1);
    --danger-a: #ef4444;
    --danger-b: #be123c;
    --danger-text: #b91c1c;
    --success: #15803d;
    --live: #10b981;
    --warn: #d97706;
    --hero-fade: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,.7) 68%, rgba(250,252,255,.97) 100%);
    --hero-text-shadow: 0 1px 14px rgba(255, 255, 255, 0.9);
    --chip-base: rgba(255, 255, 255, 0.86);
    --chip-text: #0f172a;
    --vignette: radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(120,150,190,.22) 100%);
    --stars-op: 0;
    --nebula-op: 0;
    --daysky-op: 1;
    --attrib-bg: rgba(255, 255, 255, 0.75);
    --scrollbar: rgba(15, 23, 42, 0.16);
    --brand-glow: rgba(79, 107, 237, 0.35);

    --polaroid: #ffffff;
    --src-local: #64748b;
    --src-web: #2563eb;
    --src-immich: #4f6bed;
  }
  /* source icon colours on photo badges use the dark-photo palette in both themes */
  .on-img { --src-immich: #8fb0ff; --src-local: #cbd5e1; --src-web: #93c5fd; }

  :root {
    --radius: 18px;
    --top: 84px;
    --panel-w: 432px;
    --detail-w: 452px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --sheet-vis: 0px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root[data-density="compact"] { --panel-w: 340px; }

  /* theme change: briefly animate colours everywhere, never layout */
  html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
    transition: background-color .45s ease, color .45s ease, border-color .45s ease, box-shadow .45s ease, fill .45s ease, stroke .45s ease, opacity .45s ease !important;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-size: 14px; -webkit-font-smoothing: antialiased; }
  body { height: 100dvh; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
  img { display: block; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- sky backdrop + map ---------- */
  #stars { position: fixed; inset: 0; z-index: 0; opacity: var(--stars-op); transition: opacity .6s; }
  .nebula { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--nebula-op); transition: opacity .6s;
    background:
      radial-gradient(60% 50% at 78% 18%, rgba(88, 60, 200, .18), transparent 70%),
      radial-gradient(50% 45% at 12% 85%, rgba(14, 116, 144, .16), transparent 70%),
      radial-gradient(40% 40% at 50% 50%, rgba(30, 58, 138, .12), transparent 70%); }
  .daysky { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--daysky-op); transition: opacity .6s;
    background:
      radial-gradient(70% 55% at 75% 12%, rgba(255, 244, 222, .85), transparent 70%),
      radial-gradient(60% 50% at 10% 90%, rgba(196, 222, 248, .9), transparent 70%),
      linear-gradient(180deg, #b7d2ef 0%, #d4e4f5 40%, #eaf1f9 75%, #f4f1ea 100%); }
  #map { position: fixed; inset: 0; z-index: 1; }
  .maplibregl-canvas { outline: none; }
  .maplibregl-ctrl-attrib { background: var(--attrib-bg) !important; color: var(--dim); font-size: 10px; border-radius: 8px 0 0 0; }
  .maplibregl-ctrl-attrib a { color: var(--muted) !important; }
  :root[data-theme="dark"] .maplibregl-ctrl-attrib-button { filter: invert(1); }
  .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: var(--vignette); }
  body.picking .vignette { box-shadow: inset 0 0 0 3px var(--pick, var(--accent)); }
  body.picking #map, body.picking .maplibregl-canvas { cursor: crosshair !important; }

  .glass { background: var(--glass); backdrop-filter: var(--glass-filter); -webkit-backdrop-filter: var(--glass-filter);
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* ---------- top bar ---------- */
  .topbar { position: fixed; z-index: 20; top: 14px; left: 14px; right: 14px; height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: "Space Grotesk", Inter, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .2px; white-space: nowrap; margin-right: 6px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 50%; position: relative; flex: none;
    background: radial-gradient(circle at 35% 30%, #a5b8ff, #3b5bdb 45%, #111a3d 75%);
    box-shadow: 0 0 18px var(--brand-glow), inset -4px -5px 10px rgba(0,0,0,.5); }
  .brand-mark::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); transform: rotate(-20deg) scaleY(.38); }
  .brand small { font-family: Inter; font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 2px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--fill-1); border: 1px solid var(--line); border-radius: 11px; }
  .seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 13px; transition: .2s var(--ease); white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--seg-on); color: var(--strong); box-shadow: var(--seg-on-shadow); }
  .seg button .dot { width: 7px; height: 7px; border-radius: 50%; }
  .seg .dot.solid { background: var(--text); box-shadow: 0 0 8px color-mix(in srgb, var(--text) 60%, transparent); }
  .seg .dot.dashed { border: 1.5px dashed var(--text); width: 8px; height: 8px; }
  .seg.icons button { padding: 6px 8px; }
  .seg-sm button { padding: 4px 10px; font-size: 12px; }
  .spacer { flex: 1; }
  .search { position: relative; display: flex; align-items: center; width: 250px; }
  .search > svg { position: absolute; left: 11px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; height: 36px; padding: 0 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--fill-1); outline: none; transition: .2s; }
  .search input::placeholder { color: var(--dim); }
  .search input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: var(--fill-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
  .search kbd { position: absolute; right: 9px; font: 11px Inter; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .search .s-cancel { display: none; }
  .m-only { display: none !important; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 13px; white-space: nowrap; transition: .2s var(--ease); }
  .btn-primary { color: var(--on-primary); background: linear-gradient(135deg, var(--primary-a), var(--primary-b)); box-shadow: 0 6px 22px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn-primary:disabled { opacity: .45; transform: none; cursor: not-allowed; }
  .btn-ghost { color: var(--text); background: var(--fill-2); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--fill-3); }
  .btn-danger { color: var(--on-primary); background: linear-gradient(135deg, var(--danger-a), var(--danger-b)); box-shadow: 0 6px 20px var(--danger-soft); }
  .btn-sm { height: 30px; padding: 0 11px; font-size: 12px; border-radius: 9px; }
  .icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 10px; color: var(--muted); transition: .2s; flex: none; }
  .icon-btn:hover { color: var(--strong); background: var(--fill-3); }

  /* overflow menu (mobile) */
  .menu { position: fixed; z-index: 30; top: calc(var(--m-top, 80px) + 6px); right: 8px; width: min(320px, calc(100vw - 16px)); padding: 14px; background: var(--glass-strong);
    opacity: 0; transform: translateY(-8px) scale(.98); transform-origin: top right; pointer-events: none; transition: .25s var(--ease); }
  .menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .menu .m-row { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
  .menu .m-row:last-child { margin-bottom: 0; }
  .menu .lbl { margin: 0; }
  .menu .seg { width: 100%; }
  .menu .seg button { flex: 1; min-height: 40px; }

  /* ---------- trip list panel ---------- */
  #tripPanel { position: fixed; z-index: 10; top: var(--top); left: 14px; bottom: 44px; width: var(--panel-w); display: flex; flex-direction: column; overflow: hidden;
    transition: width .45s var(--ease), transform .45s var(--ease); }
  .panel-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .ph-row { display: flex; align-items: center; gap: 10px; }
  .ph-row + .ph-row { margin-top: 10px; }
  .panel-head h1 { margin: 0; font: 600 15px "Space Grotesk", Inter; letter-spacing: .2px; }
  .stats { display: flex; gap: 6px; margin-top: 10px; }
  .stat { flex: 1; padding: 7px 10px; border-radius: 11px; background: var(--fill-1); border: 1px solid var(--line); }
  .stat b { display: block; font: 600 15px "Space Grotesk", Inter; }
  .stat span { font-size: 11px; color: var(--muted); }
  .drawer-handle { display: none; }
  .trip-list { flex: 1; overflow-y: auto; padding: 6px 8px 14px; overscroll-behavior: contain; scroll-padding-top: 30%; }
  .trip-list::after { content: ""; display: block; height: 18%; } /* breathing room under the last card */
  .group-title { display: flex; align-items: center; gap: 8px; margin: 14px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); }
  .group-title .count { font-weight: 500; color: var(--dim); letter-spacing: 0; text-transform: none; }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .year { margin: 12px 10px 6px; font: 600 11px "Space Grotesk"; color: var(--dim); }

  /* follow toggle + status */
  .toggle { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle .sw { width: 34px; height: 20px; border-radius: 20px; background: var(--fill-3); position: relative; transition: .25s; flex: none; box-shadow: inset 0 0 0 1px var(--line); }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--glass-solid); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: .25s var(--ease); }
  :root[data-theme="dark"] .toggle .sw::after { background: #fff; }
  .toggle.on .sw { background: var(--accent); box-shadow: none; }
  .toggle.on .sw::after { left: 16px; background: #fff; }
  .toggle.mini { font-size: 12px; gap: 7px; }
  .toggle.mini .sw { width: 28px; height: 16px; }
  .toggle.mini .sw::after { width: 12px; height: 12px; }
  .toggle.mini.on .sw::after { left: 14px; }
  .follow-state { font-size: 11px; color: var(--dim); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .follow-state .led { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .follow-state.live .led { background: var(--live); box-shadow: 0 0 8px var(--live); }
  .follow-state.paused { color: var(--warn); }
  .follow-state.paused .led { background: var(--warn); }

  /* compact rows (Variant A) */
  .trip { position: relative; display: flex; gap: 12px; align-items: center; width: 100%; padding: 8px; border-radius: 13px; text-align: left; transition: background .2s, transform .2s var(--ease), opacity .3s; cursor: pointer; }
  .trip:hover { background: var(--fill-2); }
  .trip.active { background: color-mix(in srgb, var(--c) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); }
  .trip.hl { background: var(--fill-2); }
  .trip.following { box-shadow: inset 3px 0 0 var(--c); background: color-mix(in srgb, var(--c) 8%, transparent); }
  .trip .thumb { position: relative; width: 54px; height: 54px; border-radius: 11px; overflow: hidden; flex: none; background: var(--media-bg); }
  .trip .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .trip .thumb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .trip.planned .thumb img { filter: var(--planned-img); }
  .trip .info { flex: 1; min-width: 0; }
  .trip .title { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 70%, transparent); flex: none; }
  .planned .cdot { background: transparent; border: 1.5px dashed var(--c); box-shadow: none; width: 9px; height: 9px; }
  .trip .sub { margin-top: 3px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip .meta { margin-top: 4px; display: flex; gap: 10px; font-size: 11px; color: var(--dim); }
  .trip .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .trip .meta svg { width: 12px; height: 12px; }
  .soon { position: absolute; top: 9px; right: 9px; font-size: 10.5px; font-weight: 600; color: var(--c-ink, var(--c)); background: color-mix(in srgb, var(--c) 16%, transparent); padding: 2px 7px; border-radius: 20px; }

  /* large cards (Variant B) */
  .tcard { position: relative; display: block; width: 100%; margin: 4px 0 14px; border-radius: 16px; overflow: hidden; text-align: left; cursor: pointer;
    background: var(--fill-1); border: 1px solid var(--line); transition: border-color .25s, transform .25s var(--ease), box-shadow .25s, opacity .3s, background .25s; }
  .tcard:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); background: var(--fill-2); }
  .tcard.hl { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .tcard.following { border-color: color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 50%, transparent), 0 12px 32px color-mix(in srgb, var(--c) 18%, transparent); }
  .tcard.active { border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 60%, transparent); }
  .trip-list.is-following .tcard:not(.following):not(:hover) { opacity: .62; }
  .trip-list.is-following .trip:not(.following):not(:hover) { opacity: .62; }
  .tc-cover { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--media-bg); }
  .tc-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
  .tcard:hover .tc-cover img { transform: scale(1.035); }
  .tcard.planned .tc-cover img { filter: var(--planned-img); }
  .tc-cover::after { content: ""; position: absolute; inset: 0; background: var(--cover-shade); pointer-events: none; }
  .tc-flag { position: absolute; z-index: 1; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .4px;
    padding: 4px 9px; border-radius: 20px; color: var(--on-img-text); background: var(--on-img-bg); border: 1px solid var(--on-img-line); backdrop-filter: blur(8px); }
  .tcard.planned .tc-flag { border-style: dashed; border-color: color-mix(in srgb, var(--c) 80%, white); }
  .tc-flag .cdot { box-shadow: none; }
  .tc-count { position: absolute; z-index: 1; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--on-img-text);
    padding: 3px 8px; border-radius: 8px; background: var(--on-img-bg); backdrop-filter: blur(8px); }
  .tc-count svg { width: 12px; height: 12px; }
  .tc-body { padding: 13px 15px 15px; }
  .tc-title { margin: 0; display: flex; align-items: center; gap: 9px; font: 600 21px/1.15 Fraunces, Georgia, serif; letter-spacing: -.2px; }
  .tc-dates { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .tc-rel { font-weight: 600; color: var(--text-2); }
  .tcard.planned .tc-rel { color: var(--c-ink, var(--c)); }
  .tc-stops { list-style: none; margin: 11px 0 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 4px; font-size: 12.5px; color: var(--text-2); }
  .tc-stops li { display: inline-flex; align-items: center; gap: 5px; }
  .tc-stops .n { width: 17px; height: 17px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 700; background: var(--c); color: var(--on-accent); }
  .tcard.planned .tc-stops .n { background: transparent; color: var(--c-ink, var(--c)); border: 1.5px dashed var(--c); }
  .tc-stops .arr { color: var(--dim); margin: 0 1px; }
  .tc-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .tc-tags span { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--fill-2); color: var(--text-2); }
  .tc-tags span::before { content: "#"; color: var(--c-ink, var(--c)); margin-right: 1px; }
  .tc-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .tc-strip.reels { grid-template-columns: repeat(4, 1fr); }
  .tc-thumb { position: relative; aspect-ratio: 1; border-radius: 9px; overflow: hidden; background: var(--media-bg); }
  .tc-strip.reels .tc-thumb { aspect-ratio: 9 / 14; }
  .tc-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s var(--ease); }
  .tc-thumb:hover img { transform: scale(1.06); }
  .tc-thumb .mini-play { position: absolute; left: 5px; bottom: 5px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--on-img-bg); }
  .tc-thumb .mini-play svg { width: 8px; height: 8px; fill: var(--on-img-text); stroke: none; margin-left: 1px; }
  .tc-thumb .mini-src { position: absolute; left: 5px; top: 5px; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; background: var(--on-img-bg); color: var(--on-img-text); }
  .tc-thumb .mini-src svg { width: 11px; height: 11px; }
  .tc-thumb.ig .mini-src { background: var(--src-ig); }
  .tc-thumb.yt .mini-src { background: var(--src-yt); }
  .tc-thumb.tt .mini-src { background: var(--src-tt); }
  .tc-thumb .more { position: absolute; inset: 0; display: grid; place-items: center; font: 600 15px "Space Grotesk"; color: var(--on-img-text); background: var(--on-img-bg); }
  .tc-empty { margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px dashed var(--line-strong); color: var(--dim); font-size: 12px; text-align: center; }
  .empty { padding: 30px 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty svg { width: 30px; height: 30px; color: var(--dim); margin-bottom: 8px; }

  /* ---------- detail panel ---------- */
  #detail { position: fixed; z-index: 12; top: var(--top); right: 14px; bottom: 14px; width: var(--detail-w); overflow: hidden; display: flex; flex-direction: column;
    transform: translateX(calc(100% + 30px)); opacity: 0; visibility: hidden; transition: transform .5s var(--ease), opacity .35s, visibility 0s .5s; background: var(--glass-strong); }
  #detail.open { transform: none; opacity: 1; visibility: visible; transition: transform .5s var(--ease), opacity .35s; }
  #detail .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .d-hero { position: relative; height: 230px; overflow: hidden; }
  .d-hero img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); animation: heroIn 1.2s var(--ease) both; }
  @keyframes heroIn { from { transform: scale(1.15); opacity: 0; } to { transform: scale(1.04); opacity: 1; } }
  .d-hero::after { content: ""; position: absolute; inset: 0; background: var(--hero-fade); }
  .d-hero .accent-line { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; z-index: 2; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .d-close, .d-back { position: absolute; z-index: 3; top: 12px; background: var(--on-img-bg); backdrop-filter: blur(10px); color: var(--on-img-text); }
  .d-close { right: 12px; }
  .d-back { left: 12px; display: none; }
  .d-close:hover, .d-back:hover { color: var(--on-img-text); background: var(--on-img-bg-strong); }
  .d-hero-text { position: absolute; z-index: 2; left: 20px; right: 20px; bottom: 16px; }
  .d-hero h2 { margin: 8px 0 4px; font: 600 27px/1.1 Fraunces, Georgia, serif; letter-spacing: -.2px; text-shadow: var(--hero-text-shadow); }
  .d-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--text-2); font-size: 12.5px; font-weight: 500; }
  .d-meta span { display: inline-flex; align-items: center; gap: 5px; }
  .d-meta svg { width: 13px; height: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; letter-spacing: .3px; }
  .chip.status { background: color-mix(in srgb, var(--accent) 25%, var(--chip-base)); color: var(--chip-text); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); backdrop-filter: blur(6px); }
  .chip.status.planned { background: var(--chip-base); border-style: dashed; }
  .d-body { padding: 16px 20px 28px; }
  .d-actions { display: flex; gap: 8px; }
  .d-actions .btn-primary { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #4c1d95)); box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 1px 0 rgba(255,255,255,.25); }
  .d-actions .grow { flex: 1; }
  .countdown { margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .countdown b { font: 600 26px "Space Grotesk"; color: var(--accent-ink, var(--accent)); }
  .countdown span { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--fill-2); border: 1px solid var(--line); color: var(--text-2); }
  .tag::before { content: "#"; color: var(--accent-ink, var(--accent)); margin-right: 1px; }
  .summary { margin: 12px 0 0; color: var(--text-2); line-height: 1.55; font-size: 13.5px; }
  .sec { margin-top: 22px; }
  .sec-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sec-h h3 { margin: 0; font: 600 13px "Space Grotesk", Inter; letter-spacing: 1px; text-transform: uppercase; color: var(--text); }
  .sec-h .muted { color: var(--dim); font-size: 12px; }
  .sec-h .spacer { flex: 1; }
  .src-summary { display: flex; flex-wrap: wrap; gap: 4px; margin: -4px 0 10px; }
  .stops { list-style: none; margin: 0; padding: 0; position: relative; }
  .stops::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; background: linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 20%, transparent)); opacity: .5; }
  #detail.planned .stops::before { background: repeating-linear-gradient(var(--accent) 0 5px, transparent 5px 10px); }
  .stops li { position: relative; display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 0; border-radius: 10px; cursor: pointer; transition: background .2s; }
  .stops li:hover { background: var(--fill-1); }
  .stops .n { position: relative; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; flex: none; background: var(--accent); color: var(--on-accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent); }
  #detail.planned .stops .n { background: var(--glass-solid); color: var(--accent-ink, var(--accent)); border: 1.5px dashed var(--accent); box-shadow: none; }
  .stops .nm { font-weight: 600; font-size: 13.5px; }
  .stops .dist { font-size: 11.5px; color: var(--dim); }
  .stops .go { margin-left: auto; color: var(--dim); opacity: 0; transition: .2s; }
  .stops li:hover .go { opacity: 1; }

  /* masonry */
  .masonry { columns: 2; column-gap: 8px; }
  .tile { position: relative; break-inside: avoid; margin: 0 0 8px; border-radius: 12px; overflow: hidden; cursor: zoom-in; background: var(--media-bg); transform: translateZ(0); }
  .tile img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s, transform .6s var(--ease); }
  .tile img.loaded { opacity: 1; }
  .tile:hover img { transform: scale(1.05); }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; }
  .tile figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 8px; font-size: 12px; font-weight: 500; color: var(--on-img-text); background: linear-gradient(transparent, var(--on-img-bg-strong)); opacity: 0; transform: translateY(6px); transition: .25s var(--ease); }
  .tile:hover figcaption { opacity: 1; transform: none; }
  .tile .badge { position: absolute; top: 7px; left: 7px; z-index: 1; }
  .play { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; display: grid; place-items: center; background: var(--on-img-bg); backdrop-filter: blur(6px); border: 1px solid var(--on-img-line); }
  .play svg { width: 16px; height: 16px; fill: var(--on-img-text); stroke: none; margin-left: 2px; }
  .tile .dur { position: absolute; right: 7px; bottom: 7px; z-index: 1; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 6px; color: var(--on-img-text); background: var(--on-img-bg-strong); font-variant-numeric: tabular-nums; }
  .tile:hover .dur { opacity: 0; }
  .tile .ext { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; color: var(--on-img-text); background: var(--on-img-bg); }
  .tile .ext svg { width: 12px; height: 12px; }
  .tile.new, .card.new { animation: pop .6s var(--ease); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }

  .badge { --src-immich: #8fb0ff; --src-local: #cbd5e1; --src-web: #93c5fd;
    display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: .3px; padding: 3px 7px 3px 5px; border-radius: 7px; color: var(--on-img-text); backdrop-filter: blur(8px); background: var(--on-img-bg); border: 1px solid var(--on-img-line); white-space: nowrap; }
  .badge svg { width: 11px; height: 11px; }
  .badge.immich svg { color: var(--src-immich); }
  .badge.local svg { color: var(--src-local); }
  .badge.web svg { color: var(--src-web); }
  .badge.instagram { background: var(--src-ig); border-color: transparent; }
  .badge.youtube { background: var(--src-yt); border-color: transparent; }
  .badge.tiktok { background: var(--src-tt); box-shadow: -1.5px 0 0 var(--src-tt-a), 1.5px 0 0 var(--src-tt-b); }
  /* flat badges sit on the panel, not on a photo: follow the theme */
  .badge.flat { backdrop-filter: none; }
  :root[data-theme="light"] .badge.flat.immich, :root[data-theme="light"] .badge.flat.local, :root[data-theme="light"] .badge.flat.web {
    --src-immich: #4f6bed; --src-local: #64748b; --src-web: #2563eb; background: var(--fill-2); color: var(--text); border-color: var(--line); }

  /* inspiration board */
  .card { break-inside: avoid; margin: 0 0 8px; border-radius: 13px; overflow: hidden; background: var(--fill-1); border: 1px solid var(--line); cursor: pointer; transition: transform .25s var(--ease), border-color .25s; }
  .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .card .tile { margin: 0; border-radius: 0; }
  .card .tile::after { display: none; }
  .card-body { padding: 9px 11px 11px; }
  .card-body p { margin: 0; font-size: 12.5px; font-weight: 500; line-height: 1.35; }
  .card-body .domain { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 11px; color: var(--dim); }
  .card-body .domain svg { width: 11px; height: 11px; }
  .archived { color: var(--success) !important; }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; transition: background .2s; }
  .checklist li:hover { background: var(--fill-1); }
  .checklist .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; flex: none; transition: .2s; }
  .checklist .box svg { width: 12px; height: 12px; opacity: 0; color: var(--on-accent); stroke-width: 3; }
  .checklist li.done .box { background: var(--accent); border-color: var(--accent); }
  .checklist li.done .box svg { opacity: 1; }
  .checklist li.done .txt { color: var(--dim); text-decoration: line-through; }
  .checklist .txt { flex: 1; font-size: 13px; }
  .checklist .rm { opacity: 0; color: var(--dim); }
  .checklist li:hover .rm { opacity: 1; }
  .add-note { display: flex; gap: 8px; margin-top: 6px; }
  .input { width: 100%; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--fill-1); outline: none; transition: .2s; }
  .input::placeholder { color: var(--dim); }
  .input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); background: var(--fill-2); }
  textarea.input { height: auto; padding: 10px 12px; resize: vertical; min-height: 70px; line-height: 1.45; }
  .empty-media { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 26px 16px; text-align: center; color: var(--muted); }

  /* ---------- map ui ---------- */
  .map-ctrls { position: fixed; z-index: 9; right: 14px; bottom: 34px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; transition: right .5s var(--ease), bottom .45s var(--ease); }
  body.detail-open .map-ctrls { right: calc(var(--detail-w) + 28px); }
  .map-ctrls .ctrl-group { display: flex; flex-direction: column; padding: 4px; border-radius: 13px; }
  .map-ctrls .icon-btn { color: var(--text-2); }
  .map-ctrls .icon-btn.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .rotate-pill { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; border-radius: 12px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .rotate-pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: .3s; }
  .rotate-pill.on { color: var(--text); }
  .rotate-pill.on .led { background: var(--live); box-shadow: 0 0 10px var(--live); animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  .maptip { position: fixed; z-index: 30; pointer-events: none; padding: 8px 11px; font-size: 12px; transform: translate(-50%, calc(-100% - 16px)); opacity: 0; transition: opacity .15s; white-space: nowrap; border-radius: 12px; background: var(--glass-strong); }
  .maptip.show { opacity: 1; }
  .maptip b { display: block; font-size: 13px; }
  .maptip span { color: var(--muted); }
  .maptip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .corner-label { position: fixed; z-index: 40; left: 14px; bottom: 12px; font-size: 11px; font-weight: 600; letter-spacing: .4px; color: var(--muted); padding: 5px 10px; border-radius: 9px; background: var(--glass-strong); border: 1px solid var(--line); backdrop-filter: blur(8px); pointer-events: none; }
  .corner-label b { color: var(--accent); font-weight: 700; }
  .pick-banner { position: fixed; z-index: 45; top: 90px; left: 50%; transform: translate(-50%, -20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 14px; transition: .35s var(--ease); background: var(--glass-strong); }
  body.picking .pick-banner { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .pick-banner .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--pick, var(--accent)); animation: ring 1.6s infinite; flex: none; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pick, #7c9cff) 60%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
  .fab { display: none; }

  /* photo pins (borrowed from Variant C) */
  .ppin { cursor: pointer; }
  .ppin .pol { width: 54px; padding: 4px 4px 12px; background: var(--polaroid); border-radius: 3px; box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); transform: rotate(var(--r)); transform-origin: 50% 100%; transition: transform .25s cubic-bezier(.3,1.6,.5,1); position: relative; }
  .ppin .pol img { width: 46px; height: 42px; object-fit: cover; border-radius: 1px; }
  .ppin .pol::before { content: ""; position: absolute; top: -6px; left: 50%; width: 26px; height: 10px; transform: translateX(-50%) rotate(-4deg); background: var(--c); opacity: .85; border-radius: 2px; }
  .ppin .pol b { position: absolute; right: -7px; top: 18px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--c); color: var(--on-accent); font-size: 10px; display: grid; place-items: center; border: 2px solid var(--polaroid); }
  .ppin:hover, .ppin.sel { z-index: 3; }
  .ppin:hover .pol, .ppin.sel .pol { transform: rotate(0) scale(1.15) translateY(-3px); }
  .ppin.dim { opacity: .35; }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: var(--scrim); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  body.picking #formOverlay { opacity: 0; pointer-events: none; }
  .modal { width: min(640px, 100%); max-height: calc(100dvh - 40px); display: flex; flex-direction: column; background: var(--glass-modal); transform: translateY(18px) scale(.98); transition: transform .4s var(--ease); overflow: hidden; }
  .overlay.open .modal { transform: none; }
  .modal-h { display: flex; align-items: center; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
  .modal-h h2 { margin: 0; font: 600 18px "Space Grotesk", Inter; flex: 1; }
  .modal-b { padding: 18px 20px; overflow-y: auto; }
  .modal-f { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--fill-1); }
  .field { margin-bottom: 16px; }
  .field > label, .lbl { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; min-width: 0; }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px transparent; transition: .2s; }
  .swatch.on { box-shadow: 0 0 0 2px var(--glass-solid), 0 0 0 4px var(--c), 0 0 14px var(--c); }
  .err { color: var(--danger-text); font-size: 12px; margin-top: 6px; display: none; }
  .err.show { display: block; }
  .draft-stops { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .draft-stops li { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 10px; border-radius: 10px; background: var(--fill-1); border: 1px solid var(--line); animation: pop .35s var(--ease); }
  .draft-stops .grip { color: var(--dim); cursor: grab; }
  .draft-stops .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--dc, var(--accent)); color: var(--on-accent); }

  /* lightbox (always a dark viewing room) */

  /* toast */

    .tc-title { font-size: 20px; }

    .map-ctrls { right: calc(8px + var(--sar)); top: calc(var(--top) + 6px); bottom: auto; }
    body.detail-open .map-ctrls { right: calc(8px + var(--sar)); }
    .map-ctrls .icon-btn { width: 42px; height: 42px; }
    .rotate-pill { width: 50px; height: 44px; padding: 0; justify-content: center; }
    .rotate-pill .txt { display: none; }
    .corner-label { left: calc(8px + var(--sal)); bottom: auto; top: calc(var(--top) + 6px); font-size: 10px; padding: 4px 8px; }
    #toasts { bottom: calc(var(--sheet-vis) + 84px); width: calc(100vw - 32px); }
    .toast { width: 100%; justify-content: space-between; }
    .intro { display: none; }
    .pick-banner { top: calc(var(--top) + 6px); width: calc(100vw - 16px); justify-content: space-between; }

    /* detail: a full-height sheet with a back button */
    #detail { inset: 0; width: auto; border-radius: 0; border: 0; z-index: 50; transform: translateY(100%); opacity: 1; background: var(--glass-modal); }
    #detail.open { transform: none; }
    .d-hero { height: calc(250px + var(--sat)); }
    .d-close { display: none; }
    .d-back { display: inline-grid; top: calc(10px + var(--sat)); left: 10px; width: 44px; height: 44px; border-radius: 14px; }
    .d-body { padding: 16px 16px calc(32px + var(--sab)); }
    .d-actions .btn { height: 44px; }
    .d-actions [data-act="delete"] { width: 44px !important; }
    .stops li { min-height: 48px; }
    .checklist li { min-height: 44px; }
    .checklist .box { width: 22px; height: 22px; }
    .checklist .rm { opacity: 1; }
    .stops .go { opacity: 1; }

    /* modals become full-screen sheets */
    .overlay { padding: 0; place-items: end center; }
    .modal { width: 100%; height: 100dvh; max-height: none; border-radius: 0; border: 0; transform: translateY(100%); padding-top: var(--sat); }
    .modal-f { padding-bottom: calc(14px + var(--sab)); }
    .modal-f .btn { flex: 1; }
    .row { flex-direction: column; gap: 0; }
    .input { height: 44px; font-size: 16px; }
    textarea.input { font-size: 16px; }
    .swatch { width: 34px; height: 34px; }
    .hint-row { flex-wrap: wrap; }
    .confirm { width: 100%; border-radius: 22px 22px 0 0; padding: 22px 20px calc(22px + var(--sab)); transform: translateY(100%); }
    .confirm .btns .btn { flex: 1; }
    .sheet { height: calc(100dvh - var(--sat) - 10px); border-radius: 22px 22px 0 0; }
    .sheet-h, .tabs, .sheet-b, .sheet-f { padding-left: 16px; padding-right: 16px; }
    .sheet-f { padding-bottom: calc(12px + var(--sab)); flex-wrap: wrap; }
    .sheet-f .sel { flex-basis: 100%; }
    .sheet-f .btn { flex: 1; }
    .tabs button { min-height: 44px; }
    .imm-grid { grid-template-columns: repeat(3, 1fr); }
    .fs { grid-template-columns: 1fr; }
    .tree { border-right: 0; border-bottom: 1px solid var(--line); padding: 0 0 8px; display: flex; overflow-x: auto; gap: 4px; }
    .tree button { width: auto; white-space: nowrap; padding-left: 8px !important; min-height: 40px; }
    .tree .root { display: none; }
    .files { grid-template-columns: repeat(2, 1fr); }
    .preview { flex-direction: column; }
    .preview .pthumb { width: 100%; max-height: 240px; }

    /* lightbox: swipe, edge-to-edge */
    #lightbox { padding: 0; place-items: center; }
    .lb-stage { max-width: 100vw; max-height: none; }
    .lb-media { border-radius: 0; }
    .lb-media img { max-width: 100vw; max-height: calc(100dvh - 230px); }
    .lb-cap { padding: 0 16px; }
    .lb-nav { display: none; }
    .lb-close { top: calc(10px + var(--sat)); right: 10px; width: 44px; height: 44px; background: var(--fill-2); border-radius: 14px; }
    .lb-strip button { width: 44px; height: 44px; }
    .lb-swipe-hint { display: block; margin-top: 8px; font-size: 11px; color: var(--dim); letter-spacing: .5px; }
  }
  /* trip colours used as *text* need more contrast on light surfaces */
  :root[data-theme="light"] .trip, :root[data-theme="light"] .tcard { --c-ink: color-mix(in srgb, var(--c) 58%, #0f172a); }
  :root[data-theme="light"] #detail, :root[data-theme="light"] .sheet, :root[data-theme="light"] .modal { --accent-ink: color-mix(in srgb, var(--accent) 58%, #0f172a); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<script>
(() => {
  "use strict";

  /* ================================================================
   * State & helpers
   * ================================================================ */
  const TODAY = new Date("2026-10-13T00:00:00Z");
  const PALETTE = ["#f97316", "#0ea5e9", "#22c55e", "#a855f7", "#eab308", "#ec4899", "#14b8a6", "#ef4444", "#6366f1"];
  const pic = (seed, w = 600, h = 400) => `https://picsum.photos/seed/${encodeURIComponent(seed)}/${w}/${h}`;

  const state = {
    trips: (window.TRIPS || []).map((t) => ({
      ...structuredClone(t),
      notes: (t.notes || []).map((text, i) => ({ text, done: i === 0 && t.id === 5 })),
    })),
    filter: "all",
    query: "",
    selectedId: null,
    hoverId: null,
    projection: "globe",
    spinning: true,
    picking: false,
    // Mockup D additions
    density: pref("ta-d-density", "cards"),        // "cards" | "compact"
    follow: pref("ta-d-follow", "on") === "on",     // scroll-follow toggle
    followId: null,                                 // trip currently "in view" in the list
    followPaused: false,                            // user grabbed the map; resume on next list scroll
    themePref: document.documentElement.getAttribute("data-theme-pref") || "system",
    theme: document.documentElement.getAttribute("data-theme") || "dark",
    photoPins: false,
    snap: "peek",                                   // mobile sheet: peek | half | full
  };
  function pref(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } }
  function savePref(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } }

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (id, cls = "i") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
  const getTrip = (id) => state.trips.find((t) => t.id === id);
  const parseD = (s) => (s ? new Date(s + "T00:00:00Z") : null);
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtRange(s, e) {
    const a = parseD(s), b = parseD(e);
    if (!a) return "Dates TBD";
    if (!b) return `${MONTHS[a.getUTCMonth()]} ${a.getUTCDate()}, ${a.getUTCFullYear()}`;
    const sameY = a.getUTCFullYear() === b.getUTCFullYear();
    const sameM = sameY && a.getUTCMonth() === b.getUTCMonth();
    if (sameM) return `${MONTHS[a.getUTCMonth()]} ${a.getUTCDate()}–${b.getUTCDate()}, ${b.getUTCFullYear()}`;
    if (sameY) return `${MONTHS[a.getUTCMonth()]} ${a.getUTCDate()} – ${MONTHS[b.getUTCMonth()]} ${b.getUTCDate()}, ${b.getUTCFullYear()}`;
    return `${MONTHS[a.getUTCMonth()]} ${a.getUTCDate()}, ${a.getUTCFullYear()} – ${MONTHS[b.getUTCMonth()]} ${b.getUTCDate()}, ${b.getUTCFullYear()}`;
  }
  const days = (t) => { const a = parseD(t.start), b = parseD(t.end); return a && b ? Math.round((b - a) / 864e5) + 1 : null; };
  const daysUntil = (t) => { const a = parseD(t.start); return a ? Math.round((a - TODAY) / 864e5) : null; };
  const dims = (url) => { const m = /\/(\d+)\/(\d+)(?:$|\?)/.exec(url || ""); return m ? [+m[1], +m[2]] : [600, 400]; };
  const bigger = (url) => url.replace(/\/(\d+)\/(\d+)$/, (_, w, h) => `/${w * 2}/${h * 2}`);
  const coverOf = (t) => t.cover || (t.media.find((m) => m.type !== "post") || t.media[0] || {}).url || pic(`trip-${t.id}-${t.title}`, 800, 500);
  const domainOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

  const SRC = {
    immich: { label: "Immich", icon: "immich" },
    local: { label: "Local", icon: "hdd" },
    instagram: { label: "Instagram", icon: "insta" },
    youtube: { label: "YouTube", icon: "yt" },
    tiktok: { label: "TikTok", icon: "tiktok" },
    web: { label: "Web", icon: "web" },
  };
  const badge = (src, extra = "") => { const s = SRC[src] || SRC.web; return `<span class="badge ${src} ${extra}">${icon(s.icon)}${s.label}</span>`; };

  // great-circle interpolation, longitudes unwrapped so lines stay continuous
  const R = Math.PI / 180;
  function gcDist(a, b) {
    const p1 = a.lat * R, p2 = b.lat * R, dl = (b.lng - a.lng) * R;
    return 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2));
  }
  const km = (a, b) => gcDist(a, b) * 6371;
  function arc(a, b, n = 64) {
    const d = gcDist(a, b);

    const l1 = a.lng * R, p1 = a.lat * R, l2 = b.lng * R, p2 = b.lat * R;
    const out = [];
    let prev = null;
    for (let i = 0; i <= n; i++) {
      const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
      const x = A * Math.cos(p1) * Math.cos(l1) + B * Math.cos(p2) * Math.cos(l2);
      const y = A * Math.cos(p1) * Math.sin(l1) + B * Math.cos(p2) * Math.sin(l2);
      const z = A * Math.sin(p1) + B * Math.sin(p2);
      let lng = Math.atan2(y, x) / R;
      const lat = Math.atan2(z, Math.hypot(x, y)) / R;
      if (prev !== null) { while (lng - prev > 180) lng -= 360; while (lng - prev < -180) lng += 360; }

      out.push([lng, lat]);

  /* ================================================================

  function drawStars() {
    const c = $("#stars"), dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    const g = c.getContext("2d");
    g.scale(dpr, dpr);
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const n = Math.round((innerWidth * innerHeight) / 2600);
    for (let i = 0; i < n; i++) {
      const x = rnd() * innerWidth, y = rnd() * innerHeight, r = rnd() ** 3 * 1.4 + 0.25, a = rnd() * 0.7 + 0.15;
      const tint = rnd();
      g.fillStyle = tint > 0.9 ? `rgba(180,200,255,${a})` : tint > 0.82 ? `rgba(255,220,190,${a})` : `rgba(255,255,255,${a})`;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      if (r > 1.25) { g.fillStyle = `rgba(160,185,255,${a * 0.12})`; g.beginPath(); g.arc(x, y, r * 4, 0, Math.PI * 2); g.fill(); }
    }
  }

  /* ================================================================

  const YELLOW = "#eab308";
  const THEME_PAINT = {

      glowBase: 0.2, glowHi: 0.65, glowDim: 0.04,
      halo: 0.35, haloHi: 0.7,
      pinStroke: "#ffffff",
      casing: "rgba(4,6,13,0.55)",
      label: "#e8ecf6", labelHalo: "rgba(5,8,18,0.9)",
      draftStroke: "#ffffff", draftText: "#0b0f1c",
      sky: { "sky-color": "#0a1030", "horizon-color": "#1d3a8a", "fog-color": "#0b1230", "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.6, "fog-ground-blend": 0.8 },
    },
    light: {
      glowBase: 0.1, glowHi: 0.32, glowDim: 0.02,
      halo: 0.22, haloHi: 0.4,
      pinStroke: "#1e293b",
      casing: ["case", ["==", ["get", "color"], YELLOW], "#854d0e", "rgba(255,255,255,0.95)"],
      label: "#0f172a", labelHalo: "rgba(255,255,255,0.95)",
      draftStroke: "#1e293b", draftText: "#0b0f1c",
      sky: { "sky-color": "#a9cdf0", "horizon-color": "#e8f1fb", "fog-color": "#f1f6fc", "sky-horizon-blend": 0.5, "horizon-fog-blend": 0.5, "fog-ground-blend": 0.85 },
    },
  };
  const TP = () => THEME_PAINT[state.theme] || THEME_PAINT.dark;

  const map = new maplibregl.Map({
    container: "map",
    style: STYLES[state.theme] || STYLES.dark,
    center: HOME.center,
    zoom: HOME.zoom(),
    attributionControl: { compact: true },
    maxPitch: 70,
  });
  window.__map = map; // handy for poking at it from devtools / tests
  let mapReady = false;
  let mapEventsBound = false;
  // the basemaps reference a few sprite icons they don't ship; give them a blank image
  map.on("styleimagemissing", (e) => { if (!map.hasImage(e.id)) map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) }); });

  function ringImage(size = 64, dashed = true) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    g.strokeStyle = "#fff";
    g.lineWidth = size * 0.09;
    if (dashed) g.setLineDash([size * 0.14, size * 0.1]);
    g.beginPath(); g.arc(size / 2, size / 2, size * 0.36, 0, Math.PI * 2); g.stroke();
    return g.getImageData(0, 0, size, size);
  }

  /* `setStyle` throws away custom sources, layers, images, projection and sky,
   * so everything Trip Atlas adds to the map lives here and runs on every

   * (projection, filter, selection, hover, follow) so nothing is lost. */
  function addTripLayers() {
    const P = TP();
    map.setProjection({ type: state.projection });
    try { map.setSky({ ...P.sky, "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 1, 7, 0] }); } catch (e) { /* older style spec */ }

    for (const id of ["routes", "stops", "draft"]) if (!map.getSource(id)) map.addSource(id, { type: "geojson", data: empty });
    const L = (spec) => { if (!map.getLayer(spec.id)) map.addLayer(spec); };

    L({ id: "route-glow", type: "line", source: "routes", layout: { "line-cap": "round", "line-join": "round" },

    L({ id: "route-casing-past", type: "line", source: "routes", filter: ["==", ["get", "status"], "past"], layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": P.casing, "line-width": 4.6, "line-opacity": 0.8 } });
    L({ id: "route-casing-planned", type: "line", source: "routes", filter: ["!=", ["get", "status"], "past"], layout: { "line-join": "round" },

    L({ id: "route-past", type: "line", source: "routes", filter: ["==", ["get", "status"], "past"], layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": ["get", "color"], "line-width": 2.2, "line-opacity": 0.85 } });
    L({ id: "route-planned", type: "line", source: "routes", filter: ["!=", ["get", "status"], "past"], layout: { "line-join": "round" },
      paint: { "line-color": ["get", "color"], "line-width": 2, "line-opacity": 0.85, "line-dasharray": [2, 2.2] } });
    L({ id: "route-hit", type: "line", source: "routes", paint: { "line-color": "#000", "line-width": 14, "line-opacity": 0 } });

    // stops
    L({ id: "stop-pulse", type: "circle", source: "stops", filter: ["==", ["get", "tripId"], -1],
      paint: { "circle-radius": 8, "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": ["get", "color"], "circle-stroke-width": 1.5, "circle-stroke-opacity": 0.8, "circle-pitch-alignment": "map" } });
    L({ id: "stop-glow", type: "circle", source: "stops", filter: ["==", ["get", "status"], "past"],
      paint: { "circle-radius": 13, "circle-color": ["get", "color"], "circle-blur": 1, "circle-opacity": P.halo } });
    L({ id: "stop-core", type: "circle", source: "stops", filter: ["==", ["get", "status"], "past"],
      paint: { "circle-radius": 4.5, "circle-color": ["get", "color"], "circle-stroke-color": P.pinStroke, "circle-stroke-width": 1.4, "circle-opacity": 1, "circle-stroke-opacity": 0.9 } });
    L({ id: "stop-ring-halo", type: "circle", source: "stops", filter: ["!=", ["get", "status"], "past"],
      paint: { "circle-radius": 7.5, "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": typeof P.casing === "string" ? P.casing : ["case", ["==", ["get", "color"], YELLOW], "#854d0e", "rgba(255,255,255,0.9)"], "circle-stroke-width": 2.4, "circle-stroke-opacity": state.theme === "light" ? 0.9 : 0.5 } });
    L({ id: "stop-ring", type: "symbol", source: "stops", filter: ["!=", ["get", "status"], "past"],
      layout: { "icon-image": "ring-dashed", "icon-size": 0.62, "icon-allow-overlap": true, "icon-ignore-placement": true, "icon-rotation-alignment": "map", "icon-pitch-alignment": "map" },

    L({ id: "stop-ring-dot", type: "circle", source: "stops", filter: ["!=", ["get", "status"], "past"],
      paint: { "circle-radius": 1.8, "circle-color": ["get", "color"], "circle-opacity": 0.9 } });
    L({ id: "stop-label", type: "symbol", source: "stops",
      layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 12, "text-offset": [0, 1.25], "text-anchor": "top", "text-allow-overlap": false },
      paint: { "text-color": P.label, "text-halo-color": P.labelHalo, "text-halo-width": 1.6, "text-opacity": 0 } });

    L({ id: "draft-line", type: "line", source: "draft", filter: ["==", ["geometry-type"], "LineString"],
      paint: { "line-color": ["get", "color"], "line-width": 2.4, "line-dasharray": [1, 1.6], "line-opacity": 0.95 } });
    L({ id: "draft-pt", type: "circle", source: "draft", filter: ["==", ["geometry-type"], "Point"],
      paint: { "circle-radius": 9, "circle-color": ["get", "color"], "circle-stroke-color": P.draftStroke, "circle-stroke-width": 2 } });
    L({ id: "draft-num", type: "symbol", source: "draft", filter: ["==", ["geometry-type"], "Point"],
      layout: { "text-field": ["to-string", ["get", "n"]], "text-font": ["Noto Sans Bold"], "text-size": 11, "text-allow-overlap": true },
      paint: { "text-color": P.draftText } });
  }

  let pendingCamera = null; // camera captured right before a style swap
  map.on("style.load", () => {

  function swapBasemap() {

    mapReady = false;
    map.stop();
    map.setStyle(url, { diff: false });
  }

  function geo() {
    const routes = [], stops = [];
    for (const t of visibleTrips()) {
      t.stops.forEach((s, i) => {
        stops.push({ type: "Feature", geometry: { type: "Point", coordinates: [s.lng, s.lat] },
          properties: { tripId: t.id, color: t.color, status: t.status, name: s.name, title: t.title, idx: i + 1 } });
        if (i > 0) routes.push({ type: "Feature", geometry: { type: "LineString", coordinates: arc(t.stops[i - 1], s) },
          properties: { tripId: t.id, color: t.color, status: t.status } });
      });
    }
    return { routes: { type: "FeatureCollection", features: routes }, stops: { type: "FeatureCollection", features: stops } };
  }

    applyPinState();
    if (!mapReady) return;

    const id = focusId();
    const has = id != null;
    const m = ["==", ["get", "tripId"], id ?? -1];
    const P = (layer, prop, val) => map.setPaintProperty(layer, prop, val);
    P("route-past", "line-opacity", ["case", m, 1, has ? 0.18 : 0.85]);
    P("route-past", "line-width", ["case", m, 3, 2.2]);
    P("route-planned", "line-opacity", ["case", m, 1, has ? 0.18 : 0.85]);
    P("route-planned", "line-width", ["case", m, 2.6, 2]);
    P("route-casing-past", "line-opacity", ["case", m, 0.9, has ? 0.12 : 0.7]);
    P("route-casing-past", "line-width", ["case", m, 5.6, 4.6]);
    P("route-casing-planned", "line-opacity", ["case", m, 0.9, has ? 0.12 : 0.7]);
    P("route-glow", "line-opacity", ["case", m, T.glowHi, has ? T.glowDim : T.glowBase]);
    P("route-glow", "line-width", ["case", m, 12, 7]);
    P("stop-core", "circle-opacity", ["case", m, 1, has ? 0.3 : 1]);
    P("stop-core", "circle-stroke-opacity", ["case", m, 1, has ? 0.25 : 0.9]);
    P("stop-core", "circle-radius", ["case", m, 5.5, 4.5]);

  (function pulse() {

  /* ---- camera padding: keep the globe centred in the *visible* area ---- */
  function panelWidth() {
    const v = getComputedStyle(document.documentElement).getPropertyValue("--panel-w");

  }
  function chromePadding() {
    if (narrow()) {

      // a full-height sheet covers the map anyway; never squeeze the viewport below ~35%
      return { top, bottom: Math.min(sheetVisible() + 8, innerHeight * 0.62 - top), left: 0, right: 0 };
    }
    const detailOpen = document.body.classList.contains("detail-open");
    const topbar = $("#topbar").getBoundingClientRect().bottom;
    const left = Math.min(panelWidth() + 22, innerWidth * 0.45);

    if (duration === 0) { map.setPadding(p); return; }
    map.easeTo({ padding: p, duration, easing: (t) => 1 - Math.pow(1 - t, 3), essential: true });
  }
  addEventListener("resize", () => { lastPad = null; applyPadding(0); });

  // ---- auto-rotation ----
  function spinStep() {
    if (!mapReady || !state.spinning || map.isMoving()) return;
    if (map.getZoom() > 4) return;

    map.easeTo({ center: [c.lng + 5, c.lat], duration: 1000, easing: (n) => n, essential: true });
  }

    state.spinning = on;
