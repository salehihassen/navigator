<script>
(() => {
  "use strict";

  /* ================================================================
   * State & helpers
   * ================================================================ */
  const TODAY = new Date("2026-10-13T00:00:00Z");
  const PALETTE = ["#f97316", "#0ea5e9", "#22c55e", "#a855f7", "#eab308", "#ec4899", "#14b8a6", "#ef4444", "#6366f1"];
  const pic = (seed, w = 600, h = 400) => `https://picsum.photos/seed/${encodeURIComponent(seed)}/${w}/${h}`;

  const state = {
    trips: (window.TRIPS || []).map((t) => ({
      ...structuredClone(t),
      notes: (t.notes || []).map((text, i) => ({ text, done: i === 0 && t.id === 5 })),
    })),
    filter: "all",
    query: "",
    selectedId: null,
    hoverId: null,
    projection: "globe",
    spinning: true,
    picking: false,
  };

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (id, cls = "i") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
  const getTrip = (id) => state.trips.find((t) => t.id === id);
  const parseD = (s) => (s ? new Date(s + "T00:00:00Z") : null);
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtRange(s, e) {
    const a = parseD(s), b = parseD(e);
    if (!a) return "Dates TBD";
    if (!b) return `${MONTHS[a.getUTCMonth()]} ${a.getUTCDate()}, ${a.getUTCFullYear()}`;
    const sameY = a.getUTCFullYear() === b.getUTCFullYear();
    const sameM = sameY && a.getUTCMonth() === b.getUTCMonth();
    if (sameM) return `${MONTHS[a.getUTCMonth()]} ${a.getUTCDate()}–${b.getUTCDate()}, ${b.getUTCFullYear()}`;
    if (sameY) return `${MONTHS[a.getUTCMonth()]} ${a.getUTCDate()} – ${MONTHS[b.getUTCMonth()]} ${b.getUTCDate()}, ${b.getUTCFullYear()}`;
    return `${MONTHS[a.getUTCMonth()]} ${a.getUTCDate()}, ${a.getUTCFullYear()} – ${MONTHS[b.getUTCMonth()]} ${b.getUTCDate()}, ${b.getUTCFullYear()}`;
  }
  const days = (t) => { const a = parseD(t.start), b = parseD(t.end); return a && b ? Math.round((b - a) / 864e5) + 1 : null; };
  const daysUntil = (t) => { const a = parseD(t.start); return a ? Math.round((a - TODAY) / 864e5) : null; };
  const dims = (url) => { const m = /\/(\d+)\/(\d+)(?:$|\?)/.exec(url || ""); return m ? [+m[1], +m[2]] : [600, 400]; };
  const bigger = (url) => url.replace(/\/(\d+)\/(\d+)$/, (_, w, h) => `/${w * 2}/${h * 2}`);
  const coverOf = (t) => t.cover || (t.media.find((m) => m.type !== "post") || t.media[0] || {}).url || pic(`trip-${t.id}-${t.title}`, 800, 500);
  const domainOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

  const SRC = {
    immich: { label: "Immich", icon: "immich" },
    local: { label: "Local", icon: "hdd" },
    instagram: { label: "Instagram", icon: "insta" },
    youtube: { label: "YouTube", icon: "yt" },
    tiktok: { label: "TikTok", icon: "tiktok" },
    web: { label: "Web", icon: "web" },
  };
  const badge = (src, extra = "") => { const s = SRC[src] || SRC.web; return `<span class="badge ${src} ${extra}">${icon(s.icon)}${s.label}</span>`; };

  // great-circle interpolation, longitudes unwrapped so lines stay continuous
  const R = Math.PI / 180;
  function gcDist(a, b) {
    const p1 = a.lat * R, p2 = b.lat * R, dl = (b.lng - a.lng) * R;
    return 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2));
  }
  const km = (a, b) => gcDist(a, b) * 6371;
  function arc(a, b, n = 64) {
    const d = gcDist(a, b);
    if (d < 1e-6) return [[a.lng, a.lat], [b.lng, b.lat]];
    const l1 = a.lng * R, p1 = a.lat * R, l2 = b.lng * R, p2 = b.lat * R;
    const out = [];
    let prev = null;
    for (let i = 0; i <= n; i++) {
      const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
      const x = A * Math.cos(p1) * Math.cos(l1) + B * Math.cos(p2) * Math.cos(l2);
      const y = A * Math.cos(p1) * Math.sin(l1) + B * Math.cos(p2) * Math.sin(l2);
      const z = A * Math.sin(p1) + B * Math.sin(p2);
      let lng = Math.atan2(y, x) / R;
      const lat = Math.atan2(z, Math.hypot(x, y)) / R;
      if (prev !== null) { while (lng - prev > 180) lng -= 360; while (lng - prev < -180) lng += 360; }
      prev = lng;
      out.push([lng, lat]);
    }
    return out;
  }
  const tripKm = (t) => t.stops.slice(1).reduce((s, st, i) => s + km(t.stops[i], st), 0);
  const fmtKm = (n) => n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : Math.round(n).toString();

  // tiny offline gazetteer standing in for Nominatim
  const GAZ = [
    ["Tokyo", "Japan", 139.69, 35.69], ["Kyoto", "Japan", 135.77, 35.01], ["Osaka", "Japan", 135.5, 34.69], ["Sapporo", "Japan", 141.35, 43.06], ["Hakone", "Japan", 139.02, 35.23], ["Hiroshima", "Japan", 132.46, 34.39],
    ["Seoul", "South Korea", 126.98, 37.57], ["Taipei", "Taiwan", 121.56, 25.03], ["Hong Kong", "China", 114.17, 22.32], ["Bangkok", "Thailand", 100.5, 13.76], ["Chiang Mai", "Thailand", 98.99, 18.79],
    ["Hanoi", "Vietnam", 105.85, 21.03], ["Hoi An", "Vietnam", 108.33, 15.88], ["Singapore", "Singapore", 103.82, 1.35], ["Ubud, Bali", "Indonesia", 115.26, -8.51], ["Kathmandu", "Nepal", 85.32, 27.72],
    ["Jaipur", "India", 75.79, 26.91], ["Mumbai", "India", 72.88, 19.08], ["Dubai", "United Arab Emirates", 55.27, 25.2], ["Istanbul", "Türkiye", 28.98, 41.01], ["Cappadocia", "Türkiye", 34.83, 38.64],
    ["Athens", "Greece", 23.73, 37.98], ["Santorini", "Greece", 25.43, 36.39], ["Rome", "Italy", 12.5, 41.9], ["Florence", "Italy", 11.26, 43.77], ["Venice", "Italy", 12.33, 45.44], ["Dolomites (Cortina)", "Italy", 12.14, 46.54],
    ["Barcelona", "Spain", 2.17, 41.39], ["Madrid", "Spain", -3.7, 40.42], ["Seville", "Spain", -5.98, 37.39], ["Lisbon", "Portugal", -9.14, 38.72], ["Porto", "Portugal", -8.61, 41.15], ["Lagos", "Portugal", -8.67, 37.1], ["Sintra", "Portugal", -9.39, 38.8],
    ["Paris", "France", 2.35, 48.86], ["Chamonix", "France", 6.87, 45.92], ["London", "United Kingdom", -0.13, 51.51], ["Edinburgh", "United Kingdom", -3.19, 55.95], ["Isle of Skye", "United Kingdom", -6.2, 57.27],
    ["Amsterdam", "Netherlands", 4.9, 52.37], ["Berlin", "Germany", 13.4, 52.52], ["Prague", "Czechia", 14.42, 50.08], ["Vienna", "Austria", 16.37, 48.21], ["Copenhagen", "Denmark", 12.57, 55.68],
    ["Oslo", "Norway", 10.75, 59.91], ["Lofoten", "Norway", 13.6, 68.2], ["Tromsø", "Norway", 18.96, 69.65], ["Reykjavík", "Iceland", -21.94, 64.15],
    ["Marrakech", "Morocco", -7.99, 31.63], ["Fes", "Morocco", -5.0, 34.03], ["Cairo", "Egypt", 31.24, 30.04], ["Nairobi", "Kenya", 36.82, -1.29], ["Zanzibar", "Tanzania", 39.19, -6.17], ["Cape Town", "South Africa", 18.42, -33.92],
    ["New York", "United States", -74.01, 40.71], ["San Francisco", "United States", -122.42, 37.77], ["Yosemite", "United States", -119.54, 37.87], ["Honolulu", "United States", -157.86, 21.31],
    ["Vancouver", "Canada", -123.12, 49.28], ["Banff", "Canada", -115.57, 51.18], ["Mexico City", "Mexico", -99.13, 19.43], ["Oaxaca", "Mexico", -96.73, 17.07], ["Havana", "Cuba", -82.37, 23.11],
    ["Cusco", "Peru", -71.97, -13.53], ["Rio de Janeiro", "Brazil", -43.17, -22.91], ["Buenos Aires", "Argentina", -58.38, -34.6], ["El Calafate", "Argentina", -72.27, -50.34], ["Santiago", "Chile", -70.67, -33.45],
    ["Sydney", "Australia", 151.21, -33.87], ["Melbourne", "Australia", 144.96, -37.81], ["Queenstown", "New Zealand", 168.66, -45.03],
  ].map(([name, country, lng, lat]) => ({ name, country, lng, lat }));

  function toast(msg, { color, action, onAction, ms = 3200 } = {}) {
    const el = document.createElement("div");
    el.className = "toast glass";
    if (color) el.style.setProperty("--tc", color);
    el.innerHTML = `<span class="tdot"></span><span>${msg}</span>${action ? `<button>${esc(action)}</button>` : ""}`;
    $("#toasts").appendChild(el);
    const kill = () => { el.classList.add("out"); setTimeout(() => el.remove(), 300); };
    if (action) el.querySelector("button").onclick = () => { onAction?.(); kill(); };
    setTimeout(kill, ms);
  }

  /* ================================================================
   * Starfield
   * ================================================================ */
  function drawStars() {
    const c = $("#stars"), dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    const g = c.getContext("2d");
    g.scale(dpr, dpr);
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const n = Math.round((innerWidth * innerHeight) / 2600);
    for (let i = 0; i < n; i++) {
      const x = rnd() * innerWidth, y = rnd() * innerHeight, r = rnd() ** 3 * 1.4 + 0.25, a = rnd() * 0.7 + 0.15;
      const tint = rnd();
      g.fillStyle = tint > 0.9 ? `rgba(180,200,255,${a})` : tint > 0.82 ? `rgba(255,220,190,${a})` : `rgba(255,255,255,${a})`;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      if (r > 1.25) { g.fillStyle = `rgba(160,185,255,${a * 0.12})`; g.beginPath(); g.arc(x, y, r * 4, 0, Math.PI * 2); g.fill(); }
    }
  }
  drawStars();
  addEventListener("resize", drawStars);

  /* ================================================================
   * Map
   * ================================================================ */
  const narrow = () => innerWidth < 760;
  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/dark",
    center: [-20, 28],
    zoom: narrow() ? 0.9 : 1.75,
    attributionControl: { compact: true },
    maxPitch: 70,
  });
  let mapReady = false;
  // the basemap references a few sprite icons it doesn't ship; give them a blank image
  map.on("styleimagemissing", (e) => { if (!map.hasImage(e.id)) map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) }); });

  function ringImage(size = 64, dashed = true) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    g.strokeStyle = "#fff";
    g.lineWidth = size * 0.09;
    if (dashed) g.setLineDash([size * 0.14, size * 0.1]);
    g.beginPath(); g.arc(size / 2, size / 2, size * 0.36, 0, Math.PI * 2); g.stroke();
    return g.getImageData(0, 0, size, size);
  }

  map.on("style.load", () => {
    map.setProjection({ type: "globe" });
    try {
      map.setSky({
        "sky-color": "#0a1030",
        "horizon-color": "#1d3a8a",
        "fog-color": "#0b1230",
        "sky-horizon-blend": 0.6,
        "horizon-fog-blend": 0.6,
        "fog-ground-blend": 0.8,
        "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 1, 7, 0],
      });
    } catch (e) { /* older style spec — ignore */ }

    map.addImage("ring-dashed", ringImage(64, true), { sdf: true, pixelRatio: 2 });

    const empty = { type: "FeatureCollection", features: [] };
    map.addSource("routes", { type: "geojson", data: empty });
    map.addSource("stops", { type: "geojson", data: empty });
    map.addSource("draft", { type: "geojson", data: empty });

    // routes
    map.addLayer({ id: "route-glow", type: "line", source: "routes", layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": ["get", "color"], "line-width": 7, "line-blur": 6, "line-opacity": 0.2 } });
    map.addLayer({ id: "route-past", type: "line", source: "routes", filter: ["==", ["get", "status"], "past"], layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": ["get", "color"], "line-width": 2.2, "line-opacity": 0.85 } });
    map.addLayer({ id: "route-planned", type: "line", source: "routes", filter: ["!=", ["get", "status"], "past"], layout: { "line-join": "round" },
      paint: { "line-color": ["get", "color"], "line-width": 2, "line-opacity": 0.85, "line-dasharray": [2, 2.2] } });
    map.addLayer({ id: "route-hit", type: "line", source: "routes", paint: { "line-color": "#000", "line-width": 14, "line-opacity": 0 } });

    // stops
    map.addLayer({ id: "stop-pulse", type: "circle", source: "stops", filter: ["==", ["get", "tripId"], -1],
      paint: { "circle-radius": 8, "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": ["get", "color"], "circle-stroke-width": 1.5, "circle-stroke-opacity": 0.8, "circle-pitch-alignment": "map" } });
    map.addLayer({ id: "stop-glow", type: "circle", source: "stops", filter: ["==", ["get", "status"], "past"],
      paint: { "circle-radius": 13, "circle-color": ["get", "color"], "circle-blur": 1, "circle-opacity": 0.35 } });
    map.addLayer({ id: "stop-core", type: "circle", source: "stops", filter: ["==", ["get", "status"], "past"],
      paint: { "circle-radius": 4.5, "circle-color": ["get", "color"], "circle-stroke-color": "#ffffff", "circle-stroke-width": 1.3, "circle-opacity": 1, "circle-stroke-opacity": 0.9 } });
    map.addLayer({ id: "stop-ring", type: "symbol", source: "stops", filter: ["!=", ["get", "status"], "past"],
      layout: { "icon-image": "ring-dashed", "icon-size": 0.62, "icon-allow-overlap": true, "icon-ignore-placement": true, "icon-rotation-alignment": "map", "icon-pitch-alignment": "map" },
      paint: { "icon-color": ["get", "color"], "icon-opacity": 0.95 } });
    map.addLayer({ id: "stop-ring-dot", type: "circle", source: "stops", filter: ["!=", ["get", "status"], "past"],
      paint: { "circle-radius": 1.8, "circle-color": ["get", "color"], "circle-opacity": 0.9 } });
    map.addLayer({ id: "stop-label", type: "symbol", source: "stops",
      layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 12, "text-offset": [0, 1.25], "text-anchor": "top", "text-allow-overlap": false },
      paint: { "text-color": "#e8ecf6", "text-halo-color": "rgba(5,8,18,.9)", "text-halo-width": 1.6, "text-opacity": 0 } });

    // draft (while creating / editing)
    map.addLayer({ id: "draft-line", type: "line", source: "draft", filter: ["==", ["geometry-type"], "LineString"],
      paint: { "line-color": ["get", "color"], "line-width": 2.4, "line-dasharray": [1, 1.6], "line-opacity": 0.95 } });
    map.addLayer({ id: "draft-pt", type: "circle", source: "draft", filter: ["==", ["geometry-type"], "Point"],
      paint: { "circle-radius": 9, "circle-color": ["get", "color"], "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
    map.addLayer({ id: "draft-num", type: "symbol", source: "draft", filter: ["==", ["geometry-type"], "Point"],
      layout: { "text-field": ["to-string", ["get", "n"]], "text-font": ["Noto Sans Bold"], "text-size": 11, "text-allow-overlap": true },
      paint: { "text-color": "#0b0f1c" } });

    mapReady = true;
    refreshMap();
    bindMapEvents();
    spinStep();
  });

  function geo() {
    const routes = [], stops = [];
    for (const t of visibleTrips()) {
      t.stops.forEach((s, i) => {
        stops.push({ type: "Feature", geometry: { type: "Point", coordinates: [s.lng, s.lat] },
          properties: { tripId: t.id, color: t.color, status: t.status, name: s.name, title: t.title, idx: i + 1 } });
        if (i > 0) routes.push({ type: "Feature", geometry: { type: "LineString", coordinates: arc(t.stops[i - 1], s) },
          properties: { tripId: t.id, color: t.color, status: t.status } });
      });
    }
    return { routes: { type: "FeatureCollection", features: routes }, stops: { type: "FeatureCollection", features: stops } };
  }

  function refreshMap() {
    if (!mapReady) return;
    const g = geo();
    map.getSource("routes").setData(g.routes);
    map.getSource("stops").setData(g.stops);
    applyHighlight();
  }

  function applyHighlight() {
    if (!mapReady) return;
    const id = state.hoverId ?? state.selectedId;
    const has = id != null;
    const m = ["==", ["get", "tripId"], id ?? -1];
    const P = (layer, prop, val) => map.setPaintProperty(layer, prop, val);
    P("route-past", "line-opacity", ["case", m, 1, has ? 0.18 : 0.85]);
    P("route-past", "line-width", ["case", m, 3, 2.2]);
    P("route-planned", "line-opacity", ["case", m, 1, has ? 0.18 : 0.85]);
    P("route-planned", "line-width", ["case", m, 2.6, 2]);
    P("route-glow", "line-opacity", ["case", m, 0.65, has ? 0.04 : 0.2]);
    P("route-glow", "line-width", ["case", m, 12, 7]);
    P("stop-core", "circle-opacity", ["case", m, 1, has ? 0.3 : 1]);
    P("stop-core", "circle-stroke-opacity", ["case", m, 1, has ? 0.25 : 0.9]);
    P("stop-core", "circle-radius", ["case", m, 5.5, 4.5]);
    P("stop-glow", "circle-opacity", ["case", m, 0.7, has ? 0.08 : 0.35]);
    P("stop-glow", "circle-radius", ["case", m, 22, 13]);
    P("stop-ring", "icon-opacity", ["case", m, 1, has ? 0.3 : 0.95]);
    P("stop-ring-dot", "circle-opacity", ["case", m, 1, has ? 0.3 : 0.9]);
    P("stop-label", "text-opacity", ["case", m, 1, 0]);
    map.setFilter("stop-pulse", ["==", ["get", "tripId"], state.selectedId ?? -1]);
  }

  // pulse rings around the selected trip's stops
  (function pulse() {
    if (mapReady && state.selectedId != null) {
      const t = (performance.now() % 2200) / 2200;
      map.setPaintProperty("stop-pulse", "circle-radius", 6 + t * 24);
      map.setPaintProperty("stop-pulse", "circle-stroke-opacity", (1 - t) * 0.9);
    }
    requestAnimationFrame(pulse);
  })();

  // ---- auto-rotation ----
  function spinStep() {
    if (!mapReady || !state.spinning || map.isMoving()) return;
    if (map.getZoom() > 4) return;
    const c = map.getCenter();
    map.easeTo({ center: [c.lng + 5, c.lat], duration: 1000, easing: (n) => n, essential: true });
  }
  function setSpin(on) {
    state.spinning = on;
    $("#rotateBtn").classList.toggle("on", on);
    if (on) {
      if (map.getZoom() > 3) map.easeTo({ zoom: narrow() ? 0.9 : 1.75, pitch: 0, duration: 1400 });
      else spinStep();
    } else if (map.isMoving()) map.stop();
  }
  map.on("moveend", () => spinStep());
  const stopSpinUser = () => { if (state.spinning) setSpin(false); $("#intro").classList.add("hide"); };
  ["mousedown", "touchstart", "wheel", "dragstart"].forEach((ev) => map.on(ev, stopSpinUser));

  function bindMapEvents() {
    const tip = $("#maptip");
    const hoverLayers = ["stop-core", "stop-ring", "route-hit"];
    let tipFor = null;
    map.on("mousemove", (e) => {
      if (state.picking) return;
      const f = map.queryRenderedFeatures(e.point, { layers: hoverLayers })[0];
      if (!f) {
        if (tipFor != null) { tipFor = null; tip.classList.remove("show"); map.getCanvas().style.cursor = ""; setHover(null); }
        return;
      }
      const p = f.properties;
      const t = getTrip(p.tripId);
      map.getCanvas().style.cursor = "pointer";
      tip.innerHTML = p.name
        ? `<b><i style="background:${p.color}"></i>${esc(p.name)}</b><span>${esc(t.title)} · stop ${p.idx} of ${t.stops.length}</span>`
        : `<b><i style="background:${p.color}"></i>${esc(t.title)}</b><span>${fmtRange(t.start, t.end)}</span>`;
      tip.style.left = e.originalEvent.clientX + "px";
      tip.style.top = e.originalEvent.clientY + "px";
      tip.classList.add("show");
      if (tipFor !== p.tripId) { tipFor = p.tripId; setHover(p.tripId); }
    });
    map.getCanvas().addEventListener("mouseleave", () => { tip.classList.remove("show"); tipFor = null; setHover(null); });
    map.on("click", (e) => {
      if (state.picking) return addPickedStop(e.lngLat);
      const f = map.queryRenderedFeatures(e.point, { layers: hoverLayers })[0];
      if (f) selectTrip(f.properties.tripId);
    });
  }

  function fitTrip(t, opts = {}) {
    if (!t.stops.length) return;
    const b = new maplibregl.LngLatBounds();
    t.stops.forEach((s) => b.extend([s.lng, s.lat]));
    const n = narrow();
    const pad = n
      ? { top: 140, bottom: 160, left: 40, right: 40 }
      : { top: 130, bottom: 70, left: (opts.leftPad ?? 360) + 50, right: (opts.rightPad ?? 470) + 50 };
    map.fitBounds(b, { padding: pad, maxZoom: 7, duration: 2200, pitch: state.projection === "globe" ? 0 : 20, essential: true, curve: 1.6 });
  }

  /* ================================================================
   * Filtering / list
   * ================================================================ */
  function matches(t) {
    if (state.filter !== "all" && t.status !== state.filter) return false;
    const q = state.query.trim().toLowerCase();
    if (!q) return true;
    return [t.title, t.summary, ...(t.tags || []), ...t.stops.map((s) => s.name)].join(" ").toLowerCase().includes(q);
  }
  const visibleTrips = () => state.trips.filter(matches);

  function renderStats() {
    const past = state.trips.filter((t) => t.status === "past");
    const stops = state.trips.reduce((n, t) => n + t.stops.length, 0);
    const dist = past.reduce((n, t) => n + tripKm(t), 0);
    $("#stats").innerHTML = `
      <div class="stat"><b>${state.trips.length}</b><span>trips</span></div>
      <div class="stat"><b>${stops}</b><span>stops</span></div>
      <div class="stat"><b>${fmtKm(dist)}</b><span>km travelled</span></div>`;
  }

  function tripRow(t) {
    const n = t.media.length;
    const until = daysUntil(t);
    const soon = t.status !== "past" && until != null && until >= 0
      ? `<span class="soon">${until === 0 ? "today" : until < 60 ? `in ${until}d` : `in ${Math.round(until / 30)} mo`}</span>` : "";
    return `
      <button class="trip ${t.status} ${t.id === state.selectedId ? "active" : ""}" data-id="${t.id}" style="--c:${t.color}">
        <div class="thumb"><img src="${esc(coverOf(t))}" alt="" loading="lazy" /></div>
        <div class="info">
          <div class="title"><span class="cdot"></span>${esc(t.title)}</div>
          <div class="sub">${fmtRange(t.start, t.end)}</div>
          <div class="meta">
            <span>${icon("pin")}${t.stops.length} stop${t.stops.length === 1 ? "" : "s"}</span>
            <span>${icon(t.status === "past" ? "image" : "sparkle")}${n} ${t.status === "past" ? "media" : "saved"}</span>
          </div>
        </div>${soon}
      </button>`;
  }

  function renderList() {
    const vis = visibleTrips();
    const up = vis.filter((t) => t.status !== "past").sort((a, b) => (a.start || "9").localeCompare(b.start || "9"));
    const past = vis.filter((t) => t.status === "past").sort((a, b) => (b.start || "").localeCompare(a.start || ""));
    let html = "";
    if (up.length) html += `<div class="group-title">Upcoming <span class="count">${up.length}</span></div>` + up.map(tripRow).join("");
    if (past.length) {
      html += `<div class="group-title">Past <span class="count">${past.length}</span></div>`;
      let yr = null;
      for (const t of past) {
        const y = (t.start || "").slice(0, 4);
        if (y !== yr) { yr = y; html += `<div class="year">${y}</div>`; }
        html += tripRow(t);
      }
    }
    if (!html) html = `<div class="empty">${icon("search")}<div>No trips match “${esc(state.query)}”.</div></div>`;
    const list = $("#tripList");
    list.innerHTML = html;
    $$(".trip", list).forEach((b) => {
      const id = +b.dataset.id;
      b.onmouseenter = () => setHover(id);
      b.onmouseleave = () => setHover(null);
      b.onclick = () => { selectTrip(id); if (narrow()) $("#tripPanel").classList.remove("expanded"); };
    });
    renderStats();
  }

  function setHover(id) {
    if (state.hoverId === id) return;
    state.hoverId = id;
    $$(".trip").forEach((b) => b.classList.toggle("hl", +b.dataset.id === id));
    applyHighlight();
  }

  function refreshAll() { renderList(); refreshMap(); }

  /* ================================================================
   * Detail panel
   * ================================================================ */
  function selectTrip(id, { fly = true } = {}) {
    const t = getTrip(id);
    if (!t) return;
    state.selectedId = id;
    setSpin(false);
    $("#intro").classList.add("hide");
    renderDetail();
    $("#detail").classList.add("open");
    document.body.classList.add("detail-open");
    $$(".trip").forEach((b) => b.classList.toggle("active", +b.dataset.id === id));
    applyHighlight();
    if (fly) fitTrip(t);
  }

  function closeDetail() {
    state.selectedId = null;
    $("#detail").classList.remove("open");
    document.body.classList.remove("detail-open");
    $$(".trip").forEach((b) => b.classList.remove("active"));
    applyHighlight();
  }

  function mediaTile(m, i, isNew) {
    const [w, h] = dims(m.url);
    const isVid = m.type === "video";
    return `
      <figure class="tile ${isNew ? "new" : ""}" data-i="${i}" style="aspect-ratio:${w}/${h}">
        <img src="${esc(m.url)}" alt="${esc(m.caption)}" loading="lazy" onload="this.classList.add('loaded')" />
        ${badge(m.src)}
        ${isVid ? `<span class="play">${icon("play")}</span><span class="dur">${esc(m.duration || "0:30")}</span>` : ""}
        ${m.type === "post" ? `<span class="ext">${icon("ext")}</span>` : ""}
        <figcaption>${esc(m.caption)}</figcaption>
      </figure>`;
  }

  function boardCard(m, i, isNew) {
    const [w, h] = dims(m.url);
    const reel = ["instagram", "tiktok", "youtube"].includes(m.src);
    const ratio = Math.min(h / w, 1.35); // keep reels from getting too tall
    return `
      <article class="card ${isNew ? "new" : ""}" data-i="${i}">
        <div class="tile" style="aspect-ratio:1/${ratio.toFixed(3)}">
          <img src="${esc(m.url)}" alt="" loading="lazy" onload="this.classList.add('loaded')" />
          ${badge(m.src)}
          ${reel ? `<span class="play">${icon("play")}</span>` : ""}
          ${m.duration ? `<span class="dur">${esc(m.duration)}</span>` : ""}
        </div>
        <div class="card-body">
          <p>${esc(m.caption)}</p>
          <span class="domain">${m.archived ? `<span class="archived">${icon("archive")} archived</span> ·` : icon("link")}${esc(domainOf(m.link) || "link")}</span>
        </div>
      </article>`;
  }

  let lastAddedCount = 0;
  function renderDetail() {
    const t = getTrip(state.selectedId);
    if (!t) return;
    const d = $("#detail");
    d.style.setProperty("--accent", t.color);
    d.classList.toggle("planned", t.status !== "past");
    const past = t.status === "past";
    const nDays = days(t), until = daysUntil(t), total = tripKm(t);
    const fresh = (i) => lastAddedCount && i >= t.media.length - lastAddedCount;
    const counts = {};
    t.media.forEach((m) => (counts[m.src] = (counts[m.src] || 0) + 1));

    const stopsHtml = t.stops.map((s, i) => `
      <li data-i="${i}">
        <span class="n">${i + 1}</span>
        <div><div class="nm">${esc(s.name)}</div>
        <div class="dist">${i === 0 ? "Start" : `${Math.round(km(t.stops[i - 1], s)).toLocaleString()} km from ${esc(t.stops[i - 1].name)}`}</div></div>
        <span class="go">${icon("crosshair")}</span>
      </li>`).join("");

    const memories = `
      <section class="sec">
        <div class="sec-h"><h3>Memories</h3><span class="muted">${t.media.length}</span><span class="spacer"></span>
          <button class="btn btn-ghost btn-sm" data-act="add-media">${icon("plus")}Add</button></div>
        ${t.media.length ? `<div class="src-summary">${Object.entries(counts).map(([s, n]) => badge(s, "flat") .replace("</span>", ` ${n}</span>`)).join("")}</div>
          <div class="masonry">${t.media.map((m, i) => mediaTile(m, i, fresh(i))).join("")}</div>`
        : `<div class="empty-media">No photos yet.<br/><button class="btn btn-ghost btn-sm" style="margin-top:10px" data-act="add-media">${icon("immich")}Find photos in Immich</button></div>`}
      </section>`;

    const board = `
      <section class="sec">
        <div class="sec-h"><h3>Inspiration board</h3><span class="muted">${t.media.length}</span><span class="spacer"></span>
          <button class="btn btn-ghost btn-sm" data-act="add-link">${icon("link")}Save link</button></div>
        ${t.media.length ? `<div class="masonry">${t.media.map((m, i) => boardCard(m, i, fresh(i))).join("")}</div>`
        : `<div class="empty-media">Paste Instagram reels, TikToks, YouTube videos or blog posts here.<br/><button class="btn btn-ghost btn-sm" style="margin-top:10px" data-act="add-link">${icon("link")}Save your first link</button></div>`}
      </section>
      <section class="sec">
        <div class="sec-h"><h3>Notes</h3><span class="muted">${t.notes.filter((n) => n.done).length}/${t.notes.length} done</span></div>
        <ul class="checklist">${t.notes.map((n, i) => `
          <li class="${n.done ? "done" : ""}" data-i="${i}"><button class="box" data-act="toggle-note">${icon("check")}</button>
          <span class="txt">${esc(n.text)}</span><button class="icon-btn rm" data-act="rm-note" title="Remove">${icon("x")}</button></li>`).join("")}
        </ul>
        <form class="add-note" id="noteForm"><input class="input" placeholder="Add a to-do, idea or reminder…" /><button class="btn btn-ghost">${icon("plus")}</button></form>
      </section>`;

    d.innerHTML = `
      <div class="scroll">
        <div class="d-hero">
          <img src="${esc(bigger(coverOf(t)))}" alt="" onerror="this.src='${esc(coverOf(t))}'" />
          <button class="icon-btn d-close" data-act="close" title="Close (Esc)">${icon("x")}</button>
          <div class="d-hero-text">
            <span class="chip status ${past ? "" : "planned"}">${past ? "PAST TRIP" : "PLANNED"}</span>
            <h2>${esc(t.title)}</h2>
            <div class="d-meta">
              <span>${icon("cal")}${fmtRange(t.start, t.end)}${nDays ? ` · ${nDays} days` : ""}</span>
              <span>${icon("route")}${t.stops.length} stops · ${Math.round(total).toLocaleString()} km</span>
            </div>
          </div>
          <div class="accent-line"></div>
        </div>
        <div class="d-body">
          <div class="d-actions">
            <button class="btn btn-primary grow" data-act="${past ? "add-media" : "add-link"}">${icon("plus")}${past ? "Add media" : "Save inspiration"}</button>
            <button class="btn btn-ghost" data-act="edit">${icon("edit")}Edit</button>
            <button class="btn btn-ghost" data-act="delete" title="Delete trip" style="width:36px;padding:0">${icon("trash")}</button>
          </div>
          ${!past && until != null && until >= 0 ? `<div class="countdown"><b>${until}</b><span>days until departure<br/>${t.stops[0] ? `from ${esc(t.stops[0].name)}` : ""}</span></div>` : ""}
          ${t.tags?.length ? `<div class="tags">${t.tags.map((g) => `<span class="tag">${esc(g)}</span>`).join("")}</div>` : ""}
          ${t.summary ? `<p class="summary">${esc(t.summary)}</p>` : ""}
          <section class="sec">
            <div class="sec-h"><h3>Route</h3><span class="muted">${t.stops.length} stops</span></div>
            <ol class="stops">${stopsHtml}</ol>
          </section>
          ${past ? memories : board}
        </div>
      </div>`;
    lastAddedCount = 0;

    d.onclick = (e) => {
      const a = e.target.closest("[data-act]");
      const tile = e.target.closest("[data-i]");
      if (a) {
        const act = a.dataset.act;
        if (act === "close") closeDetail();
        else if (act === "edit") openForm(t);
        else if (act === "delete") confirmDelete(t);
        else if (act === "add-media") openSheet(t, "immich");
        else if (act === "add-link") openSheet(t, "link");
        else if (act === "toggle-note") { const i = +a.closest("li").dataset.i; t.notes[i].done = !t.notes[i].done; renderDetail(); }
        else if (act === "rm-note") { const i = +a.closest("li").dataset.i; t.notes.splice(i, 1); renderDetail(); }
        return;
      }
      if (tile && tile.closest(".stops")) {
        const s = t.stops[+tile.dataset.i];
        map.flyTo({ center: [s.lng, s.lat], zoom: 8.5, duration: 1800, essential: true });
        return;
      }
      if (tile && (tile.classList.contains("tile") || tile.classList.contains("card"))) openLightbox(t, +tile.dataset.i);
    };
    const nf = $("#noteForm", d);
    if (nf) nf.onsubmit = (e) => {
      e.preventDefault();
      const v = nf.querySelector("input").value.trim();
      if (!v) return;
      t.notes.push({ text: v, done: false });
      renderDetail();
      $("#noteForm input").focus();
    };
  }

  /* ================================================================
   * Lightbox
   * ================================================================ */
  const lb = { trip: null, i: 0 };
  function openLightbox(t, i) { lb.trip = t; lb.i = i; renderLightbox(); $("#lightbox").classList.add("open"); }
  function closeLightbox() { $("#lightbox").classList.remove("open"); }
  function renderLightbox() {
    const t = lb.trip, m = t.media[lb.i];
    if (!m) return closeLightbox();
    const isVid = m.type === "video";
    const isPost = m.type === "post";
    const el = $("#lightbox");
    el.style.setProperty("--accent", t.color);
    el.innerHTML = `
      <button class="icon-btn lb-close" data-act="close">${icon("x")}</button>
      <button class="lb-nav lb-prev" data-act="prev">${icon("left")}</button>
      <button class="lb-nav lb-next" data-act="next">${icon("right")}</button>
      <div class="lb-stage">
        <div class="lb-media" id="lbMedia">
          <img src="${esc(bigger(m.url))}" onerror="this.src='${esc(m.url)}'" alt="" />
          ${isVid || (isPost && m.src !== "web") ? `<button class="play" data-act="play">${icon("play")}</button>` : ""}
          ${isVid ? `<div class="vbar"><span>0:00</span><span class="track"><i></i></span><span>${esc(m.duration || "0:30")}</span></div>` : ""}
        </div>
        <div class="lb-cap">
          ${badge(m.src)}
          <span class="c">${esc(m.caption)}</span>
          <span class="n">${lb.i + 1} / ${t.media.length} · ${esc(t.title)}</span>
          ${isPost ? `<a class="btn btn-ghost btn-sm" href="${esc(m.link)}" target="_blank" rel="noopener">${icon("ext")}Open on ${SRC[m.src]?.label || "web"}</a>
            ${m.src !== "web" ? `<button class="btn btn-ghost btn-sm" data-act="archive">${m.archived ? `<span class="archived" style="display:inline-flex;gap:6px">${icon("check")}Archived locally</span>` : `${icon("archive")}Archive with yt-dlp`}</button>` : ""}` : ""}
          ${m.src === "immich" ? `<span class="n">Streamed from Immich · nothing copied</span>` : ""}
          ${m.src === "local" ? `<span class="n">/data/local/trips/${esc(t.title.toLowerCase().replace(/[^a-z0-9]+/g, "-"))}/</span>` : ""}
        </div>
      </div>
      <div class="lb-strip">${t.media.map((x, j) => `<button class="${j === lb.i ? "on" : ""}" data-j="${j}"><img src="${esc(x.url)}" alt=""/></button>`).join("")}</div>`;
    el.onclick = (e) => {
      const a = e.target.closest("[data-act]");
      const j = e.target.closest("[data-j]");
      if (j) { lb.i = +j.dataset.j; return renderLightbox(); }
      if (!a) { if (e.target === el) closeLightbox(); return; }
      const act = a.dataset.act;
      if (act === "close") closeLightbox();
      if (act === "prev") stepLb(-1);
      if (act === "next") stepLb(1);
      if (act === "play") $("#lbMedia").classList.add("playing");
      if (act === "archive" && !m.archived) {
        a.innerHTML = `<span class="skeleton" style="display:inline-block;width:14px;height:14px;border-radius:50%"></span>Downloading…`;
        setTimeout(() => { m.archived = true; renderLightbox(); if (state.selectedId === t.id) renderDetail(); toast("Saved to the media cache", { color: "#4ade80" }); }, 1300);
      }
    };
  }
  const stepLb = (d) => { const n = lb.trip.media.length; lb.i = (lb.i + d + n) % n; renderLightbox(); };

  /* ================================================================
   * Trip form (create / edit)
   * ================================================================ */
  let draft = null;
  function openForm(trip) {
    const isNew = !trip;
    const color = trip?.color || PALETTE[state.trips.length % PALETTE.length];
    draft = {
      id: trip?.id ?? null,
      title: trip?.title || "",
      status: trip?.status || "planned",
      color,
      start: trip?.start || "",
      end: trip?.end || "",
      stops: (trip?.stops || []).map((s) => ({ ...s })),
      cover: trip ? coverOf(trip) : null,
      coverSeed: 0,
      summary: trip?.summary || "",
      tags: (trip?.tags || []).join(", "),
    };
    renderForm(isNew);
    $("#formOverlay").classList.add("open");
    updateDraftLayer();
    setTimeout(() => $("#fTitle")?.focus(), 250);
  }

  function coverOptions() {
    const t = draft.id != null ? getTrip(draft.id) : null;
    const fromMedia = t ? t.media.filter((m) => m.type !== "post").slice(0, 5).map((m) => m.url) : [];
    const base = (draft.title || "new trip").toLowerCase().replace(/\s+/g, "-");
    const seeds = Array.from({ length: Math.max(3, 8 - fromMedia.length) }, (_, i) => pic(`${base}-${draft.coverSeed}-${i}`, 800, 500));
    return [...fromMedia, ...seeds];
  }

  function renderForm(isNew) {
    const m = $("#formModal");
    m.style.setProperty("--dc", draft.color);
    m.style.setProperty("--accent", draft.color);
    const covers = coverOptions();
    if (!draft.cover) draft.cover = covers[0];
    m.innerHTML = `
      <div class="modal-h"><h2>${isNew ? "New trip" : "Edit trip"}</h2><button class="icon-btn" data-act="cancel">${icon("x")}</button></div>
      <form class="modal-b" id="tripForm" autocomplete="off">
        <div class="field"><label for="fTitle">Title</label><input class="input" id="fTitle" value="${esc(draft.title)}" placeholder="e.g. Vietnam by train" />
          <div class="err" id="errTitle">Give the trip a name.</div></div>
        <div class="row">
          <div class="field"><span class="lbl">Status</span>
            <div class="seg" id="fStatus">
              <button type="button" data-v="past" class="${draft.status === "past" ? "on" : ""}">Past</button>
              <button type="button" data-v="planned" class="${draft.status !== "past" ? "on" : ""}">Planned</button>
            </div></div>
          <div class="field"><span class="lbl">Color</span>
            <div class="swatches">${PALETTE.map((c) => `<button type="button" class="swatch ${c === draft.color ? "on" : ""}" style="--c:${c}" data-c="${c}" aria-label="${c}"></button>`).join("")}</div></div>
        </div>
        <div class="row">
          <div class="field"><label for="fStart">Start</label><input type="date" class="input" id="fStart" value="${esc(draft.start)}" /></div>
          <div class="field"><label for="fEnd">End</label><input type="date" class="input" id="fEnd" value="${esc(draft.end)}" /></div>
        </div>
        <div class="field"><span class="lbl">Stops</span>
          <ul class="draft-stops" id="dStops"></ul>
          <div class="place-search">${icon("search", "i lead")}
            <input class="input" id="placeQ" placeholder="Search a place — city, park, landmark…" />
            <div class="results" id="placeRes"></div>
          </div>
          <div class="hint-row">
            <button type="button" class="btn btn-ghost" id="pickMap">${icon("crosshair")}Pick on map</button>
            <span>then click the map to drop stops — the globe stays live behind this form.</span>
          </div>
          <div class="err" id="errStops">Add at least one stop.</div>
        </div>
        <div class="field"><label for="fSummary">Summary</label><textarea class="input" id="fSummary" rows="2" placeholder="One line about the trip">${esc(draft.summary)}</textarea></div>
        <div class="field"><label for="fTags">Tags</label><input class="input" id="fTags" value="${esc(draft.tags)}" placeholder="food, hike, beach" /></div>
        <div class="field"><span class="lbl" style="display:flex;align-items:center">Cover
          <button type="button" class="btn btn-ghost btn-sm" id="shuffle" style="margin-left:auto;text-transform:none;letter-spacing:0">${icon("shuffle")}Shuffle</button></span>
          <div class="covers">${covers.map((u) => `<button type="button" class="cover-opt ${u === draft.cover ? "on" : ""}" data-u="${esc(u)}"><img src="${esc(u.replace(/\/\d+\/\d+$/, "/240/180"))}" alt="" loading="lazy" /></button>`).join("")}</div>
        </div>
      </form>
      <div class="modal-f">
        ${isNew ? "" : `<button class="btn btn-ghost" data-act="delete" style="color:#fca5a5">${icon("trash")}Delete</button>`}
        <span class="spacer" style="flex:1"></span>
        <button class="btn btn-ghost" data-act="cancel">Cancel</button>
        <button class="btn btn-primary" data-act="save">${isNew ? `${icon("plus")}Create trip` : "Save changes"}</button>
      </div>`;
    renderDraftStops();

    const sync = () => {
      draft.title = $("#fTitle").value; draft.start = $("#fStart").value; draft.end = $("#fEnd").value;
      draft.summary = $("#fSummary").value; draft.tags = $("#fTags").value;
    };
    m.oninput = sync;
    m.onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.act === "cancel") return closeForm();
      if (b.dataset.act === "save") return saveForm(isNew);
      if (b.dataset.act === "delete") { const t = getTrip(draft.id); closeForm(); return confirmDelete(t); }
      if (b.dataset.v) { draft.status = b.dataset.v; $$("#fStatus button").forEach((x) => x.classList.toggle("on", x === b)); }
      if (b.dataset.c) { sync(); draft.color = b.dataset.c; m.style.setProperty("--dc", draft.color); m.style.setProperty("--accent", draft.color);
        $$(".swatch", m).forEach((x) => x.classList.toggle("on", x === b)); renderDraftStops(); updateDraftLayer(); }
      if (b.dataset.u) { draft.cover = b.dataset.u; $$(".cover-opt", m).forEach((x) => x.classList.toggle("on", x === b)); }
      if (b.id === "shuffle") { sync(); draft.coverSeed++; draft.cover = null; renderForm(isNew); }
      if (b.id === "pickMap") startPicking();
      if (b.dataset.rm != null) { draft.stops.splice(+b.dataset.rm, 1); renderDraftStops(); updateDraftLayer(); }
      if (b.dataset.place != null) { addDraftStop(placeResults[+b.dataset.place]); $("#placeQ").value = ""; $("#placeRes").classList.remove("show"); $("#placeQ").focus(); }
    };
    $("#tripForm").onsubmit = (e) => { e.preventDefault(); saveForm(isNew); };

    // place search
    let placeResults = [], kb = -1;
    const q = $("#placeQ"), res = $("#placeRes");
    const showRes = () => {
      const v = q.value.trim().toLowerCase();
      if (!v) { res.classList.remove("show"); return; }
      placeResults = GAZ.filter((p) => (p.name + " " + p.country).toLowerCase().includes(v))
        .sort((a, b) => a.name.toLowerCase().indexOf(v) - b.name.toLowerCase().indexOf(v)).slice(0, 7);
      kb = placeResults.length ? 0 : -1;
      res.innerHTML = placeResults.length
        ? placeResults.map((p, i) => `<button type="button" data-place="${i}" class="${i === kb ? "kb" : ""}">${icon("pin")}<span>${esc(p.name)} <span class="co">${esc(p.country)}</span></span><span class="src">${p.lat.toFixed(2)}, ${p.lng.toFixed(2)}</span></button>`).join("")
        : `<div style="padding:10px;color:var(--muted);font-size:12.5px">No matches in the demo gazetteer — try “Kyoto”, “Lofoten”, “Cusco”… or pick on the map.</div>`;
      res.classList.add("show");
    };
    q.oninput = (e) => { e.stopPropagation(); showRes(); };
    q.onkeydown = (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        kb = Math.max(0, Math.min(placeResults.length - 1, kb + (e.key === "ArrowDown" ? 1 : -1)));
        $$("button", res).forEach((x, i) => x.classList.toggle("kb", i === kb));
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (kb >= 0 && placeResults[kb]) { addDraftStop(placeResults[kb]); q.value = ""; res.classList.remove("show"); }
      }
    };
    q.onblur = () => setTimeout(() => res.classList.remove("show"), 180);
  }

  function renderDraftStops() {
    const ul = $("#dStops");
    if (!ul) return;
    ul.innerHTML = draft.stops.map((s, i) => `
      <li><span class="grip">${icon("grip")}</span><span class="n" style="--dc:${draft.color}">${i + 1}</span>
      <span class="nm">${esc(s.name)}</span><span class="co">${s.lat.toFixed(2)}, ${s.lng.toFixed(2)}</span>
      <button type="button" class="icon-btn" data-rm="${i}" title="Remove stop">${icon("x")}</button></li>`).join("");
  }

  function addDraftStop(p) {
    draft.stops.push({ name: p.name, lng: +p.lng.toFixed(3), lat: +p.lat.toFixed(3) });
    renderDraftStops();
    updateDraftLayer();
    $("#errStops")?.classList.remove("show");
    if (!state.picking) {
      const b = new maplibregl.LngLatBounds();
      draft.stops.forEach((s) => b.extend([s.lng, s.lat]));
      setSpin(false);
      map.fitBounds(b, { padding: 120, maxZoom: 5, duration: 1400 });
    }
  }

  function updateDraftLayer() {
    if (!mapReady) return;
    const feats = [];
    if (draft) {
      draft.stops.forEach((s, i) => {
        feats.push({ type: "Feature", geometry: { type: "Point", coordinates: [s.lng, s.lat] }, properties: { n: i + 1, color: draft.color } });
        if (i) feats.push({ type: "Feature", geometry: { type: "LineString", coordinates: arc(draft.stops[i - 1], s) }, properties: { color: draft.color } });
      });
    }
    map.getSource("draft").setData({ type: "FeatureCollection", features: feats });
  }

  function startPicking() {
    state.picking = true;
    setSpin(false);
    document.body.style.setProperty("--pick", draft.color);
    document.body.classList.add("picking");
    $("#maptip").classList.remove("show");
  }
  function stopPicking() {
    state.picking = false;
    document.body.classList.remove("picking");
  }
  function addPickedStop(ll) {
    // "reverse geocode" against the demo gazetteer
    let best = null, bestD = Infinity;
    for (const p of GAZ) { const d = km(p, { lng: ll.lng, lat: ll.lat }); if (d < bestD) { bestD = d; best = p; } }
    const name = best && bestD < 120 ? best.name : `Dropped pin`;
    addDraftStop({ name: bestD < 120 ? name : `${name} ${draft.stops.length + 1}`, lng: ll.lng, lat: ll.lat });
    toast(`Added <b>${esc(draft.stops[draft.stops.length - 1].name)}</b> as stop ${draft.stops.length}`, { color: draft.color, ms: 1800 });
  }
  $("#pickDone").onclick = stopPicking;

  function closeForm() {
    stopPicking();
    $("#formOverlay").classList.remove("open");
    draft = null;
    updateDraftLayer();
  }

  function saveForm(isNew) {
    const title = $("#fTitle").value.trim();
    let ok = true;
    $("#errTitle").classList.toggle("show", !title); if (!title) ok = false;
    $("#errStops").classList.toggle("show", !draft.stops.length); if (!draft.stops.length) ok = false;
    if (!ok) return;
    const data = {
      title, status: draft.status, color: draft.color,
      start: $("#fStart").value, end: $("#fEnd").value || $("#fStart").value,
      stops: draft.stops, cover: draft.cover,
      summary: $("#fSummary").value.trim(),
      tags: $("#fTags").value.split(",").map((s) => s.trim()).filter(Boolean),
    };
    let id;
    if (isNew) {
      id = Math.max(0, ...state.trips.map((t) => t.id)) + 1;
      state.trips.push({ id, media: [], notes: [], ...data });
      // make sure the new trip is visible under the current filter
      if (state.filter !== "all" && state.filter !== data.status) setFilter("all");
      state.query = ""; $("#q").value = "";
    } else {
      id = draft.id;
      Object.assign(getTrip(id), data);
    }
    closeForm();
    refreshAll();
    selectTrip(id);
    toast(isNew ? `Created <b>${esc(title)}</b> — ${data.stops.length} stop${data.stops.length === 1 ? "" : "s"} on the map` : `Saved <b>${esc(title)}</b>`, { color: data.color });
  }

  /* ================================================================
   * Delete confirm
   * ================================================================ */
  function confirmDelete(t) {
    if (!t) return;
    const box = $("#confirmBox");
    box.innerHTML = `
      <div class="ico">${icon("trash")}</div>
      <h3>Delete “${esc(t.title)}”?</h3>
      <p>This removes the trip, its ${t.stops.length} stops and ${t.media.length} media reference${t.media.length === 1 ? "" : "s"}. Originals in Immich and on disk are not touched.</p>
      <div class="btns"><button class="btn btn-ghost" data-act="no">Cancel</button><button class="btn btn-danger" data-act="yes">${icon("trash")}Delete trip</button></div>`;
    $("#confirmOverlay").classList.add("open");
    box.onclick = (e) => {
      const a = e.target.closest("[data-act]");
      if (!a) return;
      $("#confirmOverlay").classList.remove("open");
      if (a.dataset.act !== "yes") return;
      const idx = state.trips.indexOf(t);
      state.trips.splice(idx, 1);
      if (state.selectedId === t.id) closeDetail();
      refreshAll();
      toast(`Deleted <b>${esc(t.title)}</b>`, { color: "#f87171", action: "Undo", ms: 5000,
        onAction: () => { state.trips.splice(idx, 0, t); refreshAll(); selectTrip(t.id); } });
    };
    setTimeout(() => $('[data-act="no"]', box).focus(), 50);
  }

  /* ================================================================
   * Add-media sheet
   * ================================================================ */
  const sheet = { trip: null, tab: "immich", sel: new Set(), folder: null, link: null, archive: true, loading: false };
  const VIDEO_DURS = ["0:12", "0:37", "1:04", "0:21", "2:48"];

  function immichSuggestions(t) {
    const a = parseD(t.start) || TODAY, b = parseD(t.end) || a;
    const span = Math.max(1, (b - a) / 864e5);
    const shapes = [[600, 600], [600, 800], [800, 600], [600, 600], [600, 900], [800, 533]];
    return Array.from({ length: 15 }, (_, i) => {
      const day = Math.floor((i / 15) * span);
      const d = new Date(+a + day * 864e5);
      const [w, h] = shapes[i % shapes.length];
      const vid = i % 5 === 3;
      const stop = t.stops[Math.min(t.stops.length - 1, Math.floor((i / 15) * t.stops.length))];
      return {
        key: `imm-${t.id}-${i}`, url: pic(`imm-${t.id}-${t.title}-${i}`, w, h), day: d, stop: stop?.name || "",
        time: `${String(7 + ((i * 5) % 14)).padStart(2, "0")}:${String((i * 17) % 60).padStart(2, "0")}`,
        type: vid ? "video" : "image", duration: vid ? VIDEO_DURS[i % VIDEO_DURS.length] : null,
        name: `IMG_${d.toISOString().slice(0, 10).replace(/-/g, "")}_${String(1000 + i * 37)}.${vid ? "MOV" : "HEIC"}`,
      };
    });
  }

  const FS = {
    "trips": { label: "trips", parent: null },
    "trips/2025-japan": { label: "2025-japan", parent: "trips" },
    "trips/2024-portugal": { label: "2024-portugal", parent: "trips" },
    "trips/2023-iceland": { label: "2023-iceland", parent: "trips" },
    "trips/2023-iceland/gopro": { label: "gopro", parent: "trips/2023-iceland" },
    "phone-dumps": { label: "phone-dumps", parent: null },
    "phone-dumps/pixel-2025": { label: "pixel-2025", parent: "phone-dumps" },
    "drone": { label: "drone", parent: null },
  };
  function filesIn(path) {
    const kids = Object.keys(FS).filter((k) => FS[k].parent === path).map((k) => ({ dir: true, path: k, name: FS[k].label }));
    const n = path.split("/").length === 1 ? 2 : 10;
    const files = Array.from({ length: kids.length ? n : 12 }, (_, i) => {
      const vid = i % 4 === 2;
      return { dir: false, key: `${path}/${i}`, name: vid ? `VID_${2300 + i * 7}.mp4` : `DSC_${4100 + i * 13}.jpg`, type: vid ? "video" : "image",
        url: pic(`local-${path}-${i}`, 600, i % 3 ? 400 : 600), size: vid ? `${(40 + i * 13) % 300 + 20} MB` : `${(3 + (i * 7) % 9)}.${i % 10} MB`, duration: vid ? VIDEO_DURS[i % 5] : null };
    });
    return [...kids, ...files];
  }
  function defaultFolder(t) {
    const s = t.title.toLowerCase();
    if (s.includes("japan")) return "trips/2025-japan";
    if (s.includes("lisbon") || s.includes("portugal")) return "trips/2024-portugal";
    if (s.includes("iceland")) return "trips/2023-iceland";
    return "phone-dumps/pixel-2025";
  }

  function openSheet(t, tab) {
    sheet.trip = t; sheet.tab = tab; sheet.sel = new Set(); sheet.link = null; sheet.loading = false;
    sheet.folder = defaultFolder(t);
    renderSheet();
    $("#sheetOverlay").classList.add("open");
  }
  function closeSheet() { $("#sheetOverlay").classList.remove("open"); }

  function renderSheet() {
    const t = sheet.trip, el = $("#sheet");
    el.style.setProperty("--accent", t.color);
    const tabs = [["immich", "immich", "Immich"], ["local", "folder", "Local folder"], ["link", "link", "Link"]];
    const L = sheet.link;
    let body = "", footer = "";
    if (sheet.tab === "immich") {
      if (t.status !== "past" && (daysUntil(t) ?? 0) > 0) {
        body = `<div class="big-empty"><div><div class="orb">${icon("immich")}</div><h4>Nothing to suggest yet</h4>
          <p>Once ${esc(t.title)} has happened, Immich photos taken between ${fmtRange(t.start, t.end)} and near your stops show up here automatically. You can link an album now so it fills in live.</p>
          <div style="margin-top:14px"><button class="fchip">${icon("album")}Link an Immich album…</button></div></div></div>`;
      } else {
        const sug = immichSuggestions(t);
        const md = (d) => `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`;
        let lastStop = null, grid = "";
        sug.forEach((s) => {
          if (s.stop !== lastStop) {
            lastStop = s.stop;
            const grp = sug.filter((x) => x.stop === s.stop), a = grp[0].day, z = grp[grp.length - 1].day;
            grid += `<div class="imm-day">Near ${esc(s.stop)} <span>· ${md(a)}${+a !== +z ? ` – ${md(z)}` : ""} · ${grp.length} items</span></div>`;
          }
          grid += `<div class="pick ${sheet.sel.has(s.key) ? "on" : ""}" data-k="${s.key}">
            <img src="${esc(s.url.replace(/\/\d+\/\d+$/, "/300/300"))}" alt="" loading="lazy" />
            ${s.type === "video" ? `<span class="vid">${icon("play")}${s.duration}</span>` : ""}
            <span class="chk">${icon("check")}</span><span class="when"><span>${md(s.day)}</span><span>${s.time}</span></span></div>`;
        });
        body = `
          <div class="filterbar">
            <span class="fchip on">${icon("cal")}${fmtRange(t.start, t.end)}</span>
            <span class="fchip on">${icon("pin")}Within 25 km of stops</span>
            <span class="fchip">${icon("album")}Album: ${esc(t.title)}</span>
            <span class="spacer" style="flex:1"></span>
            <button class="btn btn-ghost btn-sm" data-act="selall">Select all</button>
          </div>
          <div class="imm-grid">${grid}</div>`;
      }
      footer = `<span class="sel">${sheet.sel.size ? `${sheet.sel.size} selected · linked by asset ID, nothing is copied` : "Taken during this trip, from your Immich library"}</span>
        <button class="btn btn-ghost" data-act="cancel">Cancel</button>
        <button class="btn btn-primary" data-act="attach-immich" ${sheet.sel.size ? "" : "disabled"}>Attach ${sheet.sel.size || ""}</button>`;
    } else if (sheet.tab === "local") {
      const items = filesIn(sheet.folder);
      const tree = Object.keys(FS).map((k) => `<button class="lvl${k.split("/").length - 1} ${k === sheet.folder ? "on" : ""}" data-folder="${k}">${icon("folder")}${esc(FS[k].label)}</button>`).join("");
      const crumbs = ["/data/local", ...sheet.folder.split("/")].map((p, i, a) => (i === a.length - 1 ? `<b>${esc(p)}</b>` : esc(p))).join(" / ");
      body = `<div class="fs"><nav class="tree"><div class="root">MOUNTED ROOT</div>${tree}</nav>
        <div><div class="crumbs">${icon("hdd")}${crumbs}</div>
        <div class="files">${items.map((f) => f.dir
          ? `<button class="file" data-folder="${f.path}"><div class="fthumb" style="background:rgba(124,156,255,.08)"><svg class="i" style="width:38px;height:38px;color:#8fb0ff"><use href="#i-folder"/></svg></div><div class="fn">${esc(f.name)}/</div><div class="fm">folder</div></button>`
          : `<button class="file ${sheet.sel.has(f.key) ? "on" : ""}" data-k="${esc(f.key)}"><div class="fthumb"><img src="${esc(f.url.replace(/\/\d+\/\d+$/, "/240/180"))}" alt="" loading="lazy"/>${f.type === "video" ? `<span class="fplay">${icon("play")}</span>` : ""}<span class="ftype">${f.type === "video" ? "MP4" : "JPG"}</span></div>
             <span class="chk">${icon("check")}</span><div class="fn">${esc(f.name)}</div><div class="fm">${f.size}${f.duration ? ` · ${f.duration}` : ""}</div></button>`).join("")}</div></div></div>`;
      footer = `<span class="sel">${sheet.sel.size ? `${sheet.sel.size} file${sheet.sel.size === 1 ? "" : "s"} · referenced by path, read-only mount` : "Browse the read-only folder mounted at /data/local"}</span>
        <button class="btn btn-ghost" data-act="cancel">Cancel</button>
        <button class="btn btn-primary" data-act="attach-local" ${sheet.sel.size ? "" : "disabled"}>Attach ${sheet.sel.size || ""}</button>`;
    } else {
      body = `<div class="linkbox">
        <form class="row" id="linkForm"><input class="input" id="linkUrl" placeholder="Paste a link — Instagram reel, TikTok, YouTube, blog post…" value="${esc(L?.url || "")}" />
          <button class="btn btn-primary">${icon("sparkle")}Preview</button></form>
        <div class="samples">Try:
          <button data-sample="https://www.instagram.com/reel/C9xTrails/">Instagram reel</button>
          <button data-sample="https://www.tiktok.com/@wander/video/7312">TikTok</button>
          <button data-sample="https://www.youtube.com/watch?v=trip-vlog">YouTube</button>
          <button data-sample="https://www.theguardian.com/travel/best-hikes">Blog post</button>
        </div>
        ${sheet.loading ? `<div class="preview"><div class="pthumb skeleton" style="height:190px"></div><div class="pinfo"><div class="skeleton" style="height:18px;width:80%"></div><div class="skeleton" style="height:12px;width:40%"></div><div class="skeleton" style="height:12px;width:60%"></div><div style="color:var(--dim);font-size:12px;margin-top:auto">Fetching OpenGraph · falling back to yt-dlp --dump-json…</div></div></div>` : ""}
        ${L && !sheet.loading ? `<div class="preview">
          <div class="pthumb" style="aspect-ratio:${L.w}/${L.h};max-height:260px"><img src="${esc(L.thumb)}" alt=""/>${badge(L.src)}</div>
          <div class="pinfo">
            <div class="ptitle">${esc(L.title)}</div>
            <div class="pauthor">${esc(L.author)}</div>
            <div class="purl">${esc(L.url)}</div>
            <div class="field" style="margin:4px 0 0"><span class="lbl">Caption</span><input class="input" id="linkCap" value="${esc(L.title)}" /></div>
            ${L.src !== "web" ? `<div class="toggle ${sheet.archive ? "on" : ""}" data-act="archive-toggle"><span class="sw"></span>Archive video locally with yt-dlp so it survives deletion</div>` : ""}
          </div></div>` : ""}
        ${!L && !sheet.loading ? `<div class="big-empty" style="height:auto;margin-top:40px"><div><div class="orb">${icon("link")}</div><h4>Save anything from the web</h4><p>We grab the title and thumbnail, show it as a card on the ${t.status === "past" ? "collage" : "inspiration board"}, and can keep a local copy of the video.</p></div></div>` : ""}
      </div>`;
      footer = `<span class="sel">${L?.src ? `${SRC[L.src].label} link ready` : "Instagram may block anonymous previews — we fall back gracefully"}</span>
        <button class="btn btn-ghost" data-act="cancel">Cancel</button>
        <button class="btn btn-primary" data-act="attach-link" ${L && !sheet.loading ? "" : "disabled"}>${t.status === "past" ? "Add to collage" : "Add to board"}</button>`;
    }

    el.innerHTML = `
      <div class="grabber"></div>
      <div class="sheet-h"><h2>Add media</h2><span class="for">to <b style="color:${t.color}">${esc(t.title)}</b></span><span class="spacer" style="flex:1"></span>
        <button class="icon-btn" data-act="cancel">${icon("x")}</button></div>
      <div class="tabs">${tabs.map(([k, ic, lbl]) => `<button data-tab="${k}" class="${k === sheet.tab ? "on" : ""}">${icon(ic)}${lbl}</button>`).join("")}</div>
      <div class="sheet-b">${body}</div>
      <div class="sheet-f">${footer}</div>`;

    const lf = $("#linkForm", el);
    if (lf) {
      lf.onsubmit = (e) => { e.preventDefault(); fetchPreview($("#linkUrl").value.trim()); };
      if (!L && !sheet.loading) setTimeout(() => $("#linkUrl")?.focus(), 60);
    }
    el.onclick = (e) => {
      const b = e.target.closest("[data-tab],[data-act],[data-k],[data-folder],[data-sample]");
      if (!b) return;
      if (b.dataset.tab) { if (sheet.tab !== b.dataset.tab) { sheet.tab = b.dataset.tab; sheet.sel = new Set(); renderSheet(); } return; }
      if (b.dataset.folder) { sheet.folder = b.dataset.folder; renderSheet(); return; }
      if (b.dataset.sample) { fetchPreview(b.dataset.sample); return; }
      if (b.dataset.k) { const k = b.dataset.k; sheet.sel.has(k) ? sheet.sel.delete(k) : sheet.sel.add(k); renderSheetKeepScroll(); return; }
      const act = b.dataset.act;
      if (act === "cancel") closeSheet();
      if (act === "selall") { immichSuggestions(t).forEach((s) => sheet.sel.add(s.key)); renderSheetKeepScroll(); }
      if (act === "archive-toggle") { sheet.archive = !sheet.archive; b.classList.toggle("on", sheet.archive); }
      if (act === "attach-immich") {
        const add = immichSuggestions(t).filter((s) => sheet.sel.has(s.key)).map((s) => ({ src: "immich", type: s.type, url: s.url, caption: `${s.stop} · ${MONTHS[s.day.getUTCMonth()]} ${s.day.getUTCDate()}`, duration: s.duration }));
        attach(t, add);
      }
      if (act === "attach-local") {
        const add = filesIn(sheet.folder).filter((f) => !f.dir && sheet.sel.has(f.key)).map((f) => ({ src: "local", type: f.type, url: f.url, caption: f.name, duration: f.duration }));
        attach(t, add);
      }
      if (act === "attach-link") {
        const Lk = sheet.link;
        attach(t, [{ src: Lk.src, type: "post", url: Lk.thumb, caption: $("#linkCap")?.value || Lk.title, link: Lk.url, archived: Lk.src !== "web" && sheet.archive, duration: Lk.duration }]);
      }
    };
  }
  function renderSheetKeepScroll() { const sb = $("#sheet .sheet-b"); const y = sb?.scrollTop || 0; renderSheet(); $("#sheet .sheet-b").scrollTop = y; }

  function fetchPreview(url) {
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    const host = domainOf(url);
    const src = /instagram/.test(host) ? "instagram" : /tiktok/.test(host) ? "tiktok" : /youtu/.test(host) ? "youtube" : "web";
    const t = sheet.trip, place = t.stops[0]?.name || "the trip";
    const meta = {
      instagram: { title: `${place} in 30 seconds — hidden spots locals love`, author: "@wanderlust.reels · Instagram reel", w: 600, h: 1000, duration: "0:30" },
      tiktok: { title: `POV: your first day in ${place}`, author: "@slowtravel · TikTok", w: 600, h: 1000, duration: "0:47" },
      youtube: { title: `${place}: complete travel guide (4K)`, author: "Kara & Nate · YouTube · 18:22", w: 640, h: 360, duration: "18:22" },
      web: { title: `The ultimate ${place} itinerary`, author: `${host} · article`, w: 600, h: 400, duration: null },
    }[src];
    sheet.loading = true; sheet.link = { url };
    renderSheet();
    setTimeout(() => {
      sheet.loading = false;
      sheet.link = { url, src, ...meta, thumb: pic(`link-${url}`, meta.w, meta.h) };
      renderSheet();
    }, 900);
  }

  function attach(t, items) {
    if (!items.length) return;
    t.media.push(...items);
    lastAddedCount = items.length;
    closeSheet();
    refreshAll();
    if (state.selectedId === t.id) {
      renderDetail();
      const sc = $("#detail .scroll");
      setTimeout(() => sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" }), 80);
    }
    const what = items[0].src === "immich" ? "from Immich" : items[0].src === "local" ? "from local folder" : `${SRC[items[0].src].label} link`;
    toast(`Added ${items.length > 1 ? items.length + " items " : ""}${what} to <b>${esc(t.title)}</b>`, { color: t.color });
  }

  /* ================================================================
   * Top bar & global wiring
   * ================================================================ */
  function setFilter(f) {
    state.filter = f;
    $$("#filterSeg button").forEach((b) => b.classList.toggle("on", b.dataset.f === f));
    refreshAll();
    const sel = getTrip(state.selectedId);
    if (sel && !matches(sel)) closeDetail();
  }
  $("#filterSeg").onclick = (e) => { const b = e.target.closest("button"); if (b) setFilter(b.dataset.f); };

  $("#projSeg").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || b.dataset.proj === state.projection) return;
    state.projection = b.dataset.proj;
    $$("#projSeg button").forEach((x) => x.classList.toggle("on", x === b));
    map.setProjection({ type: state.projection });
    if (state.projection === "mercator") {
      if (map.getZoom() < 1.6) map.easeTo({ zoom: narrow() ? 0.6 : 1.6, center: [map.getCenter().lng, 25], pitch: 0, duration: 900 });
    } else if (map.getZoom() < 2.5) {
      map.easeTo({ zoom: narrow() ? 0.9 : 1.75, pitch: 0, duration: 900 });
    }
  };

  let qTimer;
  $("#q").oninput = (e) => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      state.query = e.target.value;
      refreshAll();
      const vis = visibleTrips();
      if (state.query && vis.length === 1) setHover(vis[0].id);
    }, 120);
  };
  $("#q").onkeydown = (e) => {
    if (e.key === "Enter") { const v = visibleTrips(); if (v.length) selectTrip(v[0].id); }
    if (e.key === "Escape") { e.target.value = ""; state.query = ""; refreshAll(); e.target.blur(); }
  };

  $("#newTrip").onclick = () => openForm(null);
  $("#rotateBtn").onclick = () => setSpin(!state.spinning);
  $("#zIn").onclick = () => { stopSpinUser(); map.zoomIn(); };
  $("#zOut").onclick = () => { stopSpinUser(); map.zoomOut(); };
  $("#zHome").onclick = () => { closeDetail(); map.flyTo({ center: [-20, 28], zoom: narrow() ? 0.9 : 1.75, pitch: 0, bearing: 0, duration: 1800 }); };
  $("#panelHead").onclick = () => { if (narrow()) $("#tripPanel").classList.toggle("expanded"); };

  // click on dimmed backdrop closes overlays
  ["formOverlay", "confirmOverlay", "sheetOverlay"].forEach((id) => {
    $("#" + id).addEventListener("mousedown", (e) => {
      if (e.target.id !== id) return;
      if (id === "formOverlay") closeForm();
      else $("#" + id).classList.remove("open");
    });
  });

  addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
    if ($("#lightbox").classList.contains("open")) {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") stepLb(-1);
      if (e.key === "ArrowRight") stepLb(1);
      return;
    }
    if (e.key === "Escape") {
      if (state.picking) return stopPicking();
      if ($("#confirmOverlay").classList.contains("open")) return $("#confirmOverlay").classList.remove("open");
      if ($("#sheetOverlay").classList.contains("open")) return closeSheet();
      if ($("#formOverlay").classList.contains("open")) return closeForm();
      if (state.selectedId != null && !typing) return closeDetail();
    }
    if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); }
    if (e.key === "n" && !typing && !document.querySelector(".overlay.open")) openForm(null);
  });

  renderList();
})();
</script>
</body>
</html>
