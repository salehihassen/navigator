<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trip Atlas — Mockup A · Night Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="../shared/data.js"></script>
<style>
  :root {
    --bg: #04060d;
    --glass: rgba(13, 17, 30, 0.58);
    --glass-strong: rgba(13, 17, 30, 0.82);
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #e8ecf6;
    --muted: #8a93ab;
    --dim: #5b647c;
    --accent: #7c9cff;
    --radius: 18px;
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --top: 84px;
    --panel-w: 340px;
    --detail-w: 452px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  img { display: block; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- space backdrop + map ---------- */
  #stars { position: fixed; inset: 0; z-index: 0; }
  .nebula { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 50% at 78% 18%, rgba(88, 60, 200, .18), transparent 70%),
      radial-gradient(50% 45% at 12% 85%, rgba(14, 116, 144, .16), transparent 70%),
      radial-gradient(40% 40% at 50% 50%, rgba(30, 58, 138, .12), transparent 70%); }
  #map { position: fixed; inset: 0; z-index: 1; }
  .maplibregl-canvas { outline: none; }
  .maplibregl-ctrl-attrib { background: rgba(10,13,24,.6) !important; color: var(--dim); font-size: 10px; border-radius: 8px 0 0 0; }
  .maplibregl-ctrl-attrib a { color: var(--muted) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(1); }
  .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(2,3,8,.75) 100%); }
  body.picking .vignette { box-shadow: inset 0 0 0 3px var(--pick, #7c9cff); }
  body.picking #map { cursor: crosshair; }
  body.picking .maplibregl-canvas { cursor: crosshair !important; }

  .glass { background: var(--glass); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* ---------- top bar ---------- */
  .topbar { position: fixed; z-index: 20; top: 14px; left: 14px; right: 14px; height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: "Space Grotesk", Inter, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .2px; white-space: nowrap; margin-right: 6px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 35% 30%, #a5b8ff, #3b5bdb 45%, #111a3d 75%);
    box-shadow: 0 0 18px rgba(99, 132, 255, .55), inset -4px -5px 10px rgba(0,0,0,.5); }
  .brand-mark::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid rgba(165,184,255,.35); transform: rotate(-20deg) scaleY(.38); }
  .brand small { font-family: Inter; font-weight: 500; font-size: 11px; color: var(--muted); margin-left: 2px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 11px; }
  .seg button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 13px; transition: .2s var(--ease); white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: rgba(255,255,255,.1); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 4px 14px rgba(0,0,0,.3); }
  .seg button .dot { width: 7px; height: 7px; border-radius: 50%; }
  .spacer { flex: 1; }
  .search { position: relative; display: flex; align-items: center; width: 260px; }
  .search svg { position: absolute; left: 11px; color: var(--muted); }
  .search input { width: 100%; height: 36px; padding: 0 34px 0 34px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); outline: none; transition: .2s; }
  .search input:focus { border-color: rgba(124,156,255,.5); background: rgba(255,255,255,.07); box-shadow: 0 0 0 3px rgba(124,156,255,.12); }
  .search kbd { position: absolute; right: 9px; font: 11px Inter; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 13px; white-space: nowrap; transition: .2s var(--ease); }
  .btn-primary { color: #fff; background: linear-gradient(135deg, #6d8bff, #8b5cf6); box-shadow: 0 6px 22px rgba(109,139,255,.35), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(109,139,255,.45), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn-primary:disabled { opacity: .45; transform: none; cursor: not-allowed; }
  .btn-ghost { color: var(--text); background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .btn-ghost:hover { background: rgba(255,255,255,.1); }
  .btn-danger { color: #fff; background: linear-gradient(135deg, #ef4444, #be123c); box-shadow: 0 6px 20px rgba(239,68,68,.3); }
  .btn-sm { height: 30px; padding: 0 11px; font-size: 12px; border-radius: 9px; }
  .icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 10px; color: var(--muted); transition: .2s; }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,.08); }

  /* ---------- trip list panel ---------- */
  #tripPanel { position: fixed; z-index: 10; top: var(--top); left: 14px; bottom: 44px; width: var(--panel-w); display: flex; flex-direction: column; overflow: hidden; transition: transform .45s var(--ease); }
  .panel-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .panel-head h1 { margin: 0; font: 600 15px "Space Grotesk", Inter; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .stats { display: flex; gap: 6px; margin-top: 10px; }
  .stat { flex: 1; padding: 8px 10px; border-radius: 11px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
  .stat b { display: block; font: 600 16px "Space Grotesk", Inter; }
  .stat span { font-size: 11px; color: var(--muted); }
  .drawer-handle { display: none; }
  .trip-list { flex: 1; overflow-y: auto; padding: 6px 8px 14px; }
  .group-title { display: flex; align-items: center; gap: 8px; margin: 14px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); }
  .group-title .count { font-weight: 500; color: var(--dim); letter-spacing: 0; text-transform: none; }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .year { margin: 10px 10px 4px; font: 600 11px "Space Grotesk"; color: var(--dim); }
  .trip { position: relative; display: flex; gap: 12px; align-items: center; width: 100%; padding: 8px; border-radius: 13px; text-align: left; transition: background .2s, transform .2s var(--ease); }
  .trip:hover { background: rgba(255,255,255,.05); }
  .trip.active { background: color-mix(in srgb, var(--c) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); }
  .trip.hl { background: rgba(255,255,255,.06); }
  .trip .thumb { position: relative; width: 54px; height: 54px; border-radius: 11px; overflow: hidden; flex: none; background: #1a2035; }
  .trip .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .trip .thumb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .trip.planned .thumb img { filter: saturate(.6) brightness(.85); }
  .trip .info { flex: 1; min-width: 0; }
  .trip .title { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
  .trip.planned .cdot { background: transparent; border: 1.5px dashed var(--c); box-shadow: none; width: 9px; height: 9px; }
  .trip .sub { margin-top: 3px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip .meta { margin-top: 4px; display: flex; gap: 10px; font-size: 11px; color: var(--dim); }
  .trip .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .trip .meta svg { width: 12px; height: 12px; }
  .trip .soon { position: absolute; top: 9px; right: 9px; font-size: 10.5px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); padding: 2px 7px; border-radius: 20px; }
  .empty { padding: 30px 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty svg { width: 30px; height: 30px; color: var(--dim); margin-bottom: 8px; }

  /* ---------- detail panel ---------- */
  #detail { position: fixed; z-index: 12; top: var(--top); right: 14px; bottom: 14px; width: var(--detail-w); overflow: hidden; display: flex; flex-direction: column;
    transform: translateX(calc(100% + 30px)); opacity: 0; transition: transform .5s var(--ease), opacity .35s; background: var(--glass-strong); }
  #detail.open { transform: none; opacity: 1; }
  #detail .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .d-hero { position: relative; height: 230px; overflow: hidden; }
  .d-hero img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); animation: heroIn 1.2s var(--ease) both; }
  @keyframes heroIn { from { transform: scale(1.15); opacity: 0; } to { transform: scale(1.04); opacity: 1; } }
  .d-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,10,20,.15) 0%, rgba(8,10,20,.0) 35%, rgba(10,13,24,.92) 100%); }
  .d-hero .accent-line { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; z-index: 2; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .d-close { position: absolute; z-index: 3; top: 12px; right: 12px; background: rgba(0,0,0,.4); backdrop-filter: blur(10px); color: #fff; }
  .d-hero-text { position: absolute; z-index: 2; left: 20px; right: 20px; bottom: 16px; }
  .d-hero h2 { margin: 8px 0 4px; font: 600 26px/1.1 "Space Grotesk", Inter; letter-spacing: -.2px; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  .d-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: #c9d0e2; font-size: 12.5px; }
  .d-meta span { display: inline-flex; align-items: center; gap: 5px; }
  .d-meta svg { width: 13px; height: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; letter-spacing: .3px; }
  .chip.status { background: color-mix(in srgb, var(--accent) 25%, rgba(0,0,0,.4)); color: #fff; border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); backdrop-filter: blur(6px); }
  .chip.status.planned { background: rgba(0,0,0,.35); border-style: dashed; }
  .d-body { padding: 16px 20px 28px; }
  .d-actions { display: flex; gap: 8px; }
  .d-actions .btn-primary { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 85%, #fff 0%), color-mix(in srgb, var(--accent) 60%, #4c1d95)); box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 1px 0 rgba(255,255,255,.25); }
  .d-actions .grow { flex: 1; }
  .countdown { margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .countdown b { font: 600 26px "Space Grotesk"; color: var(--accent); }
  .countdown span { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: #c9d0e2; }
  .tag::before { content: "#"; color: var(--accent); margin-right: 1px; }
  .summary { margin: 12px 0 0; color: #c3cad9; line-height: 1.55; font-size: 13.5px; }
  .sec { margin-top: 22px; }
  .sec-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sec-h h3 { margin: 0; font: 600 13px "Space Grotesk", Inter; letter-spacing: 1px; text-transform: uppercase; color: #dfe4f0; }
  .sec-h .muted { color: var(--dim); font-size: 12px; }
  .sec-h .spacer { flex: 1; }
  .src-summary { display: flex; flex-wrap: wrap; gap: 4px; margin: -4px 0 10px; }
  .stops { list-style: none; margin: 0; padding: 0; position: relative; }
  .stops::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; background: linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 20%, transparent)); opacity: .5; }
  #detail.planned .stops::before { background: repeating-linear-gradient(var(--accent) 0 5px, transparent 5px 10px); }
  .stops li { position: relative; display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 0; border-radius: 10px; cursor: pointer; transition: background .2s; }
  .stops li:hover { background: rgba(255,255,255,.04); }
  .stops .n { position: relative; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; flex: none; background: var(--accent); color: #0b0f1c; box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); }
  #detail.planned .stops .n { background: #0f1424; color: var(--accent); border: 1.5px dashed var(--accent); box-shadow: none; }
  .stops .nm { font-weight: 600; font-size: 13.5px; }
  .stops .dist { font-size: 11.5px; color: var(--dim); }
  .stops .go { margin-left: auto; color: var(--dim); opacity: 0; transition: .2s; }
  .stops li:hover .go { opacity: 1; }

  /* masonry */
  .masonry { columns: 2; column-gap: 8px; }
  .tile { position: relative; break-inside: avoid; margin: 0 0 8px; border-radius: 12px; overflow: hidden; cursor: zoom-in; background: #151b2e; transform: translateZ(0); }
  .tile img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s, transform .6s var(--ease); }
  .tile img.loaded { opacity: 1; }
  .tile:hover img { transform: scale(1.05); }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); pointer-events: none; }
  .tile figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 8px; font-size: 12px; font-weight: 500; background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0; transform: translateY(6px); transition: .25s var(--ease); }
  .tile:hover figcaption { opacity: 1; transform: none; }
  .tile .badge { position: absolute; top: 7px; left: 7px; z-index: 1; }
  .tile .play { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.3); }
  .tile .play svg { width: 16px; height: 16px; fill: #fff; stroke: none; margin-left: 2px; }
  .tile .dur { position: absolute; right: 7px; bottom: 7px; z-index: 1; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
  .tile:hover .dur { opacity: 0; }
  .tile .ext { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; background: rgba(0,0,0,.5); }
  .tile .ext svg { width: 12px; height: 12px; }
  .tile.new, .card.new { animation: pop .6s var(--ease); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: .3px; padding: 3px 7px 3px 5px; border-radius: 7px; color: #fff; backdrop-filter: blur(8px); background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12); white-space: nowrap; }
  .badge svg { width: 11px; height: 11px; }
  .badge.immich svg { color: #8fb0ff; }
  .badge.local svg { color: #cbd5e1; }
  .badge.instagram { background: linear-gradient(135deg, rgba(131,58,180,.85), rgba(253,29,29,.85) 60%, rgba(252,176,69,.85)); border-color: transparent; }
  .badge.youtube { background: rgba(230,0,35,.88); border-color: transparent; }
  .badge.tiktok { background: rgba(10,10,10,.85); box-shadow: -1.5px 0 0 #25f4ee, 1.5px 0 0 #fe2c55; }
  .badge.web svg { color: #93c5fd; }
  .badge.flat { backdrop-filter: none; }

  /* inspiration board */
  .card { break-inside: avoid; margin: 0 0 8px; border-radius: 13px; overflow: hidden; background: rgba(255,255,255,.04); border: 1px solid var(--line); cursor: pointer; transition: transform .25s var(--ease), border-color .25s; }
  .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .card .tile { margin: 0; border-radius: 0; }
  .card .tile::after { display: none; }
  .card-body { padding: 9px 11px 11px; }
  .card-body p { margin: 0; font-size: 12.5px; font-weight: 500; line-height: 1.35; }
  .card-body .domain { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 11px; color: var(--dim); }
  .card-body .domain svg { width: 11px; height: 11px; }
  .archived { color: #4ade80 !important; }
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; transition: background .2s; }
  .checklist li:hover { background: rgba(255,255,255,.04); }
  .checklist .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; flex: none; transition: .2s; }
  .checklist .box svg { width: 12px; height: 12px; opacity: 0; color: #0b0f1c; stroke-width: 3; }
  .checklist li.done .box { background: var(--accent); border-color: var(--accent); }
  .checklist li.done .box svg { opacity: 1; }
  .checklist li.done .txt { color: var(--dim); text-decoration: line-through; }
  .checklist .txt { flex: 1; font-size: 13px; }
  .checklist .rm { opacity: 0; color: var(--dim); }
  .checklist li:hover .rm { opacity: 1; }
  .add-note { display: flex; gap: 8px; margin-top: 6px; }
  .input { width: 100%; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.04); outline: none; transition: .2s; }
  .input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); background: rgba(255,255,255,.06); }
  textarea.input { height: auto; padding: 10px 12px; resize: vertical; min-height: 70px; line-height: 1.45; }
  .empty-media { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 26px 16px; text-align: center; color: var(--muted); }

  /* ---------- map ui ---------- */
  .map-ctrls { position: fixed; z-index: 9; right: 14px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; transition: right .5s var(--ease); }
  body.detail-open .map-ctrls { right: calc(var(--detail-w) + 28px); }
  .map-ctrls .glass:not(.rotate-pill) { display: flex; flex-direction: column; padding: 4px; border-radius: 13px; }
  .map-ctrls .icon-btn { color: #cbd2e3; }
  .rotate-pill { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; border-radius: 12px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .rotate-pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: .3s; }
  .rotate-pill.on { color: #dfe6ff; }
  .rotate-pill.on .led { background: #6ee7b7; box-shadow: 0 0 10px #6ee7b7; animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  .maptip { position: fixed; z-index: 30; pointer-events: none; padding: 8px 11px; border-radius: 11px; font-size: 12px; transform: translate(-50%, calc(-100% - 16px)); opacity: 0; transition: opacity .15s; white-space: nowrap; border-radius: 12px; }
  .maptip.show { opacity: 1; }
  .maptip b { display: block; font-size: 13px; }
  .maptip span { color: var(--muted); }
