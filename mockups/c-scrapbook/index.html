<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Atlas — Mockup C (Scrapbook)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="../shared/data.js"></script>
<style>
  :root {
    --paper: #fffaf1;
    --paper-2: #fdf3e1;
    --ink: #2d2a35;
    --muted: #7a7486;
    --line: #ece3d3;
    --coral: #ff6b5b;
    --coral-dark: #e8503f;
    --sun: #ffd84d;
    --mint: #3ccf9b;
    --sky: #4aa8ff;
    --shadow-sm: 0 2px 6px rgba(60, 40, 20, .10);
    --shadow: 0 8px 24px rgba(60, 40, 20, .16), 0 2px 6px rgba(60, 40, 20, .08);
    --shadow-lg: 0 24px 60px rgba(40, 25, 10, .28), 0 6px 18px rgba(40, 25, 10, .12);
    --radius: 18px;
    --hand: "Caveat", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Nunito", "DM Sans", system-ui, sans-serif;
    color: var(--ink);
    background: #e9f2f5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #map { position: fixed; inset: 0; }
  .maplibregl-ctrl-top-right { top: 78px; }
  .maplibregl-ctrl-group { border-radius: 14px !important; box-shadow: var(--shadow) !important; overflow: hidden; }
  .maplibregl-ctrl-attrib.maplibregl-compact { border-radius: 12px; }

  /* ---------- Top pill ---------- */
  .topbar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: 7px 8px 7px 10px; border-radius: 999px;
    background: rgba(255, 250, 241, .92); backdrop-filter: blur(10px) saturate(1.3);
    box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.8);
    max-width: calc(100vw - 24px);
  }
  .brand { display: flex; align-items: center; gap: 8px; padding-right: 6px; white-space: nowrap; }
  .brand-badge {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(from 200deg, var(--coral), var(--sun), var(--mint), var(--sky), var(--coral));
    box-shadow: inset 0 0 0 3px #fff, var(--shadow-sm); transform: rotate(-8deg);
  }
  .brand-badge svg { width: 18px; height: 18px; color: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .brand-name { font-weight: 900; font-size: 18px; letter-spacing: -.02em; }
  .brand-name span { font-family: var(--hand); font-weight: 700; font-size: 22px; color: var(--coral); margin-left: 2px; }
  .seg {
    display: inline-flex; background: #f1e8d8; border-radius: 999px; padding: 3px; gap: 2px;
  }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 999px;
    font-weight: 800; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .seg button svg { width: 15px; height: 15px; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }
  .seg button:hover:not(.on) { color: var(--ink); }
  .btn {
    border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: 14px;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn-primary { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-dark), var(--shadow-sm); }
  .btn-primary:hover { background: #ff7a6b; }
  .btn-primary:active { box-shadow: 0 1px 0 var(--coral-dark); transform: translateY(3px); }
  .btn-ghost { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--paper-2); }
  .btn-danger { background: #fff; color: #d43c2c; border: 1px solid #f6d0ca; }
  .btn-danger:hover { background: #fff1ef; }
  .btn-danger-solid { background: #e5483a; color: #fff; box-shadow: 0 4px 0 #b9362a; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff;
    display: grid; place-items: center; box-shadow: var(--shadow-sm); flex: none;
  }
  .icon-btn:hover { background: var(--paper-2); }
  .icon-btn svg { width: 18px; height: 18px; }

  .corner-label {
    position: fixed; top: 18px; left: 16px; z-index: 19;
    font-family: var(--hand); font-weight: 700; font-size: 20px; color: var(--ink);
    background: rgba(255, 216, 77, .92); padding: 3px 14px 4px; transform: rotate(-3deg);
    box-shadow: var(--shadow-sm); border-radius: 3px;
    clip-path: polygon(2% 0, 98% 4%, 100% 96%, 0 100%);
    pointer-events: none;
  }

  /* ---------- Markers ---------- */
  .mk-wrap { cursor: pointer; }
  .mk-wrap:hover, .mk-wrap.sel { z-index: 5; }
  .mk {
    position: relative; transform: rotate(var(--r)); transition: transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .25s;
    transform-origin: 50% 100%;
  }
  .mk-wrap:hover .mk, .mk-wrap.sel .mk { transform: rotate(0deg) scale(1.12) translateY(-4px); }
  .mk-past {
    width: 82px; background: #fff; padding: 6px 6px 0; border-radius: 3px;
    box-shadow: 0 6px 14px rgba(40,25,10,.28), 0 1px 2px rgba(40,25,10,.2);
  }
  .mk-photo { width: 70px; height: 66px; background: #ddd center/cover; border-radius: 1px; }
  .mk-cap {
    font-family: var(--hand); font-weight: 700; font-size: 15px; line-height: 1; text-align: center;
    padding: 4px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mk-tape {
    position: absolute; top: -8px; left: 50%; width: 42px; height: 15px; transform: translateX(-50%) rotate(-4deg);
    background: var(--c); opacity: .78; border-radius: 2px;
    background-image: linear-gradient(90deg, rgba(255,255,255,.25) 0 2px, transparent 2px 6px);
    background-size: 6px 100%; box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  .mk-count {
    position: absolute; right: -8px; top: 26px; min-width: 22px; height: 22px; border-radius: 11px;
    background: var(--c); color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center;
    padding: 0 5px; border: 2px solid #fff; box-shadow: var(--shadow-sm);
  }
  .mk-plan {
    width: 92px; padding: 16px 8px 9px; text-align: center; border-radius: 4px;
    background: color-mix(in srgb, var(--c) 22%, #fffbe8);
    outline: 2px dashed color-mix(in srgb, var(--c) 75%, #000 0%); outline-offset: -5px;
    box-shadow: 0 6px 14px rgba(40,25,10,.22);
  }
  .mk-plan .pin { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; color: var(--c); filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
  .mk-plan-title { font-weight: 900; font-size: 12px; line-height: 1.15; }
  .mk-plan-date { font-family: var(--hand); font-size: 16px; font-weight: 700; color: color-mix(in srgb, var(--c) 70%, #000); line-height: 1; margin-top: 3px; }
  .mk-stem { width: 10px; height: 10px; margin: 4px auto 0; border-radius: 50%; background: var(--c); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .mk-wrap.hidden { display: none; }
  .mk-wrap.flash .mk { animation: wiggle .6s ease 2; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) scale(1.12); } 25% { transform: rotate(-6deg) scale(1.16); } 75% { transform: rotate(6deg) scale(1.16); } }

  /* ---------- Timeline ---------- */
  .timeline {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 15;
    width: min(1040px, calc(100vw - 28px));
    background: rgba(255, 250, 241, .94); backdrop-filter: blur(10px);
    border-radius: 22px; box-shadow: var(--shadow); padding: 10px 22px 12px;
    transition: transform .35s ease, opacity .3s;
  }
  body.sheet-open .timeline { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
  .tl-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
  .tl-title { font-family: var(--hand); font-size: 21px; font-weight: 700; }
  .tl-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .tl-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .tl-track { position: relative; height: 54px; }
  .tl-rail { position: absolute; left: 0; right: 0; top: 24px; height: 6px; border-radius: 3px;
    background: repeating-linear-gradient(90deg, #e8dcc6 0 2px, transparent 2px calc(100% / 60)); }
  .tl-rail::after { content: ""; position: absolute; inset: 2px 0; background: #eadfca; border-radius: 2px; z-index: -1; }
  .tl-past { position: absolute; left: 0; top: 24px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #ffd0c6, #ffb3a5); }
  .tl-year { position: absolute; top: 36px; font-size: 12px; font-weight: 800; color: var(--muted); transform: translateX(-50%); }
  .tl-year::before { content: ""; position: absolute; left: 50%; top: -14px; width: 2px; height: 10px; background: #d9cbb1; border-radius: 1px; }
  .tl-dot {
    position: absolute; top: 18px; width: 18px; height: 18px; border-radius: 50%; transform: translateX(-50%);
    border: 3px solid var(--c); background: var(--c); box-shadow: 0 0 0 3px #fff, var(--shadow-sm);
    padding: 0; transition: transform .2s cubic-bezier(.3,1.6,.5,1), opacity .2s;
  }
  .tl-dot.planned { background: #fff; border-style: dashed; }
  .tl-dot:hover, .tl-dot.sel { transform: translateX(-50%) scale(1.35); z-index: 3; }
  .tl-dot.dim { opacity: .25; }
  .tl-dot .tip {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%) rotate(-2deg);
    background: #fff; padding: 5px 10px; border-radius: 10px; box-shadow: var(--shadow); white-space: nowrap;
    font-size: 12px; font-weight: 800; pointer-events: none; opacity: 0; transition: opacity .15s, bottom .15s;
  }
  .tl-dot .tip small { display: block; font-weight: 600; color: var(--muted); }
  .tl-dot:hover .tip { opacity: 1; bottom: 30px; }
  .tl-today { position: absolute; top: 4px; bottom: 16px; width: 2px; background: var(--coral); transform: translateX(-50%); border-radius: 1px; }
  .tl-today span {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%) rotate(-4deg);
    background: var(--coral); color: #fff; font-family: var(--hand); font-weight: 700; font-size: 15px;
    padding: 0 8px; border-radius: 6px; white-space: nowrap; line-height: 1.3;
  }

  /* ---------- Bottom sheet ---------- */
  .sheet-scrim { position: fixed; inset: 0; z-index: 29; background: rgba(30,20,10,.12); opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.sheet-open .sheet-scrim { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 30;
    width: min(1180px, 100vw); height: 70vh; translate: -50% 0;
    transform: translateY(105%); transition: transform .45s cubic-bezier(.2,.9,.25,1), height .35s ease;
    background: var(--paper); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column;
    background-image: radial-gradient(rgba(170,140,90,.07) 1px, transparent 1px); background-size: 14px 14px;
  }
  .sheet.open { transform: translateY(0); }
  .sheet.expanded { height: 92vh; }
  .sheet-handle { padding: 10px 0 6px; display: grid; place-items: center; cursor: grab; touch-action: none; flex: none; }
  .sheet-handle:active { cursor: grabbing; }
  .sheet-handle i { width: 52px; height: 6px; border-radius: 3px; background: #d8cbb4; }
  .sheet-body { overflow-y: auto; padding: 0 30px 40px; flex: 1; overscroll-behavior: contain; }
  .sh-head { display: flex; gap: 22px; align-items: flex-start; padding: 6px 0 14px; }
  .sh-cover {
    flex: none; width: 112px; background: #fff; padding: 7px 7px 26px; transform: rotate(-4deg);
    box-shadow: var(--shadow); position: relative; border-radius: 2px;
  }
  .sh-cover div { width: 98px; height: 98px; background: #eee center/cover; }
  .sh-cover::after { content: ""; position: absolute; top: -9px; left: 30px; width: 50px; height: 18px; background: var(--c); opacity: .75; transform: rotate(5deg); }
  .sh-cover.plan { background: color-mix(in srgb, var(--c) 22%, #fffbe8); outline: 2px dashed var(--c); outline-offset: -6px; display: grid; place-items: center; height: 120px; padding: 0; }
  .sh-cover.plan::after { display: none; }
  .sh-cover.plan svg { width: 46px; height: 46px; color: var(--c); }
  .sh-info { flex: 1; min-width: 0; }
  .sh-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--c2); }
  .sh-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .sh-info h2 { margin: 2px 0 4px; font-size: clamp(26px, 3.4vw, 38px); font-weight: 900; letter-spacing: -.025em; line-height: 1.05; }
  .sh-meta { color: var(--muted); font-weight: 700; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .sh-meta b { color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); }
  .chip.tag { background: color-mix(in srgb, var(--c) 14%, #fff); border-color: color-mix(in srgb, var(--c) 30%, #fff); color: color-mix(in srgb, var(--c) 60%, #000); }
  .chip.tag::before { content: "#"; opacity: .55; }
  .sh-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .summary { font-size: 16px; line-height: 1.5; margin: 0 0 14px; max-width: 70ch; }
  .stops-strip { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 6px 2px 14px; margin-bottom: 6px; border-bottom: 2px dashed var(--line); }
  .stop-chip { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 5px 13px 5px 5px; box-shadow: var(--shadow-sm); white-space: nowrap; font-weight: 800; font-size: 14px; border: 1px solid var(--line); cursor: pointer; }
  .stop-chip:hover { border-color: var(--c); }
  .stop-chip b { width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .stop-link { width: 34px; height: 2px; flex: none; background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 9px); }
  .section-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 8px; flex-wrap: wrap; }
  .section-bar h3 { margin: 0; font-family: var(--hand); font-size: 30px; font-weight: 700; line-height: 1; }
  .section-bar h3 small { font-family: "Nunito"; font-size: 13px; color: var(--muted); font-weight: 800; margin-left: 6px; }

  /* Collage */
  .collage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; padding: 20px 6px 30px; gap: 6px; }
  .pol {
    position: relative; background: #fff; padding: 10px 10px 0; border-radius: 3px; cursor: zoom-in;
    box-shadow: 0 8px 20px rgba(40,25,10,.18), 0 1px 3px rgba(40,25,10,.15);
    transform: rotate(var(--r)) translateY(var(--y)); margin: var(--m);
    transition: transform .3s cubic-bezier(.3,1.5,.5,1), box-shadow .3s; animation: drop .5s cubic-bezier(.3,1.4,.5,1) both;
    animation-delay: var(--d);
  }
  @keyframes drop { from { opacity: 0; transform: rotate(calc(var(--r) * 3)) translateY(-40px) scale(1.1); } }
  .pol:hover { transform: rotate(0) scale(1.06) translateY(-6px); z-index: 4; box-shadow: var(--shadow-lg); }
  .pol .ph { position: relative; background: #eee center/cover; }
  .pol figcaption { font-family: var(--hand); font-size: 20px; font-weight: 700; text-align: center; padding: 6px 4px 10px; line-height: 1.05; }
  .pol .tape { position: absolute; top: -10px; left: 50%; width: 64px; height: 20px; transform: translateX(-50%) rotate(var(--tr)); background: var(--tc); opacity: .7; z-index: 2; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .play span { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; box-shadow: var(--shadow); }
  .play svg { width: 18px; height: 18px; margin-left: 3px; color: var(--ink); }
  .dur { position: absolute; right: 7px; bottom: 7px; background: rgba(20,15,10,.75); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
  .src {
    position: absolute; left: 7px; top: 7px; z-index: 2; display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 900; letter-spacing: .03em; padding: 3px 7px 3px 5px; border-radius: 999px;
    background: rgba(255,255,255,.94); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .src i { width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 8px; }
  .src-immich i { background: conic-gradient(#fa2921 0 25%, #ed79b5 0 50%, #ffb400 0 75%, #1e83f7 0); }
  .src-local i { background: #6b7280; }
  .src-instagram i { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
  .src-tiktok i { background: #111; box-shadow: -1px 0 #25f4ee, 1px 0 #fe2c55; }
  .src-youtube i { background: #ff0000; border-radius: 4px; }
  .src-web i { background: #3b82f6; }

  /* Grid */
  .grid { columns: 4 220px; column-gap: 14px; padding: 10px 0 30px; }
  .gtile { break-inside: avoid; margin-bottom: 14px; position: relative; border-radius: 14px; overflow: hidden; cursor: zoom-in; box-shadow: var(--shadow-sm); background: #eee; animation: fade .35s ease both; animation-delay: var(--d); }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
  .gtile .ph { background: center/cover; transition: transform .4s; }
  .gtile:hover .ph { transform: scale(1.04); }
  .gtile .gcap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 10px; color: #fff; font-weight: 800; font-size: 13px; background: linear-gradient(transparent, rgba(0,0,0,.62)); }
  .gtile .dur { bottom: auto; top: 8px; right: 8px; }

  .empty { text-align: center; padding: 36px 20px; color: var(--muted); font-weight: 700; }
  .empty .stack { width: 120px; height: 100px; margin: 0 auto 14px; position: relative; }
  .empty .stack div { position: absolute; inset: 10px 18px; background: #fff; border: 2px dashed #dccfb8; border-radius: 4px; }
  .empty .stack div:nth-child(1) { transform: rotate(-10deg); }
  .empty .stack div:nth-child(2) { transform: rotate(7deg); }
  .empty .stack div:nth-child(3) { transform: rotate(-1deg); display: grid; place-items: center; font-family: var(--hand); font-size: 22px; color: var(--coral); }

  /* Corkboard */
  .cork {
    border-radius: 20px; padding: 26px; margin-top: 8px;
    background-color: #c99a62;
    background-image:
      radial-gradient(rgba(90,55,20,.35) 1px, transparent 1.5px),
      radial-gradient(rgba(255,230,190,.25) 1px, transparent 1.5px),
      radial-gradient(rgba(120,75,30,.25) 2px, transparent 2.5px);
    background-size: 7px 7px, 11px 11px, 23px 23px;
    background-position: 0 0, 3px 5px, 9px 2px;
    box-shadow: inset 0 0 0 10px #a8763f, inset 0 0 0 12px #8e602f, inset 0 4px 26px rgba(60,30,0,.35), var(--shadow);
    display: grid; grid-template-columns: 1fr 300px; gap: 26px;
  }
  .cork h4 { margin: 0 0 12px; font-family: var(--hand); font-size: 28px; color: #fff; text-shadow: 0 2px 0 rgba(80,45,10,.4); font-weight: 700; }
  .reels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 18px; }
  .reel {
    position: relative; aspect-ratio: 9/16; background: #222 center/cover; border-radius: 10px; cursor: zoom-in;
    box-shadow: 0 10px 18px rgba(40,20,0,.38); transform: rotate(var(--r)); transition: transform .3s cubic-bezier(.3,1.5,.5,1);
    border: 5px solid #fff; animation: drop .5s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d);
  }
  .reel:hover { transform: rotate(0) scale(1.05); z-index: 3; }
  .reel::before { content: ""; position: absolute; inset: 0; border-radius: 5px; background: linear-gradient(180deg, rgba(0,0,0,.25), transparent 30%, transparent 55%, rgba(0,0,0,.8)); }
  .reel .pushpin { position: absolute; top: -13px; left: 50%; margin-left: -11px; width: 22px; height: 22px; z-index: 3; }
  .reel .rcap { position: absolute; left: 10px; right: 10px; bottom: 10px; color: #fff; font-weight: 800; font-size: 13px; line-height: 1.25; }
  .reel .rcap small { display: block; opacity: .8; font-weight: 700; font-size: 11px; margin-top: 3px; }
  .reel .src { top: 9px; left: 9px; }

  function greatCircle(a, b, n = 40) {
    const toR = Math.PI / 180, toD = 180 / Math.PI;
    const [l1, p1] = [a[0] * toR, a[1] * toR], [l2, p2] = [b[0] * toR, b[1] * toR];
    const d = 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
    if (d < 1e-6) return [a, b];
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
      const x = A * Math.cos(p1) * Math.cos(l1) + B * Math.cos(p2) * Math.cos(l2);
      const y = A * Math.cos(p1) * Math.sin(l1) + B * Math.cos(p2) * Math.sin(l2);
      const z = A * Math.sin(p1) + B * Math.sin(p2);
      pts.push([Math.atan2(y, x) * toD, Math.atan2(z, Math.sqrt(x * x + y * y)) * toD]);
    }
    return pts;
  }

  function routeData() {

    return { type: "FeatureCollection", features };

      geometry: { type: "Point", coordinates: [s.lng, s.lat] } }))) };
  }

  /* ================= Timeline ================= */
  function pct(d) { return Math.max(0, Math.min(100, ((d - T0) / (T1 - T0)) * 100)); }
  function renderTimeline() {
    const track = $("#tlTrack");
    let html = `<div class="tl-rail"></div><div class="tl-past" style="width:${pct(TODAY)}%"></div>`;
    for (let y = T0.getFullYear(); y <= T1.getFullYear(); y++) {
      const p = pct(new Date(y, 0, 1));
      html += `<div class="tl-year" style="left:${p === 0 ? 1.5 : p === 100 ? 98.5 : p}%">${y}</div>`;
    }
    html += `<div class="tl-today" style="left:${pct(TODAY)}%"><span>today</span></div>`;
    const sorted = [...trips].filter((t) => t.start).sort((a, b) => parseDate(a.start) - parseDate(b.start));
    for (const t of sorted) {
      const p = pct(parseDate(t.start));
      html += `<button class="tl-dot ${t.status === "planned" ? "planned" : ""} ${visible(t) ? "" : "dim"} ${t.id === state.selectedId ? "sel" : ""}"

  /* ================= Fly ================= */
  function flyToTrip(t) {
    if (!t.stops.length) return;
    const b = new maplibregl.LngLatBounds();
    t.stops.forEach((s) => b.extend([s.lng, s.lat]));
    const H = window.innerHeight, W = window.innerWidth;
    const sheetH = Math.min(H * (W < 760 ? 0.72 : 0.7), H - 150);
    // markers hang above their first stop, so leave headroom under the top bar
    const top = Math.max(60, Math.min(W < 760 ? 150 : 165, H - sheetH - 110));
    const padding = { top, bottom: sheetH + 10, left: Math.min(90, W * 0.15), right: Math.min(90, W * 0.15) };
    map.fitBounds(b, { padding, maxZoom: 6.5, duration: 1800, essential: true });
    const m = markers.get(t.id);
    if (m) { m.el.classList.remove("flash"); void m.el.offsetWidth; m.el.classList.add("flash"); }
  }

    if (!t) return;
    state.selectedId = id;
    renderSheet();
    sheet.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
    document.body.classList.add("sheet-open");
    $("#sheetBody").scrollTop = 0;
    applyMarkerState(); applyLayerState(); renderTimeline();
    flyToTrip(t);
  }
  function closeSheet() {
    sheet.classList.remove("open", "expanded");
    sheet.setAttribute("aria-hidden", "true");
    document.body.classList.remove("sheet-open");
    state.selectedId = null;
    applyMarkerState(); applyLayerState(); renderTimeline();
  }
  $("#scrim").addEventListener("click", closeSheet);

  function itinerary(t) {
    const a = parseDate(t.start), total = tripDays(t), n = t.stops.length;
    if (!a || !total || !n) return t.stops.map((s) => ({ s, label: "" }));
    let cursor = 0;
    return t.stops.map((s, i) => {
      const len = Math.max(1, Math.round(total / n));
      const startDay = Math.min(cursor, total - 1);
      const endDay = i === n - 1 ? total - 1 : Math.min(total - 1, cursor + len - 1);
      cursor = endDay + 1;
      const d1 = new Date(a); d1.setDate(a.getDate() + startDay);
      const d2 = new Date(a); d2.setDate(a.getDate() + endDay);
      const nights = endDay - startDay + 1;
      return { s, label: `${fmtShort(d1)}${endDay > startDay ? " – " + fmtShort(d2) : ""} · ${nights}d` };
    });
  }

  function renderSheet() {
    const t = byId(state.selectedId);
    if (!t) return;
    const body = $("#sheetBody");
    const isPast = t.status === "past";
    const start = parseDate(t.start);
    let statusText = isPast ? "Past trip" : "Planned trip";
    if (!isPast && start) {
      const d = dayDiff(TODAY, start);
      statusText += d > 0 ? ` · in ${d} days` : " · happening now";
    }
    if (isPast && start) {
      const months = Math.round(dayDiff(start, TODAY) / 30.4);
      statusText += months >= 12 ? ` · ${Math.floor(months / 12)}y ${months % 12}m ago` : ` · ${months} months ago`;
    }
    const counts = t.media.reduce((acc, m) => { acc[m.type] = (acc[m.type] || 0) + 1; return acc; }, {});
    body.style.setProperty("--c", t.color);
    body.style.setProperty("--c2", `color-mix(in srgb, ${t.color} 70%, #000)`);
    body.innerHTML = `
      <div class="sh-head">
        ${isPast
          ? `<div class="sh-cover"><div style="background-image:url('${esc(coverOf(t))}')"></div></div>`
          : `<div class="sh-cover plan">${ICON.mapPin}</div>`}
        <div class="sh-info">
          <div class="sh-status"><i></i>${esc(statusText)}</div>
          <h2>${esc(t.title)}</h2>
          <div class="sh-meta">
            <span><b>${esc(fmtRange(t.start, t.end))}</b></span>
            ${tripDays(t) ? `<span>${tripDays(t)} days</span>` : ""}
            <span>${t.stops.length} stop${t.stops.length === 1 ? "" : "s"}</span>
            ${isPast ? `<span>${counts.image || 0} photos · ${counts.video || 0} videos${counts.post ? ` · ${counts.post} links` : ""}</span>` : `<span>${t.media.length} saved posts · ${t.notes.length} notes</span>`}
          </div>
          ${t.tags.length ? `<div class="chips">${t.tags.map((g) => `<span class="chip tag">${esc(g)}</span>`).join("")}</div>` : ""}
        </div>
        <div class="sh-actions">
          <button class="btn btn-primary" data-act="media">${ICON.image}Add media</button>
          <button class="btn btn-ghost" data-act="edit">${ICON.edit}Edit</button>
          <button class="btn btn-danger" data-act="delete">${ICON.trash}Delete</button>
          <button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button>
        </div>
      </div>
      ${t.summary ? `<p class="summary">${esc(t.summary)}</p>` : ""}
      <div class="stops-strip">
        ${t.stops.map((s, i) => `${i ? '<span class="stop-link"></span>' : ""}<button class="stop-chip" data-stop="${i}"><b>${i + 1}</b>${esc(s.name)}</button>`).join("")}
      </div>
      ${isPast ? renderPastBody(t) : renderPlanBody(t)}
    `;
    body.querySelector('[data-act="close"]').onclick = closeSheet;
    body.querySelector('[data-act="edit"]').onclick = () => openTripModal(t);
    body.querySelector('[data-act="delete"]').onclick = () => confirmDelete(t);
    body.querySelector('[data-act="media"]').onclick = () => openMediaDialog(t, isPast ? "immich" : "link");
    $$(".stop-chip", body).forEach((b) => b.onclick = () => {
      const s = t.stops[Number(b.dataset.stop)];
      map.flyTo({ center: [s.lng, s.lat], zoom: 9, duration: 1600, padding: { bottom: window.innerHeight * 0.7, top: 0, left: 0, right: 0 } });
    });
    $$("[data-media]", body).forEach((el) => el.onclick = () => openLightbox(t, Number(el.dataset.media)));
    $$("[data-view]", body).forEach((b) => b.onclick = () => { state.view = b.dataset.view; renderSheet(); });
    $$("[data-add]", body).forEach((b) => b.onclick = () => openMediaDialog(t, b.dataset.add));
    $$(".check input", body).forEach((cb) => cb.onchange = () => { t.notes[Number(cb.dataset.note)].done = cb.checked; });
    const addForm = $(".sticky-add", body);
    if (addForm) {
      addForm.onsubmit = (e) => {
        e.preventDefault();
        const inp = addForm.querySelector("input");
        const v = inp.value.trim();
        if (!v) return;
        t.notes.push({ text: v, done: false });
        renderSheet();
        const again = $(".sticky-add input", body); if (again) again.focus();
      };
    }
  }

  function mediaInner(m, { big = false } = {}) {
    return `${srcBadge(m.src)}
      ${m.type === "video" ? `<div class="play"><span>${ICON.play}</span></div>${m.duration ? `<span class="dur">${esc(m.duration)}</span>` : ""}` : ""}
      ${m.type === "post" && (m.src === "instagram" || m.src === "tiktok" || m.src === "youtube") ? `<div class="play"><span>${ICON.play}</span></div>` : ""}`;
  }

  function renderPastBody(t) {
    const head = `<div class="section-bar">
        <h3>Memories <small>${t.media.length} items</small></h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <div class="seg">
            <button data-view="collage" class="${state.view === "collage" ? "on" : ""}">${ICON.collage}Collage</button>
            <button data-view="grid" class="${state.view === "grid" ? "on" : ""}">${ICON.grid}Grid</button>
          </div>
        </div>
      </div>`;
    if (!t.media.length) return head + emptyState("No memories yet", "immich");
    if (state.view === "grid") {
      return head + `<div class="grid">${t.media.map((m, i) => `
        <div class="gtile" data-media="${i}" style="--d:${i * 40}ms">
          <div class="ph" style="background-image:url('${esc(m.url)}');aspect-ratio:${(1 / aspectOf(m.url)).toFixed(3)}"></div>
          ${mediaInner(m)}
          <div class="gcap">${esc(m.caption || "")}</div>
        </div>`).join("")}</div>`;
    }
    const narrow = window.innerWidth < 760;
    return head + `<div class="collage">${t.media.map((m, i) => {
      const r = rng(`${t.id}-${i}-${m.url}`);
      const w = Math.round((narrow ? 130 : 180) + r() * (narrow ? 40 : 80));
      const ar = Math.min(1.35, Math.max(0.6, aspectOf(m.url)));
      const rot = (r() * 14 - 7).toFixed(1);
      const y = Math.round(r() * 26 - 8);
      const mx = Math.round(r() * 14 - 4);
      const tape = r() > 0.45 ? `<span class="tape" style="--tr:${(r() * 16 - 8).toFixed(0)}deg;--tc:${TAPES[Math.floor(r() * TAPES.length)]}"></span>` : "";
      return `<figure class="pol" data-media="${i}" style="--r:${rot}deg;--y:${y}px;--m:6px ${mx}px;--d:${i * 60}ms;width:${w}px">
          ${tape}
          <div class="ph" style="background-image:url('${esc(m.url)}');height:${Math.round((w - 20) * ar)}px">${mediaInner(m)}</div>
          <figcaption>${esc(m.caption || "")}</figcaption>
        </figure>`;
    }).join("")}</div>`;
  }

  function emptyState(msg, tab) {
    return `<div class="empty"><div class="stack"><div></div><div></div><div>empty!</div></div>
      ${esc(msg)}<br><br><button class="btn btn-primary" data-add="${tab}">${ICON.image}Add media</button></div>`;
  }

  function renderPlanBody(t) {
    const posts = t.media.map((m, i) => ({ m, i }));
    const pinColors = ["#ef4444", "#3b82f6", "#22c55e", "#eab308", "#ec4899"];
    return `<div class="section-bar"><h3>Plan board <small>pin what inspires you</small></h3>
        <button class="btn btn-ghost" data-add="link">${ICON.link}Pin a link</button></div>
      <div class="cork">
        <div>
          <h4>Saved inspiration</h4>
          <div class="reels">
            ${posts.map(({ m, i }) => {
              const r = rng(`reel-${t.id}-${i}`);
              const host = (() => { try { return new URL(m.link).hostname.replace(/^www\./, ""); } catch (e) { return SRC_LABEL[m.src] || ""; } })();
              return `<div class="reel" data-media="${i}" style="background-image:url('${esc(m.url)}');--r:${(r() * 8 - 4).toFixed(1)}deg;--d:${i * 70}ms">
                ${pushpin(pinColors[i % pinColors.length])}
                ${mediaInner(m)}
                <div class="rcap">${esc(m.caption || "")}<small>${esc(host)}</small></div>
              </div>`;
            }).join("")}
            <div class="reel add" data-add="link" style="--r:2deg;--d:${posts.length * 70}ms"><div>${ICON.plus}Pin a reel<br>or post</div></div>
          </div>
        </div>
        <div class="cork-side">
          <div class="sticky">
            <h5>Don't forget!</h5>
            ${t.notes.length ? t.notes.map((n, i) => `<label class="check"><input type="checkbox" data-note="${i}" ${n.done ? "checked" : ""}><span>${esc(n.text)}</span></label>`).join("") : `<div class="check" style="opacity:.6">Nothing yet…</div>`}
            <form class="sticky-add"><input placeholder="add a note…" aria-label="Add note"><button type="submit">+</button></form>
          </div>
          <div class="index-card">
            ${pushpin("#3b82f6")}
            <h5>Itinerary</h5>
            <ol class="itin">
              ${itinerary(t).map(({ s, label }, i) => `<li><b>${i + 1}</b><span>${esc(s.name)}</span><small>${esc(label)}</small></li>`).join("")}
            </ol>
          </div>
        </div>
      </div>`;

  /* ---- Sheet drag ---- */
  (() => {
    const handle = $("#sheetHandle");
    let startY = 0, dy = 0, dragging = false;
    handle.addEventListener("pointerdown", (e) => {
      dragging = true; startY = e.clientY; dy = 0;
      sheet.style.transition = "none";
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      dy = e.clientY - startY;
      const shown = dy < 0 ? dy * 0.35 : dy;
      sheet.style.transform = `translateY(${shown}px)`;
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = "";
      sheet.style.transform = "";
      if (dy > 130) closeSheet();
      else if (dy < -50) sheet.classList.add("expanded");
      else if (dy > 40) sheet.classList.remove("expanded");
      else if (Math.abs(dy) < 4) sheet.classList.toggle("expanded");
    };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  })();

  /* ================= Layer stack (modals) ================= */
  const layer = $("#layer");
  const stack = [];
  function pushLayer(el, onClose) {
    layer.appendChild(el);
    stack.push({ el, onClose });
    return () => closeLayer(el);
  }
  function closeLayer(el) {
    const i = stack.findIndex((s) => s.el === el);
    if (i < 0) return;
    const [item] = stack.splice(i, 1);
    item.el.remove();
    if (item.onClose) item.onClose();
  }
  function modal(html, cls = "") {
    const bd = document.createElement("div");
    bd.className = "backdrop";
    bd.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
    const close = pushLayer(bd);
    bd.addEventListener("mousedown", (e) => { if (e.target === bd) close(); });
    $$("[data-close]", bd).forEach((b) => b.onclick = close);
    return { el: bd, close };
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (stack.length) closeLayer(stack[stack.length - 1].el);
      else if (sheet.classList.contains("open")) closeSheet();
    }
    if (lbState && (e.key === "ArrowRight" || e.key === "ArrowLeft")) lbState.step(e.key === "ArrowRight" ? 1 : -1);
  });

  /* ================= Lightbox ================= */
  let lbState = null;
  function openLightbox(t, index) {
    const el = document.createElement("div");
    el.className = "lightbox";
    let i = index;
    const render = () => {
      const m = t.media[i];
      const isLinkPost = m.type === "post";
      const provider = SRC_LABEL[m.src] || "source";
      el.innerHTML = `
        <div class="lb-count">${i + 1} / ${t.media.length} · ${esc(t.title)}</div>
        <button class="icon-btn lb-close" aria-label="Close">${ICON.close}</button>
        ${t.media.length > 1 ? `<button class="lb-nav prev" aria-label="Previous">${ICON.left}</button><button class="lb-nav next" aria-label="Next">${ICON.right}</button>` : ""}
        <div class="lb-card" style="transform:rotate(${(rng("lb" + i)() * 3 - 1.5).toFixed(1)}deg)">
          <div class="lb-img"><img src="${esc(m.url.replace(/\/(\d+)\/(\d+)$/, (_, w, h) => `/${w * 2}/${h * 2}`))}" alt="${esc(m.caption)}">
            ${m.type === "video" || (isLinkPost && m.src !== "web") ? `<div class="play"><span>${ICON.play}</span></div>` : ""}
            ${m.duration ? `<span class="dur">${esc(m.duration)}</span>` : ""}
          </div>
          <div class="lb-foot">
            <div class="cap">${esc(m.caption || "Untitled")}
              <small>${m.type === "video" ? "Video" : m.type === "post" ? "Saved post" : "Photo"} · ${m.src === "immich" ? "streamed from Immich" : m.src === "local" ? "/media/trips/" + esc(t.title.toLowerCase().replace(/[^a-z]+/g, "-")) : esc(provider)}</small>
            </div>
            ${srcBadge(m.src)}
            ${isLinkPost ? `<a class="btn btn-ghost" href="${esc(m.link || "#")}" target="_blank" rel="noopener">${ICON.ext}Open on ${esc(provider)}</a>
              ${m.src !== "web" ? `<button class="btn btn-ghost" data-archive>${ICON.download}${m.archived ? "Archived" : "Archive locally"}</button>` : ""}` : ""}
            ${!isLinkPost && t.status === "past" ? `<button class="btn btn-ghost" data-cover>${ICON.image}Set as cover</button>` : ""}
          </div>
        </div>`;
      $(".lb-close", el).onclick = () => closeLayer(el);
      const prev = $(".lb-nav.prev", el), next = $(".lb-nav.next", el);
      if (prev) prev.onclick = (e) => { e.stopPropagation(); step(-1); };
      if (next) next.onclick = (e) => { e.stopPropagation(); step(1); };
      const ar = $("[data-archive]", el);
      if (ar) ar.onclick = () => { m.archived = true; toast("Queued yt-dlp archive — saved to media cache"); render(); };
      const cv = $("[data-cover]", el);
      if (cv) cv.onclick = () => { t.cover = m.url; buildMarkers(); renderSheet(); toast("Cover updated"); };
    };
    const step = (d) => { i = (i + d + t.media.length) % t.media.length; render(); };
    el.addEventListener("click", (e) => { if (e.target === el) closeLayer(el); });
    render();
    lbState = { step };
    pushLayer(el, () => { lbState = null; });
  }

  /* ================= Confirm delete ================= */
  function confirmDelete(t) {
    const { el, close } = modal(`
      <div class="confirm">
        <div class="bin">${ICON.trash}</div>
        <h3>Delete “${esc(t.title)}”?</h3>
        <p>This removes the trip, its ${t.stops.length} stops and ${t.media.length} media links. Your originals in Immich and local folders are untouched.</p>
        <div class="acts"><button class="btn btn-ghost" data-close>Keep it</button><button class="btn btn-danger-solid" data-yes>${ICON.trash}Delete trip</button></div>
      </div>`);
    el.querySelector(".modal").style.width = "min(420px, 100%)";
    $("[data-yes]", el).onclick = () => {
      const idx = trips.indexOf(t);
      if (idx >= 0) trips.splice(idx, 1);
      close();
      closeSheet();
      buildMarkers(); refreshMapData(); renderTimeline();
      toast(`Deleted “${t.title}”`);
    };
  }

  /* ================= New / Edit trip ================= */
  function openTripModal(existing) {
    const draft = existing
      ? { title: existing.title, status: existing.status, start: existing.start || "", end: existing.end || "", color: existing.color,
          stops: existing.stops.map((s) => ({ ...s })), cover: existing.cover || "", tags: existing.tags.join(", "), summary: existing.summary || "" }
      : { title: "", status: "planned", start: "", end: "", color: COLORS[trips.length % COLORS.length], stops: [], cover: "", tags: "", summary: "" };
    const stockCovers = ["cv-mountain", "cv-beach", "cv-city", "cv-forest", "cv-desert", "cv-lake"].map((s) => pic(s, 300, 300));
    const ownCovers = existing ? existing.media.filter((m) => m.type !== "post").map((m) => m.url) : [];
    const { el, close } = modal(`
      <div class="modal-head"><h3>${existing ? "Edit trip" : `New trip <span>let's go!</span>`}</h3><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
      <form class="modal-body" id="tripForm" autocomplete="off">
        <div class="field"><label for="fTitle">Title</label><input class="input" id="fTitle" placeholder="e.g. Hokkaido in winter" value="${esc(draft.title)}"></div>
        <div class="row">
          <div class="field"><label>Status</label>
            <div class="seg" id="fStatus"><button type="button" data-s="past">Past</button><button type="button" data-s="planned">Planned</button></div>
          </div>
          <div class="field"><label>Color</label>
            <div class="swatches" id="fColor">${COLORS.map((c) => `<button type="button" class="swatch" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}</div>
          </div>
        </div>
        <div class="row">
          <div class="field"><label for="fStart">Start</label><input class="input" type="date" id="fStart" value="${esc(draft.start)}"></div>
          <div class="field"><label for="fEnd">End</label><input class="input" type="date" id="fEnd" value="${esc(draft.end)}"></div>
        </div>
        <div class="field"><label for="fStop">Stops</label>
          <div class="search-wrap">${ICON.mag}<input class="input" id="fStop" placeholder="Search a place — try “Kyoto”, “Cusco”…" role="combobox" aria-expanded="false"><div class="dropdown" id="fDrop" hidden></div></div>
          <ul class="stop-list" id="fStops"></ul>
        </div>
        <div class="field"><label for="fTags">Tags</label><input class="input" id="fTags" placeholder="food, hike, beach" value="${esc(draft.tags)}"></div>
        <div class="field"><label for="fSummary">Summary</label><input class="input" id="fSummary" placeholder="One line to remember it by" value="${esc(draft.summary)}"></div>
        <div class="field"><label>Cover</label><div class="covers" id="fCovers"></div></div>
      </form>
      <div class="modal-foot"><span class="hint">Stops are geocoded via Nominatim in the real app</span>
        <button class="btn btn-ghost" data-close>Cancel</button>
        <button class="btn btn-primary" id="fSave">${existing ? "Save changes" : `${ICON.plus}Create trip`}</button></div>`);
    el.querySelector(".modal").style.setProperty("--c", draft.color);

    const renderStatus = () => $$("#fStatus button", el).forEach((b) => b.classList.toggle("on", b.dataset.s === draft.status));
    const renderColor = () => { $$("#fColor .swatch", el).forEach((b) => b.classList.toggle("on", b.dataset.c === draft.color)); el.querySelector(".modal").style.setProperty("--c", draft.color); };
    const renderStops = () => {
      $("#fStops", el).innerHTML = draft.stops.map((s, i) => `<li><b>${i + 1}</b>${esc(s.name)}<small>${s.lat.toFixed(2)}, ${s.lng.toFixed(2)}</small><button type="button" data-rm="${i}" aria-label="Remove">${ICON.close}</button></li>`).join("")
        || `<li style="justify-content:center;color:var(--muted);border-style:dashed">No stops yet — search above to add your first</li>`;
      $$("[data-rm]", el).forEach((b) => b.onclick = () => { draft.stops.splice(Number(b.dataset.rm), 1); renderStops(); });
    };
    const renderCovers = () => {
      const opts = [...new Set([...ownCovers, ...stockCovers])];
      $("#fCovers", el).innerHTML = `<button type="button" class="cover-opt none ${!draft.cover ? "on" : ""}" data-cv="">auto</button>` +
        opts.map((u) => `<button type="button" class="cover-opt ${draft.cover === u ? "on" : ""}" data-cv="${esc(u)}" style="background-image:url('${esc(u)}')"></button>`).join("");
      $$("[data-cv]", el).forEach((b) => b.onclick = () => { draft.cover = b.dataset.cv; renderCovers(); });
    };
    renderStatus(); renderColor(); renderStops(); renderCovers();
    $$("#fStatus button", el).forEach((b) => b.onclick = () => { draft.status = b.dataset.s; renderStatus(); });
    $$("#fColor .swatch", el).forEach((b) => b.onclick = () => { draft.color = b.dataset.c; renderColor(); });

    // Place search
    const inp = $("#fStop", el), drop = $("#fDrop", el);
    let results = [], active = 0;
    const renderDrop = () => {
      const q = inp.value.trim().toLowerCase();
      if (!q) { drop.hidden = true; inp.setAttribute("aria-expanded", "false"); return; }
      results = GAZETTEER.filter((g) => g.name.toLowerCase().includes(q) || g.country.toLowerCase().includes(q)).slice(0, 6);
      drop.hidden = false; inp.setAttribute("aria-expanded", "true");
      drop.innerHTML = results.length
        ? results.map((g, i) => `<button type="button" data-g="${i}" class="${i === active ? "active" : ""}"><span class="flag">${g.cc}</span>${esc(g.name)}<small>${esc(g.country)}</small></button>`).join("")
        : `<button type="button" disabled style="color:var(--muted)">No places match “${esc(inp.value)}”</button>`;
      $$("[data-g]", drop).forEach((b) => b.onmousedown = (e) => { e.preventDefault(); pick(results[Number(b.dataset.g)]); });
    };
    const pick = (g) => {
      if (!g) return;
      draft.stops.push({ name: g.name, lng: g.lng, lat: g.lat });
      inp.value = ""; active = 0; renderDrop(); renderStops();
      inp.classList.remove("err");
    };
    inp.addEventListener("input", () => { active = 0; renderDrop(); });
    inp.addEventListener("blur", () => setTimeout(() => { drop.hidden = true; }, 120));
    inp.addEventListener("keydown", (e) => {
      if (drop.hidden) return;
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(results.length - 1, active + 1); renderDrop(); }
      if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); renderDrop(); }
      if (e.key === "Enter") { e.preventDefault(); pick(results[active]); }
    });
    $("#tripForm", el).addEventListener("submit", (e) => e.preventDefault());

    $("#fSave", el).onclick = () => {
      draft.title = $("#fTitle", el).value.trim();
      draft.start = $("#fStart", el).value;
      draft.end = $("#fEnd", el).value;
      let ok = true;
      if (!draft.title) { $("#fTitle", el).classList.remove("err"); void el.offsetWidth; $("#fTitle", el).classList.add("err"); ok = false; }
      if (!draft.stops.length) { inp.classList.remove("err"); void el.offsetWidth; inp.classList.add("err"); ok = false; }
      if (draft.start && draft.end && draft.end < draft.start) { $("#fEnd", el).classList.add("err"); ok = false; }
      if (!ok) { toast("Add a title and at least one stop"); return; }
      const fields = {
        title: draft.title, status: draft.status, start: draft.start || null, end: draft.end || draft.start || null,
        color: draft.color, stops: draft.stops, cover: draft.cover || undefined,
        tags: $("#fTags", el).value.split(",").map((s) => s.trim()).filter(Boolean),
        summary: $("#fSummary", el).value.trim(),
      };
      let id;
      if (existing) {
        Object.assign(existing, fields);
        if (!fields.cover) delete existing.cover;
        id = existing.id;
        toast("Trip updated");
      } else {
        id = Math.max(0, ...trips.map((t) => t.id)) + 1;
        trips.push({ id, ...fields, media: [], notes: [] });
        toast(`“${fields.title}” added to your atlas`);
      }
      close();
      const t = byId(id);
      if (!visible(t)) setFilter("all");
      buildMarkers(); refreshMapData(); renderTimeline();
      openTrip(id);
    };
    setTimeout(() => $("#fTitle", el).focus(), 50);
  }

  /* ================= Add media dialog ================= */
  const ALBUMS = [
    { name: "Japan 2025", count: 214, seed: "alb-jp" }, { name: "Portugal summer", count: 168, seed: "alb-pt" },
    { name: "Iceland camper", count: 342, seed: "alb-is" }, { name: "Best of 2024", count: 61, seed: "alb-best" },
    { name: "Food pics", count: 97, seed: "alb-food" }, { name: "Phone camera roll", count: 8412, seed: "alb-roll" },
  ];
  const FOLDERS = {
    "/media/trips": ["2023-iceland", "2024-portugal", "2025-japan", "gopro-raw", "phone-exports"],
    "/media/trips/2023-iceland": [], "/media/trips/2024-portugal": [], "/media/trips/2025-japan": [],
    "/media/trips/gopro-raw": [], "/media/trips/phone-exports": [],
  };
  function fakeFiles(path) {
    const r = rng(path);
    const n = 9 + Math.floor(r() * 6);
    return Array.from({ length: n }, (_, i) => {
      const vid = r() > 0.75;
      const num = 1000 + Math.floor(r() * 8999);
      return { name: vid ? `MVI_${num}.mp4` : `IMG_${num}.jpg`, type: vid ? "video" : "image",
        url: pic(`lf-${path}-${i}`, 600, r() > 0.5 ? 400 : 750), duration: vid ? `${Math.floor(r() * 3)}:${String(Math.floor(r() * 60)).padStart(2, "0")}` : null };
    });
  }
  function detectProvider(url) {
    const u = url.toLowerCase();
    if (u.includes("instagram.com")) return "instagram";
    if (u.includes("tiktok.com")) return "tiktok";
    if (u.includes("youtube.com") || u.includes("youtu.be")) return "youtube";
    return "web";
  }

  function openMediaDialog(t, startTab = "immich") {
    const sel = { immich: new Set(), album: null, local: new Set(), link: null };
    let tab = startTab, folder = "/media/trips/" + (t.status === "past" ? FOLDERS["/media/trips"][Math.min(2, (t.id + 1) % 3)] : "phone-exports");
    const start = parseDate(t.start), end = parseDate(t.end);
    const future = !start || start > TODAY;
    const suggestions = future ? [] : Array.from({ length: 15 }, (_, i) => {
      const r = rng(`imm-${t.id}-${i}`);
      const d = new Date(start); d.setDate(start.getDate() + Math.floor(r() * Math.max(1, tripDays(t))));
      const vid = r() > 0.8;
      return { url: pic(`imm-${t.id}-${i}`, 600, r() > 0.5 ? 400 : 800), type: vid ? "video" : "image", when: fmtShort(d),
        duration: vid ? `0:${String(10 + Math.floor(r() * 49))}` : null, caption: `${t.stops[Math.floor(r() * t.stops.length)]?.name || "Trip"} · ${fmtShort(d)}` };
    });

    const { el, close } = modal(`
      <div class="modal-head"><h3>Add media <span>to ${esc(t.title)}</span></h3><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
      <div class="tabs">
        <button class="tab" data-tab="immich"><span class="src src-immich" style="position:static;box-shadow:none;padding:0;background:none"><i></i></span>Immich</button>
        <button class="tab" data-tab="local">${ICON.folder.replace("<svg", '<svg style="color:#f2b84b"')}Local folder</button>
        <button class="tab" data-tab="link">${ICON.link}Link</button>
      </div>
      <div class="modal-body" id="mBody" style="min-height:380px"></div>
      <div class="modal-foot"><span class="hint" id="mHint"></span><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="mAdd"></button></div>`, "wide");

    const body = $("#mBody", el), addBtn = $("#mAdd", el), hint = $("#mHint", el);
    const updateFoot = () => {
      let n = 0, label = "Add";
      if (tab === "immich") { n = sel.immich.size + (sel.album ? 1 : 0); label = sel.album && !sel.immich.size ? "Link album" : `Add ${sel.immich.size || ""} photo${sel.immich.size === 1 ? "" : "s"}`; hint.textContent = sel.album ? `Album “${sel.album.name}” will stay in sync` : "References only — nothing is copied"; }
      if (tab === "local") { n = sel.local.size; label = `Add ${n || ""} file${n === 1 ? "" : "s"}`; hint.textContent = "Read-only mount · paths stored relative to root"; }
      if (tab === "link") { n = sel.link ? 1 : 0; label = t.status === "planned" ? "Pin to board" : "Add link"; hint.textContent = "OpenGraph → yt-dlp → plain card fallback"; }
      addBtn.innerHTML = `${ICON.plus}${esc(label.replace(/\s+/g, " "))}`;
      addBtn.disabled = !n; addBtn.style.opacity = n ? "1" : ".5";
    };

    const renderImmich = () => {
      body.innerHTML = `
        <div class="note-bar">${srcBadge("immich")}
          ${future ? `<span><b>No photos yet</b> — this trip is in the future. Link an album and new shots will appear automatically.</span>`
            : `<span>Suggested from <b>${esc(fmtRange(t.start, t.end))}</b> · near ${t.stops.length} stops · <b>${suggestions.length}</b> matches</span><span class="spacer"></span><button class="btn btn-ghost" id="selAll" style="padding:5px 12px;font-size:12px">Select all</button>`}
        </div>
        ${future ? "" : `<div class="pick-grid">${suggestions.map((s, i) => `<button class="pick ${sel.immich.has(i) ? "on" : ""}" data-i="${i}" style="background-image:url('${esc(s.url.replace(/\/\d+\/\d+$/, "/300/300"))}')"><span class="tick"></span><span class="when">${esc(s.when)}</span>${s.duration ? `<span class="dur">${s.duration}</span>` : ""}</button>`).join("")}</div>`}
        <div class="subhead">Or link an album</div>
        <div class="albums">${ALBUMS.map((a, i) => `<button class="album ${sel.album === a ? "on" : ""}" data-a="${i}"><div style="background-image:url('${pic(a.seed, 120, 120)}')"></div><span>${esc(a.name)}<small>${a.count.toLocaleString()} items</small></span></button>`).join("")}</div>`;
      $$("[data-i]", body).forEach((b) => b.onclick = () => { const i = Number(b.dataset.i); sel.immich.has(i) ? sel.immich.delete(i) : sel.immich.add(i); b.classList.toggle("on"); updateFoot(); });
      $$("[data-a]", body).forEach((b) => b.onclick = () => { const a = ALBUMS[Number(b.dataset.a)]; sel.album = sel.album === a ? null : a; renderImmich(); updateFoot(); });
      const sa = $("#selAll", body);
      if (sa) sa.onclick = () => { const all = sel.immich.size === suggestions.length; sel.immich.clear(); if (!all) suggestions.forEach((_, i) => sel.immich.add(i)); renderImmich(); updateFoot(); };
    };

    const renderLocal = () => {
      const files = folder === "/media/trips" ? [] : fakeFiles(folder);
      const parts = folder.split("/").filter(Boolean);
      body.innerHTML = `
        <div class="fb">
          <div class="fb-tree">
            <button data-f="/media/trips" class="${folder === "/media/trips" ? "on" : ""}">${ICON.folder}trips</button>
            ${FOLDERS["/media/trips"].map((f) => `<button data-f="/media/trips/${f}" class="${folder.endsWith("/" + f) ? "on" : ""}" style="padding-left:22px">${ICON.folder}${esc(f)}</button>`).join("")}
          </div>
          <div class="fb-main">
            <div class="crumbs">${parts.map((p, i) => i === parts.length - 1 ? `<b>${esc(p)}</b>` : `<span>${esc(p)}</span><span>/</span>`).join("")}<span style="margin-left:auto;font-family:Nunito">${files.length ? `${files.length} files · ${sel.local.size} selected` : ""}</span></div>
            <div class="files">
              ${folder === "/media/trips" ? FOLDERS["/media/trips"].map((f) => `<button class="file folder" data-open="/media/trips/${f}"><span class="pick">${ICON.folder}</span>${esc(f)}</button>`).join("")
                : files.map((f, i) => { const key = folder + "|" + i; return `<button class="file" data-k="${esc(key)}"><span class="pick ${sel.local.has(key) ? "on" : ""}" style="background-image:url('${esc(f.url.replace(/\/\d+\/\d+$/, "/240/240"))}')"><span class="tick"></span>${f.duration ? `<span class="dur">${f.duration}</span>` : ""}</span>${esc(f.name)}</button>`; }).join("")}
            </div>
          </div>
        </div>`;
      $$("[data-f]", body).forEach((b) => b.onclick = () => { folder = b.dataset.f; renderLocal(); });
      $$("[data-open]", body).forEach((b) => b.onclick = () => { folder = b.dataset.open; renderLocal(); });
      $$("[data-k]", body).forEach((b) => b.onclick = () => { const k = b.dataset.k; sel.local.has(k) ? sel.local.delete(k) : sel.local.add(k); renderLocal(); updateFoot(); });
    };

    let linkTimer = null;
    const renderLink = (stateLink = sel.link ? "ready" : "idle", url = sel.link ? sel.link.link : "") => {
      body.innerHTML = `
        <div class="link-row"><div class="search-wrap" style="flex:1">${ICON.link.replace("<svg", '<svg class="mag"')}<input class="input" id="lUrl" placeholder="Paste an Instagram, TikTok, YouTube or blog URL" value="${esc(url)}"></div>
          <button class="btn btn-primary" id="lGo">Preview</button></div>
        <div class="examples">Try:
          <button data-ex="https://www.instagram.com/reel/C9xYzTrip/">Instagram reel</button>
          <button data-ex="https://www.tiktok.com/@wanderlust/video/7301122">TikTok</button>
          <button data-ex="https://www.youtube.com/watch?v=travel101">YouTube</button>
          <button data-ex="https://www.seat61.com/travel-guide">Blog post</button>
        </div>
        <div id="lPrev">${stateLink === "loading" ? `
          <div class="preview"><div class="pthumb shimmer"></div><div style="flex:1"><div class="shimmer" style="height:14px;width:30%;margin:6px 0 12px"></div><div class="shimmer" style="height:22px;width:80%;margin-bottom:10px"></div><div class="shimmer" style="height:14px;width:55%"></div></div></div>`
          : stateLink === "ready" && sel.link ? (() => { const L = sel.link; const wide = L.src === "youtube" || L.src === "web"; return `
          <div class="preview">
            <div class="pthumb ${wide ? "wide" : ""}" style="background-image:url('${esc(L.url)}')">${srcBadge(L.src)}${L.src !== "web" ? `<div class="play"><span>${ICON.play}</span></div>` : ""}</div>
            <div style="flex:1;min-width:0">
              ${srcBadge(L.src).replace('class="src', 'style="position:static;box-shadow:none;border:1.5px solid var(--line)" class="src')}
              <h4>${esc(L.title)}</h4>
              <div class="meta">${esc(L.author)} · ${esc(L.link)}</div>
              <div class="field" style="margin-bottom:8px"><label for="lCap">Caption</label><input class="input" id="lCap" value="${esc(L.caption)}"></div>
              ${L.src !== "web" ? `<label class="toggle-row"><input type="checkbox" class="switch" id="lArch" ${L.archive ? "checked" : ""}>Archive video locally with yt-dlp <span style="color:var(--muted);font-weight:700;font-size:12px">(survives deleted posts)</span></label>` : ""}
            </div>
          </div>`; })() : `<div class="empty" style="padding:50px 20px"><div class="stack"><div></div><div></div><div>paste!</div></div>Paste a link and we'll fetch a preview card.</div>`}
        </div>`;
      const go = () => {
        const v = $("#lUrl", body).value.trim();
        if (!/^https?:\/\/\S+\.\S+/.test(v)) { $("#lUrl", body).classList.remove("err"); void body.offsetWidth; $("#lUrl", body).classList.add("err"); return; }
        sel.link = null; updateFoot();
        renderLink("loading", v);
        clearTimeout(linkTimer);
        linkTimer = setTimeout(() => {
          const src = detectProvider(v), r = rng(v);
          const titles = {
            instagram: ["Hidden viewpoint nobody talks about", "48 hours eating our way through the old town", "Sunrise hike — worth the 4am alarm"],
            tiktok: ["POV: you found the best street food stall", "3 things I wish I knew before going", "Budget day itinerary under $40"],
            youtube: ["The ultimate 10-day itinerary (2026)", "What to pack — full gear breakdown", "Night train vlog, cabin tour"],
            web: ["The complete guide to getting around", "Where to stay: neighbourhoods compared", "Seasonal travel tips & costs"],
          };
          const title = titles[src][Math.floor(r() * 3)];
          sel.link = { src, type: "post", link: v, title, caption: title, archive: false,
            author: src === "web" ? new URL(v).hostname.replace(/^www\./, "") : "@" + ["wander.with.mia", "nomadnoodles", "trailtales", "slowtravelsam"][Math.floor(r() * 4)],
            url: pic("lk-" + hash(v), src === "youtube" || src === "web" ? 640 : 600, src === "youtube" || src === "web" ? 360 : 1000) };
          renderLink("ready", v); updateFoot();
        }, 900);
      };
      $("#lGo", body).onclick = go;
      $("#lUrl", body).onkeydown = (e) => { if (e.key === "Enter") go(); };
      $$("[data-ex]", body).forEach((b) => b.onclick = () => { $("#lUrl", body).value = b.dataset.ex; go(); });
      const cap = $("#lCap", body); if (cap) cap.oninput = () => { sel.link.caption = cap.value; };
      const arch = $("#lArch", body); if (arch) arch.onchange = () => { sel.link.archive = arch.checked; };
      if (stateLink === "idle") setTimeout(() => { const u = $("#lUrl", body); if (u) u.focus(); }, 30);
    };

    const setTab = (name) => {
      tab = name;
      $$(".tab", el).forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
      ({ immich: renderImmich, local: renderLocal, link: () => renderLink() })[name]();
      updateFoot();
    };
    $$(".tab", el).forEach((b) => b.onclick = () => setTab(b.dataset.tab));

    addBtn.onclick = () => {
      const added = [];
      if (tab === "immich") {
        [...sel.immich].sort((a, b) => a - b).forEach((i) => { const s = suggestions[i]; added.push({ src: "immich", type: s.type, url: s.url, caption: s.caption, duration: s.duration || undefined }); });
        if (sel.album) {
          for (let i = 0; i < 4; i++) added.push({ src: "immich", type: "image", url: pic(`${sel.album.seed}-${t.id}-${i}`, 600, i % 2 ? 800 : 400), caption: `${sel.album.name} #${i + 1}` });
        }
      } else if (tab === "local") {
        [...sel.local].forEach((k) => { const [path, idx] = k.split("|"); const f = fakeFiles(path)[Number(idx)]; added.push({ src: "local", type: f.type, url: f.url, caption: f.name, duration: f.duration || undefined }); });
      } else if (sel.link) {
        const L = sel.link;
        added.push({ src: L.src, type: "post", url: L.url, caption: L.caption || L.title, link: L.link, archived: L.archive });
      }
      if (!added.length) return;
      t.media.push(...added);
      close();
      buildMarkers();
      renderSheet();
      toast(tab === "immich" && sel.album ? `Linked album “${sel.album.name}”` : `Added ${added.length} item${added.length === 1 ? "" : "s"}${tab === "link" && sel.link && sel.link.archive ? " · archiving…" : ""}`);
    };
    setTab(startTab);
  }

  /* ================= Top bar ================= */
  function setFilter(f) {
    state.filter = f;
    $$("#filterSeg button").forEach((b) => b.classList.toggle("on", b.dataset.f === f));
    const sel = byId(state.selectedId);
    if (sel && !visible(sel)) closeSheet();
    applyMarkerState(); applyLayerState(); renderTimeline();
  }
  $$("#filterSeg button").forEach((b) => b.onclick = () => setFilter(b.dataset.f));
  $$("#projSeg button").forEach((b) => b.onclick = () => {
    state.projection = b.dataset.proj;
    $$("#projSeg button").forEach((x) => x.classList.toggle("on", x === b));
    map.setProjection({ type: state.projection });
    if (state.projection === "mercator" && map.getZoom() < 1.3) map.easeTo({ zoom: 1.4, duration: 600 });
  });
  $("#newTripBtn").onclick = () => openTripModal(null);
  let resizeT = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { const t = byId(state.selectedId); if (t && t.status === "past" && state.view === "collage") renderSheet(); }, 200);
  });

  /* ================= Init ================= */
  buildMarkers();
  renderTimeline();
})();
</script>
</body>
</html>
