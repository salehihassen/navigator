# Single-node Garage for production. Secrets come from storage.env
# (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN). Mounted read-only at /etc/garage.toml.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.invalid"

[admin]
api_bind_addr = "[::]:3903"
