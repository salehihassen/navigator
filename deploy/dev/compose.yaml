# Local development dependencies. Always run through scripts/dev-*, which pass
# --env-file .dev/navigator.env. The project name is fixed so these commands can
# never touch another compose project on the machine.
name: navigator-dev

services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: navigator-dev-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-up}
      NAVIGATOR_DB_OWNER_PASSWORD: ${NAVIGATOR_DB_OWNER_PASSWORD:?}
      NAVIGATOR_DB_APP_PASSWORD: ${NAVIGATOR_DB_APP_PASSWORD:?}
    ports:
      - "127.0.0.1:${NAVIGATOR_DEV_DB_PORT:-5450}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: dxflrs/garage:v2.4.1
    container_name: navigator-dev-storage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
    ports:
      - "127.0.0.1:${NAVIGATOR_DEV_S3_PORT:-9450}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - storage:/var/lib/garage

volumes:
  pgdata:
  storage:
