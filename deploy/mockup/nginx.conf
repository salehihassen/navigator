server {
    listen 80;
    server_name _;
    absolute_redirect off;   # keep the scheme/host/port the visitor used (works behind an HTTPS proxy)
    root /usr/share/nginx/html;

    # a private preview: keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }

    # open straight on the power-user mockup; the others stay reachable
    location = / { return 302 /e-d-busy/; }
    location = /all { return 302 /index.html; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;   # redeploys show up immediately
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }
}
