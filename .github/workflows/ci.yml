# Public-repo safe: no repository secrets are used. Database and storage credentials
# are generated per run; the image is pushed with the built-in GITHUB_TOKEN only on
# pushes to main and version tags (never from pull requests or forks).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database, reachable only from this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

      - name: Generate throwaway credentials
        run: |
          hex() { od -An -N"$1" -tx1 /dev/urandom | tr -d ' \n'; }
          for v in NAVIGATOR_DB_OWNER_PASSWORD NAVIGATOR_DB_APP_PASSWORD GARAGE_RPC_SECRET GARAGE_ADMIN_TOKEN NAVIGATOR_S3_SECRET_ACCESS_KEY; do
            val=$(hex 32); echo "::add-mask::$val"; echo "$v=$val" >> "$GITHUB_ENV"
          done
          echo "NAVIGATOR_S3_ACCESS_KEY_ID=GK$(hex 12)" >> "$GITHUB_ENV"

      - name: Create database roles
        env:
          PGHOST: localhost
        run: ../deploy/initdb/01-navigator-roles.sh

      - name: Start Garage
        working-directory: .
        env:
          NAVIGATOR_S3_BUCKET: navigator-media
        run: |
          docker run -d --name ci-garage -p 127.0.0.1:3900:3900 \
            -e GARAGE_RPC_SECRET -e GARAGE_ADMIN_TOKEN \
            -v "$PWD/deploy/dev/garage.toml:/etc/garage.toml:ro" dxflrs/garage:v2.4.1
          scripts/garage-init ci-garage

      - name: Test
        run: |
          export NAVIGATOR_ENV=test
          export NAVIGATOR_DATABASE_URL="postgresql+psycopg://navigator_app:${NAVIGATOR_DB_APP_PASSWORD}@localhost:5432/navigator"
          export NAVIGATOR_MIGRATE_DATABASE_URL="postgresql+psycopg://navigator_owner:${NAVIGATOR_DB_OWNER_PASSWORD}@localhost:5432/navigator"
          export NAVIGATOR_S3_ENDPOINT=http://127.0.0.1:3900 NAVIGATOR_S3_BUCKET=navigator-media
          uv run pytest -ra

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  image:
    needs: [backend, frontend, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
